    CAMT.p0.copy(camera.position); CAMT.t0.copy(controls.target); CAMT.f0 = camera.fov;
    CAMT.p1.set(v.pos[0], v.pos[1], v.pos[2]);
    CAMT.t1.set(v.tgt[0], v.tgt[1], v.tgt[2]);
    CAMT.f1 = f; CAMT.k = 0;
    CAMT.anim = animate(CAMT, {
      k: 1, duration: 950, ease: 'inOutQuart',
      onUpdate: applyCamTween, onComplete: () => { CAMT.anim = null; }
    });
  } else {
    cancelCamTween();
    camera.fov = f;
    camera.updateProjectionMatrix();
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    controls.target.set(v.tgt[0], v.tgt[1], v.tgt[2]);
    controls.update();
  }
}
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + ' ' + v.label;
  b.dataset.id = v.id;
  b.onclick = () => setView(v);
  HUD.views.appendChild(b);
});
/* 用户一动鼠标就把运镜让出去，否则镜头动画会跟拖拽互相抢 */
controls.addEventListener('start', () => cancelCamTween());
setView(VIEWS[0], true);
introIn();

const _cam = new THREE.Vector3();
const _tgt = new THREE.Vector3();
function camUpdate(dt) {
  if (view.follow) {
    let best = null, bs = -1;
    for (const army of [U, C]) {
      for (const u of army.units) {
        if (u.kind === 'art' || u.gone || u.men <= 0) continue;
        const s = (u.state === 'melee' ? 3 : u.state === 'charge' ? 2 : 0.4) + (1 - u.men / u.maxMen);
        if (s > bs) { bs = s; best = u; }
      }
    }
    if (best) {
      const foe = enemyOf(best.army);
      let near = null, nd = 1e9;
      for (const e of foe.units) {
        if (e.kind !== 'inf' || e.men <= 0 || e.gone) continue;
        const d = Math.abs(e.cx - best.cx);
        if (d < nd) { nd = d; near = e; }
      }
      const fz = near ? (Math.sign(near.cz - best.cz) || 1) : 1;
      _cam.set(best.cx + fz * 24, 13 + bs * 2.2, best.cz + fz * 28);
      _tgt.set(best.cx, 3, best.cz + fz * 5);
      camera.position.lerp(_cam, 1 - Math.exp(-dt * 1.6));
      controls.target.lerp(_tgt, 1 - Math.exp(-dt * 2.0));
      if (Math.abs(camera.fov - 44) > 0.02) {
        camera.fov = lerp(camera.fov, 44, 1 - Math.exp(-dt * 2));
        camera.updateProjectionMatrix();
      }
    }
  } else if (view.auto) {
    autoA += dt * 0.085;
    const R = 200;
    _cam.set(Math.sin(autoA) * R, 90, Math.cos(autoA) * R);
    camera.position.lerp(_cam, 1 - Math.exp(-dt * 1.1));
    controls.target.lerp(_tgt.set(0, 6, 0), 1 - Math.exp(-dt * 2));
  }
  /* 跟拍/环绕机位每帧都要真的对准目标：OrbitControls 只在指针事件里 update()，
     不在这里补一次，镜头会平移而朝向僵在切进来的那一帧 */
  if (view.follow || view.auto) controls.update();
}

const clock = new THREE.Timer();
clock.connect(document);
let acc = 0, frames = 0, fpsT = 0, fps = 0;

function loop() {
  clock.update();
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.1);
  if (!B.paused) {
    acc += dt * B.speed;
    let n = 0;
    while (acc >= STEP && n < 8) { simulate(STEP); acc -= STEP; n++; }
    if (n >= 8) acc = 0;
    camUpdate(dt);
    updateHUD(dt);
    bannersUpdate(dt);
    fxTime += raw;
    /* 水面流动：纯视觉、走 UV offset（标准材质 uniform，WebGPU 后端同样成立），
       不碰 rnd/vrnd，因此不影响战局 */
    RIVERFX.map.offset.x = (fxTime * 0.012) % 1;
    RIVERFX.nrm.offset.x = (-fxTime * 0.02) % 1;
  }
  syncArmy(U);
  syncArmy(C);
  airSync();
  vehSync();
  flashPool.sync(); smokePool.sync(); burstPool.sync();
  dustPool.sync(); boomPool.sync(); motePool.sync(); shardPool.sync();
  bloodPool.sync(); dropPool.sync();
  /* 震屏：渲染前叠加平移扰动并重新对准目标，渲完立刻还原位置与朝向，
     绝不污染 camera 的真实状态（相机是渲染态，不是战局态） */
  decayShake(raw);
  const shaking = MOTION.shake.amp > 0.002;
  if (shaking) {
    camera.position.add(_shakeOff);
    _shakeQ.copy(camera.quaternion);
    camera.lookAt(controls.target);
  }
  frames++; fpsT += raw;
  if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  if (renderer.info) renderer.info.reset();
  if (FX.enabled) {
    if (gradePass) gradePass.uniforms.uTime.value = fxTime;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  if (shaking) {
    camera.position.sub(_shakeOff);
    camera.quaternion.copy(_shakeQ);
  }
}
renderer.setAnimationLoop(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) {
    composer.setSize(window.innerWidth, window.innerHeight);
    if (bloomPass) bloomPass.setSize(window.innerWidth, window.innerHeight);
  }
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { B.paused = !B.paused; pausedBadge(B.paused); e.preventDefault(); }
  if (e.key >= '1' && e.key <= '9') setView(VIEWS[+e.key - 1]);
  if (e.key === '[' || e.key === ']') {
    let i = SPEEDS.indexOf(B.speed);
    i = clamp(i + (e.key === ']' ? 1 : -1), 0, SPEEDS.length - 1);
    B.speed = SPEEDS[i];
  }
  if (e.key === 'r' || e.key === 'R') location.reload();
});

function packArmy(a) {
  return a.units.filter(u => u.kind !== 'art').map(u => ({
    name: u.name, type: u.kind, men: u.men, max: u.maxMen, state: u.state,
    morale: +u.morale.toFixed(3), x: +u.cx.toFixed(1), z: +u.cz.toFixed(1)
  }));
}
window.__battle = {
  sim(seconds, step) {
    step = step || STEP;
    const n = Math.max(0, Math.round(seconds / step));
    for (let i = 0; i < n; i++) simulate(step);
    syncArmy(U); syncArmy(C);
    updateHUD(1); bannersUpdate(1);
    return this.state();
  },
  state() {
    return {
      renderer: MODE, t: +B.t.toFixed(2), phase: B.phase, paused: B.paused, speed: B.speed,
      over: B.over, winner: B.winner, fps: +fps.toFixed(1),
      shellsInFlight: shells.filter(s => s.active).length,
      union: packArmy(U), confederate: packArmy(C),
      visibleSprites: this.particles().total,
      particles: this.particles(),
      log: B.entries.slice(-10).map(e => e.t + 's ' + e.text)
    };
  },
  soldier(i, side, kind) {
    const a = side === 'union' ? U : C;
    const s = kind === 'cav' ? a.mount[i] : a.foot[i];
    return {
      x: +s.x.toFixed(3), y: +s.y.toFixed(3), z: +s.z.toFixed(3), yaw: +s.yaw.toFixed(3),
      state: s.state, tilt: +s.tilt.toFixed(3), spd: +s.spd.toFixed(3),
      alive: s.alive, animT: +s.animT.toFixed(3), mounted: s.mounted
 
    };
  },
  partMatrix(idx, side, kind, partId) {
    const a = side === 'union' ? U : C;
    const pool = kind === 'cav' ? a.mountPool : a.footPool;
    const P = pool.parts.find(p => p.def.id === partId);
    if (!P) return null;
    const m = new THREE.Matrix4();
    P.mesh.getMatrixAt(idx, m);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    m.decompose(p, q, s);
    const e = new THREE.Euler().setFromQuaternion(q, 'YXZ');
    return {
      id: partId, pos: [+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)],
      rot: [+e.x.toFixed(4), +e.y.toFixed(4), +e.z.toFixed(4)]
    };
  },
  unit(name) {
    for (const a of [U, C]) for (const u of a.units) if (u.name === name) {
      return { state: u.state, men: u.men, morale: +u.morale.toFixed(3), x: +u.cx.toFixed(2), z: +u.cz.toFixed(2), target: u.target ? u.target.name : null };
    }
    return null;
  },
  camera: id => setView(VIEWS.find(v => v.id === id) || VIEWS[0], true),
  freecam(px, py, pz, tx, ty, tz, fov) {
    cancelCamTween();
    view = { id: 'free', label: '自由', fov: fov || 45 };
    [...HUD.views.children].forEach(b => b.classList.remove('on'));
    camera.fov = fov || 45;
    camera.updateProjectionMatrix();
    camera.position.set(px, py, pz);
    controls.target.set(tx, ty, tz);
    controls.update();
    return { pos: camera.position.toArray(), tgt: controls.target.toArray() };
  },
  pause: v => { B.paused = !!v; pausedBadge(B.paused); },
  speed: v => { B.speed = v; },
  fps: () => +fps.toFixed(1),
  particles() {
    const p = {
      flash: flashPool.alive(), smoke: smokePool.alive(), burst: burstPool.alive(),
      dust: dustPool.alive(), boom: boomPool.alive(), mote: motePool.alive(), shard: shardPool.alive(),
      blood: bloodPool.alive(), drop: dropPool.alive()
    };
    p.total = p.flash + p.smoke + p.burst + p.dust + p.boom + p.mote + p.shard + p.blood + p.drop;
    return p;
  },
  pools(show) {
    const list = [['flash', flashPool], ['smoke', smokePool], ['burst', burstPool], ['dust', dustPool], ['boom', boomPool], ['mote', motePool], ['shard', shardPool], ['blood', bloodPool], ['drop', dropPool]];
    if (show) for (const p of list) p[1].mesh.visible = show.indexOf(p[0]) >= 0;
    return list.map(p => ({
      name: p[0], visible: p[1].mesh.visible, cap: p[1].mesh.count, alive: p[1].alive(),
      blending: p[1].mat.blending, premul: p[1].premul,
      map: p[1].mat.map ? [p[1].mat.map.image.width, p[1].mat.map.image.height] : null,
      color: p[1].mesh.instanceColor ? p[1].mesh.instanceColor.count : null
    }));
  },
  /* 动效/血肉层自检：anime 是否加载、three adapter 是否生效、震屏与曝光当前值、血渍落点数 */
  ux() {
    const el = document.getElementById('paused');
    return {
      anime: animeOK, adapter: adapterOK, motion: MOTION.on,
      shake: +MOTION.shake.amp.toFixed(3),
      exposure: +renderer.toneMappingExposure.toFixed(3),
      camTween: !!CAMT.anim,
      pausedBadge: el ? el.style.display : null,
      impactOpacity: IMPACT_EL ? +(IMPACT_EL.style.opacity || 0) : null,
      blood: bloodPool.alive(), drops: dropPool.alive(), stains: stainIdx,
      trees: treeSpots.length, stainLift: stainLift,
      logNodes: HUD.log.children.length,
      sun: +sun.intensity.toFixed(3),
      fog: '#' + scene.fog.color.getHexString(),
      result: HUD.result.style.display + '/' + (HUD.result.style.opacity || '')
    };
  },
  /* 视觉验收：在镜头目标处喷 n 次血（只走 vrnd，不碰战局） */
  gore(n) {
    const cx = controls.target.x, cz = controls.target.z;
    for (let i = 0, k = Math.max(1, n || 4); i < k; i++) {
      bloodBurst({ x: cx + (vrnd() - 0.5) * 6, y: groundY(cx, cz), z: cz + (vrnd() - 0.5) * 6, state: 'down', crew: false }, 1, 0.3, 1.6);
    }
    return this.particles();
  },
  /* 视觉验收：在镜头目标处触发一次冲击反馈（震屏 + 曝光 + 闪光） */
  impact(power) {
    impactFeedback(power || 1.2, controls.target.x, controls.target.z);
    return this.ux();
  },
  blend(id, mode) {
    const p = { flash: flashPool, smoke: smokePool, burst: burstPool, dust: dustPool, boom: boomPool, mote: motePool, shard: shardPool, blood: bloodPool, drop: dropPool }[id];
    if (!p) return null;
    const m = p.mat;
    if (mode) {
      m.blending = mode === 'additive' ? THREE.AdditiveBlending
        : mode === 'normal' ? THREE.NormalBlending : THREE.CustomBlending;
      if (m.blending === THREE.CustomBlending) {
        m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneMinusSrcAlphaFactor;
      }
      m.needsUpdate = true;
    }
    return { id, blending: m.blending, premul: p.premul };
  },
  fx(mode) {
    if (mode !== undefined) {
      if (!mode) FX.enabled = false;
      else if (composer) FX.enabled = true;
    }
    return {
      mode: MODE, composed: !!composer, enabled: FX.enabled,
      bloomStrength: bloomPass ? bloomPass.strength : 0,
      grain: gradePass ? +gradePass.uniforms.uGrain.value.toFixed(3) : 0,
      drawCallsEstimate: 6 + 1
    };
  },
  postfx(id, v) {
    if (!id || v === undefined) return null;
    if (id === 'bloom' && bloomPass) { bloomPass.strength = v; return bloomPass.strength; }
    if (id === 'threshold' && bloomPass) { bloomPass.threshold = v; return bloomPass.threshold; }
    if (id === 'radius' && bloomPass) { bloomPass.radius = v; return bloomPass.radius; }
    if (id === 'grain' && gradePass) { gradePass.uniforms.uGrain.value = v; return v; }
    if (id === 'vignette' && gradePass) { gradePass.uniforms.uVignette.value = v; return v; }
    return null;
  },
  info: () => renderer.info ? {
    calls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
    programs: renderer.info.programs ? renderer.info.programs.length : null
  } : null,
  air() {
    return {
      craft: AIR.craft.map(c => ({
        side: c.side, kind: c.kind, state: c.state, dead: c.dead,
        x: +c.x.toFixed(1), y: +c.y.toFixed(1), z: +c.z.toFixed(1),
        yaw: +c.yaw.toFixed(3), hp: Math.round(c.hp)
      })),
      guns: AIR.guns.map(g => ({ side: g.side, yaw: +g.yaw.toFixed(2), pitch: +g.pitch.toFixed(2), reload: +g.reload.toFixed(2) })),
      lost: AIR.lost, bombsDropped: AIR.dropped,
      tracers: tracers.filter(t => t.on).length,
      bombs: bombs.filter(b => b.on).length,
      flakInFlight: AIR.flak.length,
      trenchZ: TRENCH_Z
    };
  },
  cover: () => [U, C].map(a => a.units.filter(u => u.kind !== 'art').map(u => u.name + ':' + (u.cover || 0).toFixed(2))).flat(),
  /* 可见性普查：列出"本该看见却没被绘制"或"雾里已经很淡"的对象。
     inFrustum 复刻 three 的判定（Frustum.intersectsObject）——对 InstancedMesh
     它用的是对象自己的 boundingSphere（只在首次渲染算一次，之后不会失效重算）。 */
  census(minFog) {
    const fr = new THREE.Frustum().setFromProjectionMatrix(
      new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    const fog = scene.fog, lim = minFog === undefined ? 0.25 : minFog;
    const rows = [];
    let total = 0, notDrawn = 0;
    scene.traverse(o => {
      if (!o.isMesh && !o.isInstancedMesh) return;
      total++;
      const mat = o.material;
      const inF = o.frustumCulled ? fr.intersectsObject(o) : true;
      const drawn = o.visible && (!mat || mat.visible !== false) && inF;
      if (!drawn) notDrawn++;
      const wp = new THREE.Vector3();
      o.getWorldPosition(wp);
      const d = camera.position.distanceTo(wp);
      const f = fog ? clamp((d - fog.near) / (fog.far - fog.near), 0, 1) : 0;
      if (drawn && f < lim) return;
      rows.push({
        kind: o.isInstancedMesh ? 'Inst' : 'Mesh',
        n: o.count || 1, drawn, vis: o.visible, cull: o.frustumCulled,
        d: Math.round(d), fog: +f.toFixed(2),
        mat: mat ? mat.type.replace('Mesh', '').replace('Material', '') : null,
        opa: mat && mat.opacity !== undefined ? +mat.opacity.toFixed(2) : null
      });
    });
    return { total, notDrawn, rows: rows.slice(0, 40) };
  },
  armor() {
    return {
      tanks: ARMOR.tanks.map(t => ({
        side: t.side, kind: t.hero ? 'hero' : t.heavy ? 'heavy' : 'light', state: t.state, dead: t.dead,
        hp: Math.round(t.hp), maxHp: t.maxHp, x: Math.round(t.x), z: Math.round(t.z)
      })),
      trucks: ARMOR.trucks.map(v => ({ side: v.side, state: v.state, x: Math.round(v.x), z: Math.round(v.z), cargo: v.cargo })),
      motos: ARMOR.motos.map(m => ({ side: m.side, x: Math.round(m.x), z: Math.round(m.z) })),
      lost: ARMOR.lost
    };
  },
  fort() {
    return FORT.map(F => ({
      side: F.side, dead: F.dead, hp: Math.round(F.hp), maxHp: F.maxHp,
      x: F.x, z: F.z, guns: F.guns.length,
      nextReload: +F.guns[0].reload.toFixed(2)
    }));
  },
  ai() {
    const one = a => ({
      side: a.key, mode: a.ai ? a.ai.mode : '—', committed: a.ai ? a.ai.committed : false,
      focus: a.ai && a.ai.focus ? a.ai.focus.name : null,
      flanker: a.ai && a.ai.flanker ? a.ai.flanker.name : null,
      reserve: a.ai && a.ai.reserve ? a.ai.reserve.name : null,
      orders: a.units.filter(u => u.kind !== 'art').map(u => u.name + ':' + (u.order || '—'))
    });
    return [one(U), one(C)];
  },
  traverse() {
    const out = [];
    for (const a of [U, C]) for (const u of a.units) {
      if (u.kind === 'art') continue;
      out.push(u.name + ' h=' + workH(u.cx, u.cz).toFixed(2)
        + ' trav=' + (u.traverse === undefined ? 1 : u.traverse).toFixed(2));
    }
    return out;
  },
  counts: () => ({
    unionFoot: U.foot.length, unionMount: U.mount.length,
    confFoot: C.foot.length, confMount: C.mount.length,
    unionGuns: U.guns.length, confGuns: C.guns.length
  })
};
window.__battleReady = true;
</script>
