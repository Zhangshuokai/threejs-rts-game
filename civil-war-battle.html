/* ==================== 集团 AI（双方各一套，指挥层） ====================
   每 AI_TICK 秒"思考"一次，给每个单位下 order；unitUpdate 只负责执行。
   决策全部是确定性评分（不用 PRNG），因此不会挪动 rnd 流。 */
const AI_TICK = 2.4;
function aiUpdate(army, dt) {
  const ai = army.ai || (army.ai = { t: 0, mode: 'assault', focus: null, focusUnits: [], flanker: null, reserve: null, committed: false, flankX: 0 });
  ai.t -= dt;
  if (ai.t > 0) return;
  ai.t = AI_TICK;
  const foe = enemyOf(army);
  const mine = army.units.filter(u => u.kind !== 'art' && !u.gone && u.men > 0);
  const theirs = foe.units.filter(u => u.kind !== 'art' && !u.gone && u.men > 0);
  if (!mine.length || !theirs.length) return;

  /* 1) 目标价值：残血 + 动摇 + 距离近 → 优先打垮（收割逻辑） */
  let focus = null, bs = -1e9;
  for (const e of theirs) {
    const loss = 1 - e.men / e.maxMen, shake = 1 - clamp(e.morale, 0, 1);
    const prox = 1 - clamp(Math.hypot(e.cx - army.units[0].cx, e.cz - army.units[0].cz) / 220, 0, 1);
    const s = loss * 2.4 + shake * 1.5 + prox * 0.7;
    if (s > bs) { bs = s; focus = e; }
  }
  if (focus !== ai.focus) {
    if (ai.focus) blog(army.side.label + ' 调整目标 — 集中火力于 ' + focus.name, army.side.css);
    ai.focus = focus;
  }
  /* 2) 分派：离焦点最近的两队集中火力；士气最高者侧翼迂回；兵力最整者留作预备队 */
  const byDist = mine.slice().sort((a, b) =>
    Math.hypot(a.cx - focus.cx, a.cz - focus.cz) - Math.hypot(b.cx - focus.cx, b.cz - focus.cz));
  ai.focusUnits = byDist.slice(0, Math.min(2, byDist.length));
  /* 侧翼只派线列步兵/骑兵；机枪与散兵是火力/侦察兵种，不拿去迂回 */
  let flanker = null;
  const flankPool = mine.filter(u => u.kind === 'inf' || u.kind === 'cav');
  if (flankPool.length > 2) {
    flanker = flankPool.slice().sort((a, b) => (b.morale - a.morale) || (a.maxMen - b.maxMen))[0];
    if (ai.focusUnits.includes(flanker)) flanker = null;
  }
  if (flanker !== ai.flanker) {
    ai.flanker = flanker;
    if (flanker) blog(army.side.label + ' ' + flanker.name + ' 向侧翼迂回', army.side.css);
  }
  ai.flankX = flanker ? clamp(flanker.cx + (flanker.army.key === 'union' ? 1 : -1) * 184, -86 * S, 86 * S) : 0;
  const rest = mine.filter(u => u !== ai.flanker && !ai.focusUnits.includes(u) && u.kind === 'inf');
  const reserve = rest.length > 1 ? rest.slice().sort((a, b) => (b.men / b.maxMen) - (a.men / a.maxMen))[0] : null;
  /* 3) 预备队投入条件：敌方整体动摇 / 己方有人被打残 / 时间压力 */
  const foeMorale = theirs.reduce((s, e) => s + e.morale, 0) / theirs.length;
  if (!ai.committed && (foeMorale < 0.62 || mine.some(u => u.men < u.maxMen * 0.45) || B.t > 60)) {
    ai.committed = true;
    if (reserve) blog(army.side.label + ' 投入预备队 — ' + reserve.name + ' 加入战线', army.side.css);
  }
  ai.reserve = ai.committed ? null : reserve;
  /* 4) 攻守姿态：按"相对战力"决定，而不是各自看绝对士气——否则双方会同时转入死守、
     隔着几百米对射到天荒地老（实测 360 s 不决）。现在是**弱的一方守、强的一方攻**，
     带迟滞带（0.75 / 1.05）避免来回抖动；濒临崩溃时才无条件死守。 */
  const myMorale = mine.reduce((s, u) => s + u.morale, 0) / mine.length;
  const myMen = mine.reduce((s, u) => s + u.men, 0);
  const foeMen = theirs.reduce((s, e) => s + e.men, 0);
  const myPower = myMorale * myMen, foePower = foeMorale * foeMen;
  let posture = ai.mode;
  if (myMorale < 0.30) posture = 'defend';
  else if (myPower < foePower * 0.75) posture = 'defend';
  else if (myPower > foePower * 1.05) posture = 'assault';
  if (posture !== ai.mode) {
    ai.mode = posture;
    blog(army.side.label + (posture === 'defend' ? '转入守势 — 据壕射击' : '转入攻势 — 全线推进'), army.side.css);
  }
  /* 5) 逐队下令：守势全线据壕（order 'hold'），攻势全线推进（齐头并进）；
        预备/迂回/集中火力只改"打谁/去哪"，不改攻守。 */
  for (const u of mine) {
    u.order = ai.mode === 'defend' ? 'hold'
      : ai.reserve === u ? 'reserve'
        : ai.flanker === u ? 'flank'
          : ai.focusUnits.includes(u) ? 'focusFire'
            : 'advance';
  }
}

/* ==================== 兵种 · 配合 · 技能 ====================
   三条线，全部走 simulate 的物理步进：
   1) 兵种 —— 散兵线(skirm) / 工兵连(eng) / 机枪队(mg)，属性都真的接进战斗结算；
   2) 配合 —— synergyUpdate：散兵引导炮火、压制→突击、步坦协同、工兵破障；
   3) 技能 —— 每兵种一个主动技，冷却到点且条件满足就触发。
   随机数照旧分流：战局影响用 rnd，纯视觉用 vrnd。 */
const ABIL = { aimed: 0, snipe: 0, pin: 0, dig: 0, barrage: 0, wedge: 0, union: 0, confederate: 0 };
function abil(u, name) { ABIL[name]++; ABIL[u.army.key]++; }
const ABILITY_NAME = { inf: '瞄准齐射', skirm: '定点清除', mg: '压制射击', eng: '构筑工事', art: '弹幕徐进', cav: '楔形冲锋' };
const BARRAGE_LEN = 8;

/* 士气/压制的统一尾结算：generic 单位与机枪队共用，避免两套公式漂移 */
function moraleTick(u, dt) {
  /* 用"累计阵亡比例"而不是"当前兵力比例"：缓慢增援只补人、不改 loss，
     所以补进来的兵不会把溃退线顶住（否则会战永远结束不了）。无增援时两者等价。 */
  const loss = u.casualties / u.maxMen;
  const dmg = loss;
  u.shock = Math.max(0, u.shock - dt * 0.035);
  u.suppress = Math.max(0, u.suppress - dt * 0.16);
  u.morale = clamp(1 + u.resolve - dmg * 1.65 - u.shock - 0.30 * u.suppress, 0, 1);
  /* 新增一条"被压制→崩溃"的溃退通道：压制不再只是减速，而是真的能把战线钉垮 */
  const routed = (u.state === 'melee' && u.meleeT > 3 && (loss > 0.70 || u.morale < 0.22))
    || (u.state !== 'melee' && loss > 0.78)
    || (u.suppress > 0.3 && u.morale < 0.18);
  if (routed && u.state !== 'rout') {
    u.state = 'rout';
    blog(u.name + (u.suppress > 0.3 && u.morale < 0.18
      ? ' 被火力压制，溃散！'
      : loss > 0.78 ? ' 伤亡过大，脱离战线！' : ' 阵型崩解，溃退！'), '#e08a5a');
    /* 溃退冲击波：正面展开到 4× 宽后，一队崩掉不会自动带动邻队——给附近友军一次衰减冲击 */
    for (const t of u.army.units) {
      if (t === u || t.kind === 'art' || !t.onField) continue;
      const d = Math.hypot(t.cx - u.cx, t.cz - u.cz);
      if (d < 300) t.shock = Math.min(1.2, t.shock + 0.26 * (1 - d / 300));
    }
  }
}
function routTick(u, dt) {
  u.spd = 5.6 * (u.traverse === undefined ? 1 : u.traverse);
  const dir = u.army.key === 'union' ? -1 : 1;
  u.yaw = dir < 0 ? Math.PI : 0;
  u.cz += dir * u.spd * dt;
  if (Math.abs(u.cz) > 168 * S) {
    u.gone = true; u.banner.visible = false;
    for (const s of u.soldiers) if (s.alive) s.state = 'gone';
  }
}

/* 配合系统：每 tick 重算一次，纯确定性评分（不取随机数），故不会挪动 rnd 流 */
function synergyUpdate(dt) {
  for (let i = FIELDWORKS.length - 1; i >= 0; i--) if ((FIELDWORKS[i].ttl -= dt) <= 0) FIELDWORKS.splice(i, 1);
  /* 弹道反推的情报 30 s 过期：久不校射就不能一直拿旧坐标反炮兵 */
  INTEL.union = INTEL.union.filter(f => B.t - f.t < 30);
  INTEL.confederate = INTEL.confederate.filter(f => B.t - f.t < 30);
  const pairs = [[U, C], [C, U]];
  for (const [a] of pairs) for (const u of a.units) { u.spottedBy = null; u.tankSup = false; u.engBreach = false; }
  for (const [a, foe] of pairs) {
    /* 1) 散兵引导（侦察兵）：150 m 内的敌单位被标定 → 炮兵落点收窄、命中 +30%。
       侦察半径已调小，开局两线相距 280 m，所以开战初期只能盲射/反推。 */
    const spotters = a.units.filter(u => u.kind === 'skirm' && u.onField);
    if (spotters.length) for (const e of foe.units) {
      if (e.kind === 'art' || e.gone || e.men <= 0) continue;
      for (const s of spotters) if (Math.hypot(s.cx - e.cx, s.cz - e.cz) < 150) { e.spottedBy = a.key; break; }
    }
    /* 1b) 侦察机引导：在上空的侦察机把下方敌军标定给炮兵（比散兵看得更远） */
    const recons = AIR.craft.filter(c => c.side === a.key && c.kind === 'recon'
      && !c.dead && c.state !== 'falling' && c.state !== 'parked');
    if (recons.length) for (const e of foe.units) {
      if (e.kind === 'art' || e.gone || e.men <= 0) continue;
      for (const r of recons) if (Math.hypot(r.x - e.cx, r.z - e.cz) < 190) { e.spottedBy = a.key; break; }
    }
    /* 1c) 其余非侦察单位（步兵/骑兵/机枪/工兵）：只有贴到 80 m 才发现敌军。
       所以"精确打击"依赖侦察资产——普通部队只在近战距离提供末段观察 */
    const others = a.units.filter(u => u.kind !== 'art' && u.kind !== 'skirm' && u.onField);
    if (others.length) for (const e of foe.units) {
      if (e.kind === 'art' || e.gone || e.men <= 0 || e.spottedBy === a.key) continue;
      for (const s of others) if (Math.hypot(s.cx - e.cx, s.cz - e.cz) < 80) { e.spottedBy = a.key; break; }
    }
    /* 观察来源：散兵 150 m / 侦察机 190 m（侦察资产）+ 其他单位 80 m（末段目视）。
       普通部队只在贴身距离提供观察，所以"精确攻击"仍然依赖侦察。 */
    /* 2) 工兵破障：随行工兵 36 m 内的友军行军时视工事为已开路（通行代价 ×1.35，封顶 1） */
    const engs = a.units.filter(u => u.kind === 'eng' && u.onField);
    if (engs.length) for (const u of a.units) {
      if (u.kind === 'art' || !u.onField) continue;
      for (const e of engs) if (Math.hypot(e.cx - u.cx, e.cz - u.cz) < 36) { u.engBreach = true; break; }
    }
    /* 3) 步坦协同（写实版）：坦克在步兵**前方**（朝敌一侧）90 m 内时，步兵借车体掩护
       （对正面火力 +0.30 掩体），同时放慢到坦克步速跟进——现实里是"步兵跟坦克"，
       不是"坦克给步兵加速"，也不该白送士气（坦克本身就是敌军炮火的磁石）。 */
    const tf = a.key === 'union' ? 1 : -1;
    for (const u of a.units) {
      if (u.kind === 'art' || !u.onField) continue;
      let cv = 0;
      for (const t of ARMOR.tanks) {
        if (t.dead || t.side !== a.key) continue;
        const dz = (t.z - u.cz) * tf, dx = Math.abs(t.x - u.cx);
        if (dz < -6 || dz > 90 || dx > 28) continue;
        cv = Math.max(cv, 0.30 * (1 - dx / 28) * (1 - clamp((dz - 6) / 84, 0, 1)));
      }
      u.tankCoverAmt = cv;
      u.tankSup = cv > 0.06;
    }
    /* 4) 压制→突击：正在冲击/白刃的目标被压制时打开突击加成 */
    for (const u of a.units) {
      if (u.kind === 'art' || !u.onField) continue;
      u.assault = !!(u.target && (u.state === 'charge' || u.state === 'melee') && u.target.suppress > 0.3);
    }
  }
}

/* ---------- 技能执行体（默认冷却：瞄准 22 / 狙击 16 / 压制 12 / 工事 26 / 弹幕 34 / 楔形 30） ---------- */
function aimedVolley(u) {
  const tgt = u.target; if (!tgt || tgt.men <= 0) return;
  const d = Math.hypot(tgt.cx - u.cx, tgt.cz - u.cz);
  const eff = clamp(1 - d / 210, 0.15, 1) * (1 - 0.35 * u.suppress);
  let shots = 0;
  for (const s of u.soldiers) {
    if (!s.alive) continue;
    const fx = Math.sin(s.yaw), fz = Math.cos(s.yaw);
    const mx = s.x + fx * 1.05, mz = s.z + fz * 1.05, my = s.y + 1.3;
    flashPool.emit(mx, my, mz, 0.5, 0.14, 0.05, 1, 0, 0.15, fx * 0.7, fz * 0.7);
    if (shots % 3 === 0) smokePool.emit(mx + fx * 0.5, my + 0.1, mz + fz * 0.5, 0.45, 2.2, 1.7, 0.6, 0, 0.45, fx * 0.6, fz * 0.6);
    s.recoil = 1; shots++;
  }
  const kills = Math.max(0, Math.round((0.5 + rnd() * 1.1) * eff * (1 - 0.55 * coverAgainst(tgt, u.cz))));
  const pool = tgt.aliveSoldiers();
  const bdx = tgt.cx - u.cx, bdz = tgt.cz - u.cz;
  for (let i = 0; i < kills && pool.length; i++) tgt.kill(pool.splice(Math.floor(rnd() * pool.length), 1)[0], bdx, bdz, 1);
  tgt.shock = clamp(tgt.shock + 0.16 + rnd() * 0.06, 0, 0.55);
  tgt.suppress = clamp(tgt.suppress + 0.10, 0, 1);
  abil(u, 'aimed');
  blog(u.name + ' 瞄准齐射 — 敌军阵线动摇（' + Math.round(d) + ' m）', u.army.side.css);
}
function snipe(u) {
  const tgt = u.target; if (!tgt || tgt.men <= 0) return;
  const pool = tgt.aliveSoldiers();
  const k = Math.min(pool.length, 1 + (rnd() < 0.55 ? 1 : 0));
  for (let i = 0; i < k; i++) tgt.kill(pool.splice(Math.floor(rnd() * pool.length), 1)[0], tgt.cx - u.cx, tgt.cz - u.cz, 1);
  tgt.shock = clamp(tgt.shock + 0.18 + rnd() * 0.08, 0, 0.6);
  const s = u.soldiers.find(s => s.alive);
  const sx = s ? s.x : u.cx, sy = s ? s.y : groundY(u.cx, u.cz), sz = s ? s.z : u.cz;
  const fx = Math.sin(u.yaw), fz = Math.cos(u.yaw);
  flashPool.emit(sx + fx * 1.1, sy + 1.35, sz + fz * 1.1, 0.42, 0.12, 0.05, 1, 0, 0, fx, fz);
  smokePool.emit(sx + fx * 0.9, sy + 1.4, sz + fz * 0.9, 0.4, 2.0, 1.5, 0.55, 0, 0.5, fx * 1.2, fz * 1.2);
  abil(u, 'snipe');
  blog(u.name + ' 定点清除 — ' + tgt.name + ' 军官被击倒，阵线动摇', u.army.side.css);
}
function pinFire(u) {
  const tgt = u.target; if (!tgt || tgt.men <= 0) return;
  const my = groundY(u.cx, u.cz) + 0.95;
  const ty = groundY(tgt.cx, tgt.cz) + 1.15;
  const mx = u.cx + Math.sin(u.yaw) * 2.2, mz = u.cz + Math.cos(u.yaw) * 2.2;
  for (let i = 0; i < 16; i++) emitTracerAimed(mx, my, mz, tgt.cx, ty, tgt.cz, 280, 2.2, 12);
  flashPool.emit(mx, my, mz, 1.4, 0.3, 0.06, 1, 0, 0, 0, 0);
  for (let i = 0; i < 3; i++) smokePool.emit(mx, my + 0.1, mz, 0.5, 2.0, 1.3, 0.5, 0, 0.4, Math.sin(u.yaw) * 1.6, Math.cos(u.yaw) * 1.6);
  tgt.suppress = clamp(tgt.suppress + 0.7, 0, 1);
  tgt.shock = clamp(tgt.shock + 0.10 + rnd() * 0.05, 0, 0.45);
  abil(u, 'pin');
  blog(u.name + ' 压制射击 — ' + tgt.name + ' 被钉在阵地上', u.army.side.css);
}
function digIn(u) {
  const x = u.cx, z = u.cz;
  FIELDWORKS.push({
    side: u.army.key, x, z, y: groundY(x, z), r: 18, cover: 0.5, ttl: 20,
    rot: u.yaw, slot: wkIdx++ % WORK_COUNT
  });
  while (FIELDWORKS.length > WORK_COUNT) FIELDWORKS.shift();
  for (let i = 0; i < 12; i++) {
    const a = vrnd() * TAU, sp = 2 + vrnd() * 4;
    dustPool.emit(x + Math.cos(a) * 3, groundY(x, z) + 0.3 + vrnd() * 0.8, z + Math.sin(a) * 3, 0.6, 2.4, 1.3, 0.5, 0, 0.8, Math.cos(a) * sp, Math.sin(a) * sp);
  }
  abil(u, 'dig');
  blog(u.name + ' 构筑工事 — 就地挖掘胸墙', u.army.side.css);
}
function creepingBarrage(u, tgt) {
  const dir = u.army.key === 'union' ? 1 : -1;
  /* 落点必须从「敌军线」起步、向敌军纵深走：explodeGround 的压制不分敌我，
     若以炮兵选中的纵深目标为基准向前 120 m，前几发会落到己方线后面，
     把自家散兵/工兵压住。取敌军线（lineZ）而非远纵深目标，既保证打在敌军正面上、
     又不会越到己方线那一侧。 */
  const L = lineZ(u.army.key);
  const foe = enemyOf(u.army);
  let ex = 0, n = 0;
  for (const e of foe.units) {
    if (e.kind === 'art' || !e.onField || e.men <= 0 || e.state === 'rout') continue;
    ex += e.cx; n++;
  }
  const cx = n ? ex / n : tgt.cx;
  const o0 = u.guns && u.guns[0] ? u.guns[0] : { x: u.cx, z: u.cz };
  for (let i = 0; i < BARRAGE_LEN; i++) {
    BARRAGE.push({
      side: u.army.key, t: 0.4 + i * 0.62,
      x: cx + (rnd() - 0.5) * 44,
      z: L + dir * (i * 24) + (rnd() - 0.5) * 26,
      ox: o0.x, oz: o0.z
    });
  }
  abil(u, 'barrage');
  blog(u.army.side.label + ' 炮兵 弹幕徐进 — 弹幕向敌军纵深延伸', u.army.side.css);
}
function wedgeCharge(u) {
  u.state = 'charge'; u.impact = false; u.wedge = 0.6;
  abil(u, 'wedge');
  blog(u.name + ' 楔形冲锋 — 骑兵集中突击', '#f0b070');
}
function tryAbility(u, dt) {
  if (B.over || u.abilityCd > 0 || !u.target || u.target.men <= 0) return;
  if (u.kind === 'inf') {
    if (u.state === 'fire' && u.volleys >= 1) { aimedVolley(u); u.abilityCd = 22; }
  } else if (u.kind === 'skirm') {
    if (u.state === 'fire') { snipe(u); u.abilityCd = 16; }
  } else if (u.kind === 'eng') {
    /* 阻止"无脑挖洞"：必须真的停下来（据守/预备/火力准备）、敌军已近、且附近没有己方工事，
       才构工。旧逻辑在推进途中也满足条件，工兵会一路挖到敌军阵地前。 */
    const engaged = Math.hypot(u.target.cx - u.cx, u.target.cz - u.cz) < 175;
    const settled = u.order === 'hold' || u.order === 'reserve' || u.state === 'fire';
    const nearWork = FIELDWORKS.some(f => f.side === u.army.key && Math.hypot(f.x - u.cx, f.z - u.cz) < 30);
    if (B.t > 6 && engaged && settled && !nearWork) { digIn(u); u.abilityCd = 26; }
  } else if (u.kind === 'cav') {
    if (u.state === 'charge' && !u.wedge) { wedgeCharge(u); u.abilityCd = 30; }
  }
}

/* 机枪队：不冲锋、不白刃（被逼近才应战）。射速高、单发杀伤小，靠压制钉人。 */
function mgFire(u, dt) {
  u.mgT -= dt;
  if (u.mgT > 0) return;
  const tgt = u.target;
  if (!tgt || tgt.men <= 0) return;
  if (u.ammo <= 0) { u.ammo = 0; return; }   // 机枪弹带打空：停火等补给
  u.ammo -= 3;
  u.mgT = 0.42 + rnd() * 0.12;
  const d = Math.hypot(tgt.cx - u.cx, tgt.cz - u.cz);
  const eff = clamp(1 - d / 210, 0.2, 1) * (1 - 0.35 * u.suppress);
  u.mgYaw = Math.atan2(tgt.cx - u.cx, tgt.cz - u.cz) - u.yaw;

/* ---------- 撞机（kamikaze）：把"自杀式撞击"收进一个明确的战术条件 ----------

function highValueTarget(a) {

  for (const c of AIR.craft) {
    if (c === a || c.dead || c.side === a.side || c.state === 'falling') continue;
    if (c.state === 'parked' || c.state === 'taxi' || c.state === 'roll' || c.state === 'rollout') continue;
    const d = Math.hypot(c.x - a.x, c.z - a.z);

    if (s > bs) { bs = s; best = c; }

  for (const t of ARMOR.tanks) {

    const d = Math.hypot(t.x - a.x, t.z - a.z);
    if (d > 480) continue;
    const s = t.hp * 0.5 - d * 0.2;
    if (s > bs) { bs = s; best = t; }

  if (best) return best;
  const foe = armyOf(foeSideOf(a.side));
  for (const u of foe.units) {
    if (u.kind === 'art' || u.men <= 0 || u.gone || u.state === 'rout') continue;
    const d = Math.hypot(u.cx - a.x, u.cz - a.z);

function kamikazeUpdate(a, dt) {

  const tx = t.x !== undefined ? t.x : t.cx;
  const tz = t.z !== undefined ? t.z : t.cz;
  const ty = t.y !== undefined ? t.y : groundY(t.cx, t.cz);
  steerTo(a, tx, ty, tz, dt);
  a.spd = Math.min(a.cruise, a.spd + 22 * dt);

function ramImpact(a, t) {

    + (t.kind && CRAFT_SPEC[t.kind] ? CRAFT_SPEC[t.kind].label : '目标');
  blog(craftLabel(a) + '撞机 — 扑向' + tn, '#ffb070');

  if (t.x !== undefined) { a.x = t.x; a.y = t.y; a.z = t.z; }
  else { a.x = t.cx; a.z = t.cz; a.y = groundY(t.cx, t.cz) + 2; }
  if (t.kind && CRAFT_SPEC[t.kind]) damageCraft(t, 260, '撞机');

/* ---------- 起飞与返场着陆（机场是战术循环的一部分，不只是起点） ---------- */
function takeoffUpdate(a, dt) {

    const nx = lerp(l[0], 0, 1 - Math.exp(-dt * 1.6));
    const w = afWorld(A, nx, l[1] + a.spd * dt);
    a.x = w[0]; a.z = w[1];
    a.y = PY + GND;

    moveCraft(a, dt, true);

  for (const side of ['union', 'confederate']) {

    AIR.reinfT[side] = AIR_REINF_EVERY;
    let kind = null, deficit = 0;

/* 空中相撞：两架敌对飞机距离小于 2 倍机长就算撞上——双方重创/击落 + 半空火球 */
const COLLIDE_R = 5.5, COLLIDE_R2 = COLLIDE_R * COLLIDE_R;

/* ---------- 装甲 / 摩托化：更新与实例矩阵同步 ---------- */
function reinforce(u, n) {
  let k = 0;
  for (const s of u.soldiers) {
    if (k >= n) break;
    if (s.alive) continue;
    /* kill() 会压实槽位登记表，所以复活必须补回一个空槽——否则新兵会和别人挤在同一位置 */
    let slot = -1;
    for (let i = 0; i < u.slots.length; i++) if (u.slotSoldier[i] === -1) { slot = i; break; }
    if (slot < 0) break;
    s.alive = true; s.state = 'idle'; s.target = null; s.fallT = 0; s.tilt = 0;
    /* 补充兵从单位后方 22–36 m 出现、自己走上来（不是原地复活在火线上）：
       偏移只由 s.si 决定，不取随机数——保持确定性探针不受影响。 */
    s.x = u.cx + ((s.si % 5) - 2) * 3.2;
    s.z = u.cz - (u.army.key === 'union' ? 1 : -1) * (22 + (s.si % 7) * 2.4);
    s.y = groundY(s.x, s.z);
    s.yaw = u.yaw;
    u.slotSoldier[slot] = s.si;
    u.soldierSlot[s.si] = slot;
    k++;

  if (k) u.men = Math.min(u.maxMen, u.men + k);

}

/* 步兵类兵种（步/散兵/工兵/机枪）——名单只写这一处，避免补给/增援/HUD 各自漂移 */
const FOOT_KINDS = { inf: 1, skirm: 1, eng: 1, mg: 1 };
const isFootUnit = u => FOOT_KINDS[u.kind] === 1;
function weakestUnit(army, maxRatio, skipContact) {

    if (skipContact && (u.state === 'melee' || u.state === 'charge')) continue;
    const r = u.men / u.maxMen;

function motorUpdate(dt) {

    /* 途中目标被打崩/撤离就换一个，换不到再返场 */

      v.target = supplyTarget(army);
      if (!v.target) { v.state = 'return'; }
    }
    const back = v.state === 'return';
    const tx = back ? v.depotX : (v.target ? v.target.cx : v.depotX);
    const tz = back ? v.depotZ : (v.target ? v.target.cz : v.depotZ);
    if (Math.hypot(tx - v.x, tz - v.z) < 24) {

function syncArmy(army) {
  for (const s of army.foot) {
    /* 炮手不走 Unit 的倒地动画（不在任何 Unit.soldiers 里），阵亡后直接隐藏，避免"站着的尸体" */
    if (s.state === 'gone' || (s.crew && !s.alive)) hideSoldier(army.footPool, s.idx);
    else writeSoldier(army.footPool, s.idx, s);
  }
  army.footPool.flush();
  for (const s of army.mount) {
    if (s.state === 'gone') { hideSoldier(army.mountPool, s.idx); hideSoldier(army.riderPool, s.idx); }
    else { writeSoldier(army.mountPool, s.idx, s); writeSoldier(army.riderPool, s.idx, s); }
  }
  army.mountPool.flush();
  army.riderPool.flush();
  for (const u of army.units) {

    u.banner.visible = u.men > 0;

      const fz = near ? (Math.sign(near.cz - best.cz) || 1) : 1;

        radius: WMD_R, cap: WMD_CAP, chance: WMD_CHANCE, power: WMD_POWER,
        suppressRadius: WMD_SUPPRESS_R, satellites: WMD_SATELLITES,
        fortEvery: WMD_FORT_EVERY, tankEvery: WMD_TANK_EVERY,
        inFlight: shells.filter(s => s.active && s.mode === 'wmd').length,
        fired: SHELL_FIRED.wmd
      }
    };
  },
  /* 空爆距离可设定：__battle.shrapnel(40) */
  shrapnel(m) { if (m !== undefined) SHRAPNEL_FUSE = clamp(+m || 26, 5, 120); return SHRAPNEL_FUSE; },
  /* 兵种/配合/技能自检：逐单位的压制、被引导、突击、步坦、破障与技能冷却 */
  synergy() {
    const one = a => a.units.filter(u => u.kind !== 'art').map(u => ({
      name: u.name, kind: u.kind, men: u.men, state: u.state,
      suppress: +u.suppress.toFixed(2), spottedBy: u.spottedBy,
      assault: !!u.assault, tankSup: !!u.tankSup, tankCover: +(u.tankCoverAmt || 0).toFixed(2),
      engBreach: !!u.engBreach, cover: +(u.cover || 0).toFixed(2),
      ammo: u.ammo, ammoMax: u.ammoMax,
      ability: ABILITY_NAME[u.kind] || '—', cd: +u.abilityCd.toFixed(1)
    }));
    return {
      union: one(U), confederate: one(C), counted: Object.assign({}, ABIL),
      fieldworks: FIELDWORKS.map(f => ({ side: f.side, x: Math.round(f.x), z: Math.round(f.z), cover: f.cover, ttl: +f.ttl.toFixed(1) })),
      barrageInFlight: BARRAGE.length
    };
  },
  counts: () => {
    const byKind = a => {
      const o = {};
      for (const u of a.units) if (u.kind !== 'art') o[u.kind] = (o[u.kind] || 0) + u.men;
      return o;
    };
    return {
      unionFoot: U.foot.length, unionMount: U.mount.length,
      confFoot: C.foot.length, confMount: C.mount.length,
      unionGuns: U.guns.length, confGuns: C.guns.length,
      unionByKind: byKind(U), confByKind: byKind(C), mgUnits: MG.units.length,
      unionReinf: { pool: U.reinfPool, in: U.reinfIn }, confReinf: { pool: C.reinfPool, in: C.reinfIn },
      unionAmmo: U.units.filter(u => u.kind !== 'art').reduce((s, u) => s + u.ammo, 0),
      confAmmo: C.units.filter(u => u.kind !== 'art').reduce((s, u) => s + u.ammo, 0)
    };
  },
  /* 缓慢增援的验收面：池子余量 / 已补入人数（与枪炮杀伤对比） */
  reserve: () => ({
    union: { pool: U.reinfPool, in: U.reinfIn, every: REINF_EVERY },
    confederate: { pool: C.reinfPool, in: C.reinfIn, every: REINF_EVERY }
  }),
  /* 调试开关：__battle.reinf(false) 关闭补充兵，用于"有/无增援"的 A/B 探针 */
  reinf(v) { if (v !== undefined) REINF_ON = !!v; return REINF_ON; }
};
window.__battleReady = true;
</script>
