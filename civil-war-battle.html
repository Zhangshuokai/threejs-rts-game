  a.x += Math.sin(A.yaw) * a.spd * dt;
  a.z += Math.cos(A.yaw) * a.spd * dt;
  a.prop += (a.spd * 2 + 4) * dt;
  if (a.spd <= 0.2) {
    a.spd = 0; a.state = 'parked';
    a.launchAt = B.t + 16;                 // 落地整备 16 s 后再出动
  }
}
function airUpdate(dt) {
  for (const a of AIR.craft) {
    if (a.dead) continue;
    a.fireT -= dt;
    if (a.state === 'parked') {
      a.prop += dt * 1.2;
      /* 会战中落地整备后可再次出动（空中战线不会一次打光）；会战结束后就停飞 */
      if (!B.over && B.t >= a.launchAt) {
        a.state = 'taxi'; a.spd = 2; a.pitch = 0;
        a.x = a.parkX; a.z = a.parkZ;
      }
      continue;
    }
    if (a.state === 'taxi' || a.state === 'roll' || a.state === 'climb') { takeoffUpdate(a, dt); continue; }
    if (a.state === 'rtb' || a.state === 'final' || a.state === 'flare' || a.state === 'rollout') {
      landingUpdate(a, dt);
      continue;
    }
    if (a.state === 'falling') {
      a.spd = Math.max(14, a.spd - 16 * dt);
      a.pitch = Math.max(a.pitch - 2.4 * dt, -1.4);
      a.roll += dt * 1.4;
      a.yaw += dt * 0.4;
      const fcp = Math.cos(a.pitch);
      a.x += Math.sin(a.yaw) * fcp * a.spd * dt;
      a.z += Math.cos(a.yaw) * fcp * a.spd * dt;
      a.y += Math.sin(a.pitch) * a.spd * dt - 9 * dt;
      a.prop += (a.spd * 2.2 + 9) * dt;
      a.smokeT -= dt;
      if (a.smokeT <= 0) {
        a.smokeT = 0.05;
        burstPool.emit(a.x + (vrnd() - 0.5) * 1.4, a.y + (vrnd() - 0.5) * 1.4, a.z + (vrnd() - 0.5) * 1.4,
          1.3, 5.2 + vrnd() * 1.6, 2.6 + vrnd(), 0.7, 0, -1.4, 0, 0);
      }
      if (a.y <= terrainH(a.x, a.z) + 0.7) {
        a.dead = true;
        a.rig.hide(a.idx);
        explodeGround(a.x, a.z, a.kind === 'bomber' ? 1.6 : 1.1);
        blog((a.side === 'union' ? '联邦' : '邦联') + (a.kind === 'bomber' ? '轰炸机' : '战斗机') + '坠毁', '#e08a60');
        for (let i = 0; i < 4; i++) {
          smokePool.emit(a.x + (vrnd() - 0.5) * 3, terrainH(a.x, a.z) + 1.4 + i * 1.6, a.z + (vrnd() - 0.5) * 3,
            2.2, 7.4, 3.4, 0.7, 0, 1.5, (vrnd() - 0.5), (vrnd() - 0.5));
        }
      }
      continue;
    }
    /* 重伤或会战结束 → 返场着陆（机场是循环的一部分，不是一次性起点） */
    if (a.hp < a.maxHp * 0.30 || B.over) { a.state = 'rtb'; a.stick = 0; continue; }
    if (a.hp < a.maxHp * 0.42) {
      a.smokeT -= dt;
      if (a.smokeT <= 0) {
        a.smokeT = 0.07;
        burstPool.emit(a.x + (vrnd() - 0.5) * 1.1, a.y + (vrnd() - 0.5) * 1.1, a.z + (vrnd() - 0.5) * 1.1,
          0.9, 3.6 + vrnd(), 1.7 + vrnd() * 0.6, 0.5, 0, -0.4, 0, 0);
      }
    }
    if (a.kind === 'fighter') fighterUpdate(a, dt); else bomberUpdate(a, dt);
    moveCraft(a, dt);
  }
}

/* ---------- 高射炮：提前量解算 + 定时引信 ---------- */
const FLAK_R = 10;
function flakBurst(x, y, z, side) {
  for (let i = 0; i < 5; i++) {
    burstPool.emit(x + (vrnd() - 0.5) * 3.6, y + (vrnd() - 0.5) * 3.2, z + (vrnd() - 0.5) * 3.6,
      1.3, 4.4 + vrnd(), 1.6 + vrnd() * 0.6, 0.9, 0, 0.12, (vrnd() - 0.5) * 1.2, (vrnd() - 0.5) * 1.2);
  }
  flashPool.emit(x, y, z, 2.4, 0.4, 0.06, 0.95, 0, 0, 0, 0);
  for (const a of AIR.craft) {
    if (a.dead || a.state === 'falling' || a.side === side) continue;   // 高炮不打自己人
    const d = Math.hypot(a.x - x, a.y - y, a.z - z);
    if (d < FLAK_R && rnd() < 0.10) damageCraft(a, 12 + rnd() * 10, '高射炮');
  }
}
function aaUpdate(dt) {
  for (const g of AIR.guns) {
    g.reload -= dt;
    const gy = g.y + 1.72;
    let best = null, bd = 470;
    for (const a of AIR.craft) {
      if (a.dead || a.state === 'falling' || a.side === g.side) continue;
      const d = Math.hypot(a.x - g.x, a.y - gy, a.z - g.z);
      if (d < bd) { bd = d; best = a; }
    }
    if (!best) {
      g.yaw += clamp(Math.atan2(-g.x, -g.z) - g.yaw, -0.6 * dt, 0.6 * dt);
      g.pitch += clamp(0.45 - g.pitch, -0.5 * dt, 0.5 * dt);
      continue;
    }
    const TR = 190, tf = bd / TR, cp = Math.cos(best.pitch);
    const px = best.x + Math.sin(best.yaw) * cp * best.spd * tf;
    const py = best.y + Math.sin(best.pitch) * best.spd * tf - 4.9 * tf * tf;
    const pz = best.z + Math.cos(best.yaw) * cp * best.spd * tf;
    const dx = px - g.x, dz = pz - g.z, dh = Math.max(1, Math.hypot(dx, dz));
    let dy = Math.atan2(dx, dz) - g.yaw;
    while (dy > Math.PI) dy -= TAU;
    while (dy < -Math.PI) dy += TAU;
    const dp = clamp(Math.atan2(py - gy, dh), -0.12, 1.3) - g.pitch;
    g.yaw += clamp(dy, -1.9 * dt, 1.9 * dt);
    g.pitch += clamp(dp, -1.5 * dt, 1.5 * dt);
    if (!B.over && g.reload <= 0 && Math.abs(dy) < 0.09 && Math.abs(dp) < 0.07) {
      g.reload = 0.5 + rnd() * 0.6;
      const c2 = Math.cos(g.pitch);
      const ux = Math.sin(g.yaw) * c2, uy = Math.sin(g.pitch), uz = Math.cos(g.yaw) * c2;
      const ox = g.x + ux * 3.6, oy = gy + uy * 3.6, oz = g.z + uz * 3.6;
      emitTracer(ox, oy, oz, ux * TR, uy * TR, uz * TR, tf, 2.0);
      flashPool.emit(ox, oy, oz, 1.6, 0.3, 0.05, 1, 0, 0, 0, 0);
      smokePool.emit(ox + (vrnd() - 0.5), oy + 0.1, oz + (vrnd() - 0.5),
        0.5, 2.0, 1.1, 0.5, 0, 0.5, ux * 2, uz * 2);
      AIR.flak.push({ x: px, y: py, z: pz, t: tf, side: g.side });
    }
  }
}

/* ---------- 航弹 / 曳光弹 / 引信 ---------- */
const BOMB_R = 8.5;
function bombImpact(b) {
  explodeGround(b.x, b.z, 1.4);
  const foe = armyOf(foeSideOf(b.side));
  const hits = blastCasualties(foe, b.x, b.z, BOMB_R, 3, 0.75)
    + blastCasualties(foe, b.x, b.z, BOMB_R * 2, 3, 0.18);
  if (hits > 0) blog('航空炸弹命中 ' + foe.side.label + ' 队列 — ' + hits + ' 人倒下（含破片）', '#e8a060');
}
function airProjectiles(dt) {
  for (const t of tracers) {
    if (!t.on) continue;
    t.life -= dt;
    if (t.life <= 0) { t.on = false; continue; }
    t.x += t.vx * dt; t.y += t.vy * dt; t.z += t.vz * dt;
    t.vy -= 4.5 * dt;
  }
  for (const b of bombs) {
    if (!b.on) continue;
    b.vy -= 9.8 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    if (b.y <= terrainH(b.x, b.z) + 0.25) { b.on = false; bombImpact(b); }
  }
  for (let i = AIR.flak.length - 1; i >= 0; i--) {
    const f = AIR.flak[i];
    f.t -= dt;
    if (f.t <= 0) { AIR.flak.splice(i, 1); flakBurst(f.x, f.y, f.z, f.side); }
  }
}
function airSync() {
  for (const a of AIR.craft) {
    if (a.dead) continue;
    a.rig.write(a.idx, a.x, a.y, a.z, a.yaw, a.pitch, a.roll, { prop: a.prop });
  }
  for (const g of AIR.guns) g.rig.write(g.idx, g.x, g.y, g.z, 0, 0, 0, { yaw: g.yaw, pitch: g.pitch });
  fighterRig.flush(); bomberRig.flush(); aaRig.flush();

  /* 只在有活动实例或该槽位需要清除时才写，并据此决定是否置 needsUpdate（空闲池零开销） */
  let tTouched = false;
  for (let i = 0; i < TRACER_COUNT; i++) {
    const t = tracers[i];
    if (t.on) {
      const f = clamp(t.life / t.ttl, 0, 1), sp = Math.hypot(t.vx, t.vy, t.vz) || 1;
      _tq.setFromUnitVectors(PZ, _tv.set(t.vx / sp, t.vy / sp, t.vz / sp));
      tracerMesh.setMatrixAt(i, _pm.compose(_pp.set(t.x, t.y, t.z), _tq, _ps.set(1, 1, 0.7 + f * 0.6)));
      _pc.setRGB(f * t.hdr, f * t.hdr * 0.8, f * t.hdr * 0.45);
      tracerMesh.setColorAt(i, _pc);
      t.drawn = true; tTouched = true;
    } else if (t.drawn) {
      tracerMesh.setMatrixAt(i, _pm.makeScale(0, 0, 0));
      t.drawn = false; tTouched = true;
    }
  }
  if (tTouched) {
    tracerMesh.instanceMatrix.needsUpdate = true;
    tracerMesh.instanceColor.needsUpdate = true;
  }
  let bTouched = false;
  for (let i = 0; i < BOMB_COUNT; i++) {
    const b = bombs[i];
    if (b.on) {
      const sp = Math.hypot(b.vx, b.vy, b.vz) || 1;
      _tq.setFromUnitVectors(PZ, _tv.set(b.vx / sp, b.vy / sp, b.vz / sp));
      bombMesh.setMatrixAt(i, _pm.compose(_pp.set(b.x, b.y, b.z), _tq, _ps.set(1, 1, 1)));
      b.drawn = true; bTouched = true;
    } else if (b.drawn) {
      bombMesh.setMatrixAt(i, _pm.makeScale(0, 0, 0));
      b.drawn = false; bTouched = true;
    }
  }
  if (bTouched) bombMesh.instanceMatrix.needsUpdate = true;
}

function simulate(dt) {
  windUpdate();
  for (const a of [U, C]) for (const u of a.units) if (u.kind !== 'art') u.cover = coverAt(u);
  aiUpdate(U, dt); aiUpdate(C, dt);
  airUpdate(dt);
  aaUpdate(dt);
  airProjectiles(dt);
  directorUpdate(dt);
  for (const u of U.units) unitUpdate(u, dt);
  for (const u of C.units) unitUpdate(u, dt);
  for (const s of U.foot) soldierUpdate(s, dt);
  for (const s of C.foot) soldierUpdate(s, dt);
  for (const s of U.mount) soldierUpdate(s, dt);
  for (const s of C.mount) soldierUpdate(s, dt);
  projectilesUpdate(dt);
  flashPool.update(dt); smokePool.update(dt); burstPool.update(dt);
  dustPool.update(dt); boomPool.update(dt); motePool.update(dt); shardPool.update(dt);
  motesUpdate(dt);
  let melee = 0;
  for (const a of [U, C]) for (const u of a.units) if (u.state === 'melee') melee++;
  if (melee > 0 && B.meleeStarted < 0) B.meleeStarted = B.t;
  const firing = U.units.some(u => u.state === 'fire') || C.units.some(u => u.state === 'fire');
  const charging = U.units.some(u => u.state === 'charge') || C.units.some(u => u.state === 'charge');
  B.phase = B.over ? 'END'
    : B.t < 2.5 ? 'DEPLOY'
      : B.meleeStarted > 0 ? 'MELEE'
        : charging ? 'CHARGE'
          : firing ? 'FIRE' : 'ADVANCE';
}

function syncArmy(army) {
  for (const s of army.foot) {
    if (s.state === 'gone') hideSoldier(army.footPool, s.idx);
    else writeSoldier(army.footPool, s.idx, s);
  }
  army.footPool.flush();
  for (const s of army.mount) {
    if (s.state === 'gone') { hideSoldier(army.mountPool, s.idx); hideSoldier(army.riderPool, s.idx); }
    else { writeSoldier(army.mountPool, s.idx, s); writeSoldier(army.riderPool, s.idx, s); }
  }
  army.mountPool.flush();
  army.riderPool.flush();
  for (const u of army.units) {
    if (u.kind === 'art') { u.cx = u.guns[0].x; u.cz = u.guns[0].z; continue; }
    if (u.gone) { u.banner.visible = false; continue; }
    u.banner.visible = u.men > 0;
    const stagger = army.key === 'union' ? 0 : 3.1;
    u.banner.position.set(u.cx, terrainH(u.cx, u.cz) + (u.kind === 'cav' ? 8.8 : 7.5) + stagger, u.cz);
    u.banner.material.opacity = u.state === 'rout' ? 0.4 : 1;
  }
}

let hudT = 0, bannerT = 0;
function updateHUD(dt) {
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.22;
  const men = a => a.units.filter(u => u.kind !== 'art').reduce((x, u) => x + u.men, 0);
  const max = a => a.units.filter(u => u.kind !== 'art').reduce((x, u) => x + u.maxMen, 0);
  for (const [a, h] of [[U, HUD.u], [C, HUD.c]]) {
    const m = men(a), mx = Math.max(1, max(a));
    const live = a.units.filter(u => u.kind !== 'art' && u.men > 0);
    h.men.textContent = m;
    h.units.textContent = a.units.filter(u => u.onField).length + ' 个建制';
    h.bar.style.width = (100 * m / mx).toFixed(1) + '%';
    const mor = live.length ? live.reduce((x, u) => x + u.morale, 0) / live.length : 0;
    h.mor.textContent = Math.round(mor * 100) + '%';
    h.mbar.style.width = (mor * 100).toFixed(0) + '%';
  }
  HUD.phase.textContent = { DEPLOY: '部署中', ADVANCE: '推进', FIRE: '火力准备', CHARGE: '冲锋', MELEE: '白刃战', END: '战斗结束' }[B.phase] || B.phase;
  HUD.clock.textContent = B.t.toFixed(1) + ' s' + (B.paused ? ' · 暂停' : '');
  HUD.speed.textContent = '速度 ×' + B.speed;
  const airAlive = k => AIR.craft.filter(c => c.side === k && !c.dead).length + '/' + AIR.craft.filter(c => c.side === k).length;
  HUD.air.textContent = '航空兵 联邦 ' + airAlive('union') + ' · 邦联 ' + airAlive('confederate')
    + ' · 高炮 ' + AIR.guns.length + ' · 战壕 ' + (TRENCH_Z.union + '/' + TRENCH_Z.confederate) + 'm';
}

function bannersUpdate(dt) {
  bannerT -= dt;
  if (bannerT > 0) return;
  bannerT = 0.45;
  for (const army of [U, C]) for (const u of army.units) if (u.kind !== 'art' && !u.gone) drawBanner(u);
}

const VIEWS = [
  /* 全景必须高于航空器上限(ALT_MAX=120)，否则飞机直接从镜头里穿过、挡住半个画面 */
  { id: 'overview', label: '全景', pos: [0, 140, 215], tgt: [0, 8, -20], fov: 46 },
  { id: 'union', label: '联邦军视角', pos: [0, 16, -92], tgt: [0, 8, 20], fov: 46 },
  { id: 'conf', label: '邦联军视角', pos: [0, 16, 92], tgt: [0, 8, -20], fov: 46 },
  { id: 'art', label: '炮兵阵地', pos: [-54, 12, -124], tgt: [-16, 3, -56], fov: 42 },
  { id: 'air', label: '制空权', pos: [0, 168, 250], tgt: [0, 108, -10], fov: 52 },
  { id: 'melee', label: '跟拍战斗', follow: true, fov: 44 },
  { id: 'orbit', label: '环绕观赏', auto: true, fov: 50 }
];
let view = VIEWS[0];
let autoA = 0.6;
function setView(v) {
  view = v;
  [...HUD.views.children].forEach(b => b.classList.toggle('on', b.dataset.id === v.id));
  if (!v.follow && !v.auto) {
    camera.fov = v.fov || 48;
    camera.updateProjectionMatrix();
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    controls.target.set(v.tgt[0], v.tgt[1], v.tgt[2]);
  }
}
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + ' ' + v.label;
  b.dataset.id = v.id;
  b.onclick = () => setView(v);
  HUD.views.appendChild(b);
});
setView(VIEWS[0]);

const _cam = new THREE.Vector3();
const _tgt = new THREE.Vector3();
function camUpdate(dt) {
  if (view.follow) {
    let best = null, bs = -1;
    for (const army of [U, C]) {
      for (const u of army.units) {
        if (u.kind === 'art' || u.gone || u.men <= 0) continue;
        const s = (u.state === 'melee' ? 3 : u.state === 'charge' ? 2 : 0.4) + (1 - u.men / u.maxMen);
        if (s > bs) { bs = s; best = u; }
      }
    }
    if (best) {
      const foe = enemyOf(best.army);
      let near = null, nd = 1e9;
      for (const e of foe.units) {
        if (e.kind !== 'inf' || e.men <= 0 || e.gone) continue;
        const d = Math.abs(e.cx - best.cx);
        if (d < nd) { nd = d; near = e; }
      }
      const fz = near ? (Math.sign(near.cz - best.cz) || 1) : 1;
      _cam.set(best.cx + fz * 24, 13 + bs * 2.2, best.cz + fz * 28);
      _tgt.set(best.cx, 3, best.cz + fz * 5);
      camera.position.lerp(_cam, 1 - Math.exp(-dt * 1.6));
      controls.target.lerp(_tgt, 1 - Math.exp(-dt * 2.0));
      if (Math.abs(camera.fov - 44) > 0.02) {
        camera.fov = lerp(camera.fov, 44, 1 - Math.exp(-dt * 2));
        camera.updateProjectionMatrix();
      }
    }
  } else if (view.auto) {
    autoA += dt * 0.085;
    const R = 200;
    _cam.set(Math.sin(autoA) * R, 90, Math.cos(autoA) * R);
    camera.position.lerp(_cam, 1 - Math.exp(-dt * 1.1));
    controls.target.lerp(_tgt.set(0, 6, 0), 1 - Math.exp(-dt * 2));
  }
}

const clock = new THREE.Timer();
clock.connect(document);
let acc = 0, frames = 0, fpsT = 0, fps = 0;

function loop() {
  clock.update();
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.1);
  if (!B.paused) {
    acc += dt * B.speed;
    let n = 0;
    while (acc >= STEP && n < 8) { simulate(STEP); acc -= STEP; n++; }
    if (n >= 8) acc = 0;
    camUpdate(dt);
    updateHUD(dt);
    bannersUpdate(dt);
    fxTime += raw;
  }
  syncArmy(U);
  syncArmy(C);
  airSync();
  flashPool.sync(); smokePool.sync(); burstPool.sync();
  dustPool.sync(); boomPool.sync(); motePool.sync(); shardPool.sync();
  frames++; fpsT += raw;
  if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  if (renderer.info) renderer.info.reset();
  if (FX.enabled) {
    if (gradePass) gradePass.uniforms.uTime.value = fxTime;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
renderer.setAnimationLoop(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) {
    composer.setSize(window.innerWidth, window.innerHeight);
    if (bloomPass) bloomPass.setSize(window.innerWidth, window.innerHeight);
  }
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { B.paused = !B.paused; e.preventDefault(); }
  if (e.key >= '1' && e.key <= '7') setView(VIEWS[+e.key - 1]);
  if (e.key === '[' || e.key === ']') {
    let i = SPEEDS.indexOf(B.speed);
    i = clamp(i + (e.key === ']' ? 1 : -1), 0, SPEEDS.length - 1);
    B.speed = SPEEDS[i];
  }
  if (e.key === 'r' || e.key === 'R') location.reload();
});

function packArmy(a) {
  return a.units.filter(u => u.kind !== 'art').map(u => ({
    name: u.name, type: u.kind, men: u.men, max: u.maxMen, state: u.state,
    morale: +u.morale.toFixed(3), x: +u.cx.toFixed(1), z: +u.cz.toFixed(1)
  }));
}
window.__battle = {
  sim(seconds, step) {
    step = step || STEP;
    const n = Math.max(0, Math.round(seconds / step));
    for (let i = 0; i < n; i++) simulate(step);
    syncArmy(U); syncArmy(C);
    updateHUD(1); bannersUpdate(1);
    return this.state();
  },
  state() {
    return {
      renderer: MODE, t: +B.t.toFixed(2), phase: B.phase, paused: B.paused, speed: B.speed,
      over: B.over, winner: B.winner, fps: +fps.toFixed(1),
      shellsInFlight: shells.filter(s => s.active).length,
      union: packArmy(U), confederate: packArmy(C),
      visibleSprites: this.particles().total,
      particles: this.particles(),
      log: B.entries.slice(-10).map(e => e.t + 's ' + e.text)
    };
  },
  soldier(i, side, kind) {
    const a = side === 'union' ? U : C;
    const s = kind === 'cav' ? a.mount[i] : a.foot[i];
    return {
      x: +s.x.toFixed(3), y: +s.y.toFixed(3), z: +s.z.toFixed(3), yaw: +s.yaw.toFixed(3),
      state: s.state, tilt: +s.tilt.toFixed(3), spd: +s.spd.toFixed(3),
      alive: s.alive, animT: +s.animT.toFixed(3), mounted: s.mounted
 
    };
  },
  partMatrix(idx, side, kind, partId) {
    const a = side === 'union' ? U : C;
    const pool = kind === 'cav' ? a.mountPool : a.footPool;
    const P = pool.parts.find(p => p.def.id === partId);
    if (!P) return null;
    const m = new THREE.Matrix4();
    P.mesh.getMatrixAt(idx, m);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    m.decompose(p, q, s);
    const e = new THREE.Euler().setFromQuaternion(q, 'YXZ');
    return {
      id: partId, pos: [+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)],
      rot: [+e.x.toFixed(4), +e.y.toFixed(4), +e.z.toFixed(4)]
    };
  },
  unit(name) {
    for (const a of [U, C]) for (const u of a.units) if (u.name === name) {
      return { state: u.state, men: u.men, morale: +u.morale.toFixed(3), x: +u.cx.toFixed(2), z: +u.cz.toFixed(2), target: u.target ? u.target.name : null };
    }
    return null;
  },
  camera: id => setView(VIEWS.find(v => v.id === id) || VIEWS[0]),
  freecam(px, py, pz, tx, ty, tz, fov) {
    view = { id: 'free', label: '自由', fov: fov || 45 };
    [...HUD.views.children].forEach(b => b.classList.remove('on'));
    camera.fov = fov || 45;
    camera.updateProjectionMatrix();
    camera.position.set(px, py, pz);
    controls.target.set(tx, ty, tz);
    controls.update();
    return { pos: camera.position.toArray(), tgt: controls.target.toArray() };
  },
  pause: v => { B.paused = !!v; },
  speed: v => { B.speed = v; },
  fps: () => +fps.toFixed(1),
  particles() {
    const p = {
      flash: flashPool.alive(), smoke: smokePool.alive(), burst: burstPool.alive(),
      dust: dustPool.alive(), boom: boomPool.alive(), mote: motePool.alive(), shard: shardPool.alive()
    };
    p.total = p.flash + p.smoke + p.burst + p.dust + p.boom + p.mote + p.shard;
    return p;
  },
  pools(show) {
    const list = [['flash', flashPool], ['smoke', smokePool], ['burst', burstPool], ['dust', dustPool], ['boom', boomPool], ['mote', motePool], ['shard', shardPool]];
    if (show) for (const p of list) p[1].mesh.visible = show.indexOf(p[0]) >= 0;
    return list.map(p => ({
      name: p[0], visible: p[1].mesh.visible, cap: p[1].mesh.count, alive: p[1].alive(),
      blending: p[1].mat.blending, premul: p[1].premul,
      map: p[1].mat.map ? [p[1].mat.map.image.width, p[1].mat.map.image.height] : null,
      color: p[1].mesh.instanceColor ? p[1].mesh.instanceColor.count : null
    }));
  },
  blend(id, mode) {
    const p = { flash: flashPool, smoke: smokePool, burst: burstPool, dust: dustPool, boom: boomPool, mote: motePool, shard: shardPool }[id];
    if (!p) return null;
    const m = p.mat;
    if (mode) {
      m.blending = mode === 'additive' ? THREE.AdditiveBlending
        : mode === 'normal' ? THREE.NormalBlending : THREE.CustomBlending;
      if (m.blending === THREE.CustomBlending) {
        m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneMinusSrcAlphaFactor;
      }
      m.needsUpdate = true;
    }
    return { id, blending: m.blending, premul: p.premul };
  },
  fx(mode) {
    if (mode !== undefined) {
      if (!mode) FX.enabled = false;
      else if (composer) FX.enabled = true;
    }
    return {
      mode: MODE, composed: !!composer, enabled: FX.enabled,
      bloomStrength: bloomPass ? bloomPass.strength : 0,
      grain: gradePass ? +gradePass.uniforms.uGrain.value.toFixed(3) : 0,
      drawCallsEstimate: 6 + 1
    };
  },
  postfx(id, v) {
    if (!id || v === undefined) return null;
    if (id === 'bloom' && bloomPass) { bloomPass.strength = v; return bloomPass.strength; }
    if (id === 'threshold' && bloomPass) { bloomPass.threshold = v; return bloomPass.threshold; }
    if (id === 'radius' && bloomPass) { bloomPass.radius = v; return bloomPass.radius; }
    if (id === 'grain' && gradePass) { gradePass.uniforms.uGrain.value = v; return v; }
    if (id === 'vignette' && gradePass) { gradePass.uniforms.uVignette.value = v; return v; }
    return null;
  },
  info: () => renderer.info ? {
    calls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
    programs: renderer.info.programs ? renderer.info.programs.length : null
  } : null,
  air() {
    return {
      craft: AIR.craft.map(c => ({
        side: c.side, kind: c.kind, state: c.state, dead: c.dead,
        x: +c.x.toFixed(1), y: +c.y.toFixed(1), z: +c.z.toFixed(1),
        yaw: +c.yaw.toFixed(3), hp: Math.round(c.hp)
      })),
      guns: AIR.guns.map(g => ({ side: g.side, yaw: +g.yaw.toFixed(2), pitch: +g.pitch.toFixed(2), reload: +g.reload.toFixed(2) })),
      lost: AIR.lost, bombsDropped: AIR.dropped,
      tracers: tracers.filter(t => t.on).length,
      bombs: bombs.filter(b => b.on).length,
      flakInFlight: AIR.flak.length,
      trenchZ: TRENCH_Z
    };
  },
  cover: () => [U, C].map(a => a.units.filter(u => u.kind !== 'art').map(u => u.name + ':' + (u.cover || 0).toFixed(2))).flat(),
  /* 可见性普查：列出"本该看见却没被绘制"或"雾里已经很淡"的对象。
     inFrustum 复刻 three 的判定（Frustum.intersectsObject）——对 InstancedMesh
     它用的是对象自己的 boundingSphere（只在首次渲染算一次，之后不会失效重算）。 */
  census(minFog) {
    const fr = new THREE.Frustum().setFromProjectionMatrix(
      new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    const fog = scene.fog, lim = minFog === undefined ? 0.25 : minFog;
    const rows = [];
    let total = 0, notDrawn = 0;
    scene.traverse(o => {
      if (!o.isMesh && !o.isInstancedMesh) return;
      total++;
      const mat = o.material;
      const inF = o.frustumCulled ? fr.intersectsObject(o) : true;
      const drawn = o.visible && (!mat || mat.visible !== false) && inF;
      if (!drawn) notDrawn++;
      const wp = new THREE.Vector3();
      o.getWorldPosition(wp);
      const d = camera.position.distanceTo(wp);
      const f = fog ? clamp((d - fog.near) / (fog.far - fog.near), 0, 1) : 0;
      if (drawn && f < lim) return;
      rows.push({
        kind: o.isInstancedMesh ? 'Inst' : 'Mesh',
        n: o.count || 1, drawn, vis: o.visible, cull: o.frustumCulled,
        d: Math.round(d), fog: +f.toFixed(2),
        mat: mat ? mat.type.replace('Mesh', '').replace('Material', '') : null,
        opa: mat && mat.opacity !== undefined ? +mat.opacity.toFixed(2) : null
      });
    });
    return { total, notDrawn, rows: rows.slice(0, 40) };
  },
  ai() {
    const one = a => ({
      side: a.key, mode: a.ai ? a.ai.mode : '—', committed: a.ai ? a.ai.committed : false,
      focus: a.ai && a.ai.focus ? a.ai.focus.name : null,
      flanker: a.ai && a.ai.flanker ? a.ai.flanker.name : null,
      reserve: a.ai && a.ai.reserve ? a.ai.reserve.name : null,
      orders: a.units.filter(u => u.kind !== 'art').map(u => u.name + ':' + (u.order || '—'))
    });
    return [one(U), one(C)];
  },
  traverse() {
    const out = [];
    for (const a of [U, C]) for (const u of a.units) {
      if (u.kind === 'art') continue;
      out.push(u.name + ' h=' + workH(u.cx, u.cz).toFixed(2)
        + ' trav=' + (u.traverse === undefined ? 1 : u.traverse).toFixed(2));
    }
    return out;
  },
  counts: () => ({
    unionFoot: U.foot.length, unionMount: U.mount.length,
    confFoot: C.foot.length, confMount: C.mount.length,
    unionGuns: U.guns.length, confGuns: C.guns.length
  })
};
window.__battleReady = true;
</script>
</body>
</html>
