<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南北战争 · 全面战争风格会战</title>
<style>
  :root{
    --union:#3f5f9c; --union2:#6f8fc9; --conf:#8d7f63; --conf2:#b8a684;
    --gold:#d9b96a; --panel:rgba(20,18,15,.72); --line:rgba(217,185,106,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f12;
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;color:#efe8da}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;user-select:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    backdrop-filter:blur(3px);box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:stretch;width:min(1180px,96vw)}
  .army{flex:1;padding:8px 12px;min-width:0}
  .army .name{font-size:15px;letter-spacing:2px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .army.union .name{color:var(--union2)}
  .army.conf .name{color:var(--conf2)}
  .army .sub{font-size:11px;opacity:.72;letter-spacing:1px}
  .bar{height:9px;margin:6px 0 4px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%}
  .union .bar i{background:linear-gradient(90deg,#2f4a7d,#7ea2e0)}
  .conf .bar i{background:linear-gradient(90deg,#6d6047,#c9b58c)}
  .morale{height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:4px}
  .morale i{display:block;height:100%;background:#e0c070;width:100%}
  #center{width:210px;text-align:center;padding:8px 10px}
  #phase{font-size:16px;letter-spacing:3px;color:var(--gold);font-weight:700}
  #clock{font-size:12px;opacity:.8;margin-top:3px;letter-spacing:1px}
  #log{position:absolute;left:14px;bottom:96px;width:340px;max-height:238px;overflow:hidden;
    display:flex;flex-direction:column;gap:5px}
  #log div{font-size:12px;padding:5px 9px;line-height:1.45}
  #help{position:absolute;right:14px;bottom:96px;padding:9px 12px;font-size:12px;line-height:1.75;text-align:right}
  #help b{color:var(--gold)}
  #views{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
  #views button{font-family:inherit;font-size:12px;letter-spacing:1px;color:#efe8da;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 11px}
  #views button:hover{border-color:var(--gold);color:var(--gold)}
  #views button.on{background:rgba(217,185,106,.22);color:var(--gold);border-color:var(--gold)}
  #result{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;
    padding:26px 46px;display:none}
  #result h1{margin:0;font-size:34px;letter-spacing:10px;color:var(--gold);font-weight:700}
  #result p{margin:12px 0 0;font-size:13px;letter-spacing:2px;opacity:.85;line-height:1.8}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0d0f12;z-index:9;
    font-size:14px;letter-spacing:4px;color:#b9a06a}
  #debug{position:absolute;left:10px;top:10px;font-size:11px;font-family:Consolas,monospace;
    max-width:46vw;white-space:pre-wrap;display:none;padding:8px;z-index:20;color:#ffb0a0}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div id="topbar">
    <div class="panel army union">
      <div class="name"><span>联邦军 · UNION</span><span id="u-units">—</span></div>
      <div class="bar"><i id="u-bar"></i></div>
      <div class="sub">兵力 <span id="u-men">—</span> · 士气 <span id="u-mor">—</span></div>
      <div class="morale"><i id="u-mbar"></i></div>
    </div>
    <div class="panel" id="center">
      <div id="phase">部署中</div>
      <div id="clock">0.0 s</div>
      <div class="sub" id="speed">速度 ×1</div>
      <div class="sub" id="air">航空兵 —</div>
    </div>
    <div class="panel army conf">
      <div class="name"><span id="c-units">—</span><span>邦联军 · CONFEDERACY</span></div>
      <div class="bar"><i id="c-bar"></i></div>
      <div class="sub">兵力 <span id="c-men">—</span> · 士气 <span id="c-mor">—</span></div>
      <div class="morale"><i id="c-mbar"></i></div>
    </div>
  </div>
  <div id="log"></div>
  <div class="panel" id="help">
    <div><b>1-7</b> 切换机位 &nbsp; <b>空格</b> 暂停</div>
    <div><b>[ ]</b> 战斗速度 &nbsp; <b>R</b> 重开</div>
    <div><b>鼠标</b> 拖拽旋转 / 滚轮缩放</div>
  </div>
  <div id="views"></div>
  <div class="panel" id="result"><h1></h1><p></p></div>
  <div class="panel" id="debug"></div>
</div>
<div id="loading">正在展开战场…</div>

<script>
(function(){
  var base = 'https://cdn.jsdelivr.net/npm/three@0.185.0/';
  var forceWebGL = /[?&]webgl=1/.test(location.search);
  window.__BOOT_ERR = null;
  function start(mode){
    window.__RENDERER_MODE = mode;
    var imports = {};
    imports['three'] = base + (mode === 'webgpu' ? 'build/three.webgpu.min.js' : 'build/three.module.js');
    imports['three/addons/'] = base + 'examples/jsm/';
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(im);
    var app = document.createElement('script');
    app.type = 'module';
    app.textContent = document.getElementById('app-src').textContent;
    document.body.appendChild(app);
  }
  function boot(){
    if (navigator.gpu && !forceWebGL) {
      navigator.gpu.requestAdapter().then(function(a){ start(a ? 'webgpu' : 'webgl'); })
        .catch(function(){ start('webgl'); });
    } else {
      start('webgl');
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script type="text/plain" id="app-src">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const LOADING = document.getElementById('loading');
function fatal(e) {
  window.__BOOT_ERR = String(e && e.stack || e);
  const d = document.getElementById('debug');
  if (d) { d.style.display = 'block'; d.textContent = window.__BOOT_ERR; }
  if (LOADING) LOADING.remove();
}
window.addEventListener('error', ev => fatal(ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => fatal(ev.reason));

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(0x51A7B3);
const vrnd = mulberry32(0x9D3C71);
const QUERY = location.search || '';
const NOHUD = /[?&]nohud=1/.test(QUERY);
const SPEEDS = [0.5, 1, 2, 4];

const HUD = {
  phase: document.getElementById('phase'), clock: document.getElementById('clock'),
  speed: document.getElementById('speed'), log: document.getElementById('log'),
  air: document.getElementById('air'),
  result: document.getElementById('result'), views: document.getElementById('views'),
  u: {
    units: document.getElementById('u-units'), bar: document.getElementById('u-bar'),
    men: document.getElementById('u-men'), mor: document.getElementById('u-mor'), mbar: document.getElementById('u-mbar')
  },
  c: {
    units: document.getElementById('c-units'), bar: document.getElementById('c-bar'),
    men: document.getElementById('c-men'), mor: document.getElementById('c-mor'), mbar: document.getElementById('c-mbar')
  }
};
if (NOHUD) document.getElementById('hud').style.display = 'none';

const MODE = window.__RENDERER_MODE || 'webgl';
const renderer = MODE === 'webgpu'
  ? new THREE.WebGPURenderer({ antialias: true })
  : new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
if (MODE === 'webgpu' && renderer.init) await renderer.init();
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
if (renderer.shadowMap) {
  renderer.shadowMap.enabled = true;
  try { renderer.shadowMap.type = THREE.PCFShadowMap; } catch (e) { }
}
renderer.domElement.style.touchAction = 'none';
document.getElementById('stage').appendChild(renderer.domElement);
if (LOADING) LOADING.remove();

const scene = new THREE.Scene();
const FOG_COLOR = 0xcdbfa2;
/* 雾的近端要落在战场与机场之外：近端 140 m 会把机场(150~260 m)与远处障碍洗成天空色 */
scene.fog = new THREE.Fog(FOG_COLOR, 260, 1350);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 2400);
camera.position.set(0, 86, 205);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 12;
controls.maxDistance = 520;
controls.maxPolarAngle = Math.PI / 2.06;
controls.target.set(0, 5, 0);

const SUN_DIR = new THREE.Vector3(0.52, 0.72, 0.34).normalize();
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.copy(SUN_DIR).multiplyScalar(240);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -170; sun.shadow.camera.right = 170;
sun.shadow.camera.top = 170; sun.shadow.camera.bottom = -170;
sun.shadow.camera.near = 60; sun.shadow.camera.far = 560;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.07;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x7d7448, 1.15));
scene.add(new THREE.AmbientLight(0xfff2dd, 0.34));

/* ---------- 后处理：EffectComposer + Bloom + 调色/暗角 ---------- */
const FXQ = new URLSearchParams(location.search);
const FX = {
  enabled: false,
  wanted: MODE === 'webgl' && FXQ.get('fx') !== '0',
  bloomStrength: +(FXQ.get('bloom') || 0.28),
  grain: FXQ.get('grain') === '0' ? 0 : 0.01
};
let composer = null, bloomPass = null, gradePass = null, fxTime = 0;

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: 0.42 },
    uGrain: { value: 0.01 },
    uWarm: { value: 0.5 }
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform float uTime;',
    'uniform float uVignette;',
    'uniform float uGrain;',
    'uniform float uWarm;',
    'varying vec2 vUv;',
    'float fxHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'void main(){',
    '  vec4 c = texture2D(tDiffuse, vUv);',
    '  c.rgb = mix(c.rgb, c.rgb * vec3(1.045, 1.005, 0.945), uWarm);',
    '  float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));',
    '  c.rgb = mix(vec3(l), c.rgb, 1.02);',
    '  c.rgb = max((c.rgb - 0.5) * 1.03 + 0.5, vec3(0.0));',
    '  vec2 d = vUv - 0.5;',
    '  c.rgb *= clamp(1.0 - uVignette * dot(d, d) * 2.6, 0.0, 1.0);',
    '  float g = fxHash(vUv * vec2(1024.0, 768.0) + fract(uTime) * 91.7) - 0.5;',
    '  c.rgb += g * uGrain;',
    '  gl_FragColor = c;',
    '}'
  ].join('\n')
};

if (FX.wanted) {
  try {
    const mods = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),
      import('three/addons/postprocessing/OutputPass.js')
    ]);
    const w = window.innerWidth, h = window.innerHeight;
    composer = new mods[0].EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    composer.setSize(w, h);
    composer.addPass(new mods[1].RenderPass(scene, camera));
    bloomPass = new mods[2].UnrealBloomPass(new THREE.Vector2(w, h), FX.bloomStrength, 0.6, 1.3);
    composer.addPass(bloomPass);
    gradePass = new mods[3].ShaderPass(GradeShader);
    gradePass.uniforms.uGrain.value = FX.grain;
    composer.addPass(gradePass);
    composer.addPass(new mods[4].OutputPass());
    FX.enabled = true;
  } catch (e) {
    FX.enabled = false;
    console.warn('[postfx] 编译失败，回退直出渲染', e);
  }
}
try { if (renderer.info && 'autoReset' in renderer.info) renderer.info.autoReset = false; } catch (e) { }


function canvasTexture(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  t.anisotropy = 4;
  return t;
}
function radialTex(size, stops) {
  return canvasTexture(size, size, (g, w, h) => {
    const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    for (const s of stops) rg.addColorStop(s[0], s[1]);
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  });
}

const skyTex = canvasTexture(1024, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0.00, '#1e4a8c');
  gr.addColorStop(0.30, '#4d7fbe');
  gr.addColorStop(0.50, '#8fb2d2');
  gr.addColorStop(0.62, '#c3c8b8');
  gr.addColorStop(0.72, '#ddcaa2');
  gr.addColorStop(1.00, '#c0aa84');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = mulberry32(9);
  for (let i = 0; i < 90; i++) {
    const x = r() * w, y = 40 + r() * 250, rad = 70 + r() * 240, hh = 0.12 + r() * 0.3;
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, 'rgba(255,252,246,' + (0.3 + r() * 0.35).toFixed(2) + ')');
    rg.addColorStop(1, 'rgba(255,252,246,0)');
    g.save(); g.translate(x, y); g.scale(1, hh); g.translate(-x, -y);
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill(); g.restore();
  }
  const sg = g.createRadialGradient(760, 430, 0, 760, 430, 110);
  sg.addColorStop(0, 'rgba(255,242,214,.55)');
  sg.addColorStop(1, 'rgba(255,242,214,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(760, 430, 110, 0, TAU); g.fill();
});
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1050, 32, 20),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })
);
sky.renderOrder = -20;
scene.add(sky);

function terrainBase(x, z) {
  const n = Math.sin(x * 0.019 + 1.3) * Math.cos(z * 0.016 - 0.7)
    + 0.55 * Math.sin((x + z) * 0.037 + 2.1)
    + 0.32 * Math.cos((x - z) * 0.055 - 1.1)
    + 0.20 * Math.sin(x * 0.088) * Math.sin(z * 0.079);
  const dz = Math.max(Math.abs(z) - 94, 0), dx = Math.max(Math.abs(x) - 152, 0);
  return n * 2.6 * smooth(Math.hypot(dx, dz) / 48);
}
/* ---- 机场：跑道范围先在地形里压平，否则飞机是在起伏草地上滑跑/接地 ---- */
/* 机场必须整个落在本军后方：跑道不得伸进战线/炮兵阵地，也不能占用观赏机位的空域。
   yaw = 起飞方向（0 朝 +z，π/2 朝 +x）；跑道长轴与它对齐 —— 机场整体转 90° 后
   跑道沿 x 铺开，两侧机场镜像，飞机改成朝侧翼起飞、升空后再转向战场。 */
const AIRFIELD = { union: { x: 0, z: -185, yaw: Math.PI / 2 }, confederate: { x: 0, z: 185, yaw: -Math.PI / 2 } };
const PAD_X = 40, PAD_Z = 78, PAD_FADE = 30;
/* 机场局部坐标 <-> 世界坐标（局部 +z 即起飞方向） */
const afWorld = (A, lx, lz) => [A.x + lx * Math.cos(A.yaw) + lz * Math.sin(A.yaw),
  A.z - lx * Math.sin(A.yaw) + lz * Math.cos(A.yaw)];
function afLocal(A, x, z) {
  const dx = x - A.x, dz = z - A.z, c = Math.cos(A.yaw), s = Math.sin(A.yaw);
  return [dx * c - dz * s, dx * s + dz * c];
}
const PAD_Y = {};
for (const k in AIRFIELD) PAD_Y[k] = terrainBase(AIRFIELD[k].x, AIRFIELD[k].z);
function onAirfield(x, z) {
  for (const k in AIRFIELD) {
    const A = AIRFIELD[k], l = afLocal(A, x, z);
    if (Math.abs(l[0]) < PAD_X + 12 && Math.abs(l[1]) < PAD_Z + 12) return true;
  }
  return false;
}
function terrainH(x, z) {
  let y = terrainBase(x, z);
  for (const k in AIRFIELD) {
    const A = AIRFIELD[k], l = afLocal(A, x, z);
    const fx = clamp(1 - (Math.abs(l[0]) - PAD_X) / PAD_FADE, 0, 1);
    const fz = clamp(1 - (Math.abs(l[1]) - PAD_Z) / PAD_FADE, 0, 1);
    const w = fx * fz;
    if (w > 0) y = lerp(y, PAD_Y[k], w);
  }
  return y;
}

const grassTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#8a9459'; g.fillRect(0, 0, w, h);
  const r = mulberry32(21);
  for (let i = 0; i < 9000; i++) {
    const v = r();
    g.fillStyle = v < 0.34 ? 'rgba(160,170,92,.5)' : v < 0.68 ? 'rgba(118,128,72,.5)' : 'rgba(186,172,110,.42)';
    g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
  }
  for (let i = 0; i < 300; i++) {
    g.strokeStyle = 'rgba(150,140,84,.3)'; g.lineWidth = 1;
    const x = r() * w, y = r() * h;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + r() * 4 - 2, y - 3 - r() * 4); g.stroke();
  }
}, 52);

const groundGeo = new THREE.PlaneGeometry(780, 780, 128, 128);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cA = new THREE.Color(0x76854a), cB = new THREE.Color(0xa79c62), cC = new THREE.Color(0xb6a473);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainH(x, z);
    pos.setY(i, y);
    tmp.copy(cA).lerp(cB, clamp((y + 2.6) / 5.4, 0, 1)).lerp(cC, rnd() * 0.3);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, map: grassTex, roughness: 0.97, metalness: 0
}));
ground.receiveShadow = true;
scene.add(ground);

const dirtTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#7d6a4e'; g.fillRect(0, 0, w, h);
  const r = mulberry32(31);
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = r() < 0.5 ? 'rgba(104,86,60,.5)' : 'rgba(150,129,96,.45)';
    g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 2);
  }
  for (const x of [w * 0.22, w * 0.78]) {
    g.strokeStyle = 'rgba(96,80,58,.22)'; g.lineWidth = 10;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 5, h); g.stroke();
  }
});
dirtTex.wrapS = dirtTex.wrapT = THREE.RepeatWrapping;
dirtTex.repeat.set(26, 1);
const road = new THREE.Mesh(new THREE.PlaneGeometry(780, 7.5), new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 }));
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.02, 15);

const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

const at = (g, x, y, z) => { g.translate(x, y, z); return g; };
/* 静态批处理：把一批"永不动、同材质"的实例烘焙成一个合并网格（1 个 draw call）。
   相对 InstancedMesh 的好处：没有逐实例矩阵更新，包围球按真实顶点算（视锥剔除依然有效），
   也不会踩到"动态 InstancedMesh 包围球不刷新"的坑；代价是不能再逐实例改属性，
   所以只适合道具/工事构件这类静态物。 */
function bakedMesh(mat, list) {
  const parts = [];
  for (const it of list) {
    /* mergeGeometries 要求所有几何的 index 状态一致：IcosahedronGeometry 是非索引的，
       与 Box/Cylinder 混在一起会直接失败 → 统一转成非索引再合并 */
    const g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    g.applyMatrix4(it.m4);
    const c = new THREE.Color(it.col), n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    parts.push(g);
  }
  const mesh = new THREE.Mesh(mergeGeometries(parts), mat);
  mesh.matrixAutoUpdate = false;      // 静态对象：跳过每帧矩阵重建
  mesh.updateMatrix();
  scene.add(mesh);
  return mesh;
}

const _pose = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 };
function poseOf(anim, s) {
  if (anim === 'none') return null;
  const st = s.state, ph = s.phase, ride = s.mounted;
  const k = clamp(s.spd / 6.5, 0, 1);
  let w;
  if (st === 'walk') w = s.animT * (5.2 + s.spd * 1.2) + ph;
  else if (st === 'charge') w = s.animT * 13.0 + ph;
  else if (st === 'melee') w = s.animT * 9.5 + ph;
  else if (st === 'work') w = s.animT * 6.0 + ph;
  else w = s.animT * 2.4 + ph;
  const p = _pose, rec = s.recoil, swing = Math.sin(w);
  p.px = p.py = p.pz = p.rx = p.ry = p.rz = 0;
  const walk = st === 'walk', charge = st === 'charge', melee = st === 'melee';
  const fire = st === 'fire', work = st === 'work', down = st === 'down' || st === 'dead' || st === 'gone';
  switch (anim) {
    case 'torso':
      if (down) p.rx = 0;
      else if (charge) { p.rx = 0.3; p.py = Math.abs(swing) * 0.045; }
      else if (melee) { const th = Math.max(0, Math.sin(w)); p.rx = 0.13 + 0.14 * th; p.py = 0.02 * th; }
      else if (fire) p.rx = 0.03 - 0.07 * rec;
      else if (work) p.rx = 0.24 + 0.1 * Math.sin(w * 1.3);
      else if (walk) { p.rx = 0.08; p.py = Math.abs(swing) * 0.028; }
      else { p.rx = 0.02; p.ry = Math.sin(s.animT * 0.8 + ph) * 0.045; }
      break;
    case 'head':
      if (down) p.rx = 0.25;
      else if (charge) p.rx = -0.14;
      else if (melee) p.rx = 0.04;
      else if (fire) p.rx = -0.05;
      else if (work) p.rx = 0.1;
      else { p.rx = -0.03; p.ry = Math.sin(w * 0.5 + ph) * 0.08; }
      break;
    case 'armL':
      if (down) { p.rx = 0.3; p.rz = 0.2; }
      else if (charge) p.rx = -0.72 - 0.3 * swing;
      else if (melee) p.rx = -0.45 - 0.3 * Math.abs(swing);
      else if (fire) p.rx = -1.34;
      else if (work) p.rx = -0.55 + 0.55 * Math.sin(w * 1.6);
      else if (walk) p.rx = -swing * 0.45;
      else p.rx = 0.04;
      break;
    case 'armR':
      if (down) { p.rx = -0.2; p.rz = -0.2; }
      else if (charge) p.rx = -0.6 - 0.28 * swing;
      else if (melee) p.rx = -0.7 - 1.05 * Math.max(0, Math.sin(w));
      else if (fire) p.rx = -1.24 + 0.22 * rec;
      else if (work) p.rx = -0.5 + 0.5 * Math.sin(w * 1.6 + 0.6);
      else if (walk) p.rx = swing * 0.3;
      else p.rx = 0.04;
      break;
    case 'legL':
    case 'legR': {
      const sgn = anim === 'legL' ? 1 : -1;
      if (ride) { p.rx = anim === 'legL' ? -1.28 : -1.1; p.rz = 0.16; }
      else if (down) { p.rx = sgn > 0 ? 0.4 : -0.25; p.rz = sgn * 0.12; }
      else if (charge) p.rx = sgn * swing * 0.92;
      else if (melee) { p.rx = sgn * 0.26 + 0.14 * swing; p.rz = sgn * 0.16; }
      else if (fire) { p.rx = sgn * 0.16; p.rz = sgn * 0.2; }
      else if (walk) p.rx = sgn * swing * 0.52;
      else p.rx = sgn * 0.04;
      break;
    }
    case 'musket':
      if (ride) { p.rx = -1.3; p.rz = 0.5; p.pz = -0.18; p.py = -0.06; }
      else if (down) { p.rx = -0.5; p.pz = -0.2; p.py = -0.3; p.rz = 0.5; }
      else if (charge) { p.rx = -0.24 + 0.06 * swing; p.pz = 0.3; p.py = 0.08; p.rz = -0.08; }
      else if (melee) { const th = Math.max(0, Math.sin(w)); p.rx = -0.28; p.pz = 0.16 + 0.44 * th; p.py = 0.02; p.px = 0.02; p.rz = -0.1; }
      else if (fire) { p.rx = 0.06 * rec; p.pz = 0.34 - 0.16 * rec; p.py = 0.24; p.px = -0.02; }
      else if (walk) { p.rx = -1.14; p.rz = 0.24; p.py = 0.05; }
      else { p.rx = -1.1; p.rz = 0.24; p.py = 0.04; }
      break;
    case 'saber':
      if (down) { p.rx = -0.3; p.rz = 0.6; }
      else if (charge) { p.rx = -1.6 + 0.22 * swing; p.rz = 0.34; }
      else if (melee) { p.rx = -0.35 - 0.95 * Math.max(0, Math.sin(w)); p.rz = 0.18; }
      else { p.rx = -1.4; p.rz = 0.3; }
      break;
    case 'hBody':
      if (s.spd > 0.2) { p.py = Math.abs(Math.sin(w)) * 0.05 * k; p.rx = -0.03 * k; }
      break;
    case 'hNeck':
      if (s.spd > 0.2) p.rx = -0.08 + 0.13 * Math.sin(w + 1) * k;
      break;
    case 'hLegA':
      p.rx = s.spd > 0.2 ? Math.sin(w) * 0.6 * k : 0.02;
      break;
    case 'hLegB':
      p.rx = s.spd > 0.2 ? -Math.sin(w) * 0.6 * k : -0.02;
      break;
  }
  return p;
}
class TroopPool {
  constructor(parts, count, mats) {
    this.parts = [];
    this.count = count;
    this.hidden = new THREE.Matrix4().makeScale(0, 0, 0);
    for (const def of parts) {
      const mesh = new THREE.InstancedMesh(def.geo, mats[def.mat], count);
      mesh.castShadow = true;
      mesh.frustumCulled = false;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(mesh);
      const local = new THREE.Object3D();
      local.position.set(def.pos[0], def.pos[1], def.pos[2]);
      local.rotation.set(0, 0, 0);
      local.scale.set(1, 1, 1);
      local.updateMatrix();
      for (let i = 0; i < count; i++) mesh.setMatrixAt(i, this.hidden);
      mesh.instanceMatrix.needsUpdate = true;
      this.parts.push({ def, mesh, base: local.matrix.clone(), local });
    }
  }
  flush() { for (const P of this.parts) P.mesh.instanceMatrix.needsUpdate = true; }
}

const _dummy = new THREE.Object3D();
const _root = new THREE.Matrix4();
const _part = new THREE.Matrix4();
function writeSoldier(pool, idx, s) {
  _dummy.position.set(s.x, s.y, s.z);
  _dummy.rotation.order = 'YXZ';
  _dummy.rotation.set(s.tilt, s.yaw, s.roll);
  _dummy.scale.set(1, 1, 1);
  _dummy.updateMatrix();
  _root.copy(_dummy.matrix);
  for (const P of pool.parts) {
    const pose = poseOf(P.def.anim, s);
    if (pose) {
      P.local.position.set(P.def.pos[0] + pose.px, P.def.pos[1] + pose.py, P.def.pos[2] + pose.pz);
      P.local.rotation.set(pose.rx, pose.ry, pose.rz);
      P.local.updateMatrix();
      _part.multiplyMatrices(_root, P.local.matrix);
    } else {
      _part.multiplyMatrices(_root, P.base);
    }
    P.mesh.setMatrixAt(idx, _part);
  }
}
function hideSoldier(pool, idx) {
  for (const P of pool.parts) P.mesh.setMatrixAt(idx, pool.hidden);
}

class Unit {

    this.files = cfg.files; this.ranks = cfg.ranks;
    this.sx = cfg.sx || 1.55; this.sz = cfg.sz || 1.75;
    this.soldiers = cfg.soldiers;
    this.slots = [];
    this.slotSoldier = [];
    this.soldierSlot = new Array(this.soldiers.length);
    this.state = 'idle';
    this.stateT = 0;
    this.spd = 0;
    this.target = null;
    this.men = this.soldiers.length;
    this.maxMen = this.men;

    this.guns = null;
    let k = 0;
    for (let r = 0; r < cfg.ranks; r++) {
      for (let f = 0; f < cfg.files; f++) {
        this.slots.push([(f - (cfg.files - 1) / 2) * this.sx, (r - (cfg.ranks - 1) / 2) * this.sz]);
        this.slotSoldier.push(k);
        this.soldierSlot[k] = this.slots.length - 1;
        const s = this.soldiers[k];
        if (s) { s.unit = this; s.si = k; }
        k++;
      }
    }
    this.banner = makeBanner(this);
  }
  slotWorld(slotIdx, out) {
    const sl = this.slots[slotIdx];
    const sn = Math.sin(this.yaw), cs = Math.cos(this.yaw);
    out.x = this.cx + sl[0] * cs + sl[1] * sn;
    out.z = this.cz - sl[0] * sn + sl[1] * cs;
    return out;
  }
  aliveSoldiers() {
    const a = this._alive || (this._alive = []);
    a.length = 0;
    for (const s of this.soldiers) if (s.alive) a.push(s);
    return a;
  }
  kill(s) {
    if (!s.alive) return;
    s.alive = false; s.state = 'down'; s.fallT = 0; s.spd = 0; s.target = null;
    this.men--;
    const slot = this.soldierSlot[s.si];
    if (slot !== undefined && slot >= 0) {
      let last = this.slots.length - 1;
      while (last >= 0 && this.slotSoldier[last] === -1) last--;
      if (last >= 0 && last !== slot) {
        const mv = this.slotSoldier[last];
        this.slotSoldier[slot] = mv;
        this.soldierSlot[mv] = slot;
        this.slotSoldier[last] = -1;
      }
    }
  }
  get onField() { return this.kind !== 'art' && !this.gone && this.men > 0 && this.state !== 'rout'; }
}

/* 程序化烟气贴图：域扭曲 fBm 湍流 + 柔和边缘(不触及 quad 边) + 顶亮底暗的自遮蔽亮度 */
function puffTex(size, seed, rgb, maxAlpha, lit) {
  const r = mulberry32(seed);
  const G = 24, g = new Float32Array(G * G);
  for (let i = 0; i < g.length; i++) g[i] = r();
  const fade = t => t * t * (3 - 2 * t);
  const at = (x, y) => g[(y % G) * G + (x % G)];
  function noise(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = fade(x - x0), fy = fade(y - y0);
    return lerp(lerp(at(x0, y0), at(x0 + 1, y0), fx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), fx), fy);
  }
  const fbm = (x, y) => noise(x, y) * 0.5 + noise(x * 2.3 + 11.3, y * 2.3 + 5.1) * 0.3 + noise(x * 5.1 + 3.7, y * 5.1 + 9.4) * 0.2;
  return canvasTexture(size, size, (ctx, w, h) => {
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const u = x / w, v = y / h;
        const wx = fbm(u * G * 0.6 + 21.7, v * G * 0.6 + 4.3) - 0.5;
        const wy = fbm(u * G * 0.6 + 7.1, v * G * 0.6 + 31.9) - 0.5;
        const n = clamp(fbm(u * G + wx * 7.0, v * G + wy * 7.0) * 1.18, 0, 1);
        const dist = Math.hypot(u - 0.5, v - 0.5) * 2;
        const core = clamp((1.06 - dist * (0.6 + 0.7 * n)) / 0.55, 0, 1);
        const guard = clamp((1.0 - dist) / 0.16, 0, 1);
        const a = clamp(Math.pow(core, 1.05) * (0.5 + 0.8 * n) - 0.2, 0, 1) * guard * maxAlpha;
        const shade = (0.64 + 0.55 * lit) + (0.36 + 0.35 * lit) * (1 - v) + (n - 0.5) * 0.26;
        const i = (y * w + x) * 4;
        d[i] = clamp(rgb[0] * shade, 0, 255);
        d[i + 1] = clamp(rgb[1] * shade, 0, 255);
        d[i + 2] = clamp(rgb[2] * shade, 0, 255);
        d[i + 3] = clamp(a + (r() - 0.5) / 255, 0, 1) * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  });
}

class ParticlePool {
  constructor(opt) {
    const count = opt.count;
    this.items = [];
    this.rng = opt.rng || rnd;
    this.premul = !!opt.premul;
    this.maxSize = opt.maxSize || Infinity;
    this.hdr = opt.hdr === undefined ? 1 : opt.hdr;
    this.tint = opt.tint || [1, 1, 1];
    this.tintVar = opt.tintVar === undefined ? 0.08 : opt.tintVar;
    this.bright = opt.bright === undefined ? [0.86, 1.14] : opt.bright;
    this.wind = opt.wind === undefined ? 0 : opt.wind;
    this.buoy = opt.buoy || 0;
    this.drag = opt.drag === undefined ? 0.5 : opt.drag;
    this.groundFade = opt.groundFade || 0;
    this.geo = new THREE.PlaneGeometry(1, 1);
    this.mat = new THREE.MeshBasicMaterial({
      map: opt.tex, transparent: true, depthWrite: false,
      blending: this.premul ? THREE.CustomBlending : opt.blending,
      side: THREE.DoubleSide
    });
    if (this.premul) {
      /* premultiplied alpha: 实例色只携带「不透明度 f」，片段里同时对 rgb 与 a 预乘，
         否则叠加时 dst 会被 (1-a) 压向近黑，薄烟会变成脏黑影 */
      this.mat.color.setRGB(this.tint[0], this.tint[1], this.tint[2]);
      this.mat.blendSrc = THREE.OneFactor;
      this.mat.blendDst = THREE.OneMinusSrcAlphaFactor;
      this.mat.onBeforeCompile = sh => {
        sh.vertexShader = 'varying float vFade;\n' + sh.vertexShader.replace(
          '#include <color_vertex>', '#include <color_vertex>\n\tvFade = instanceColor.r;');
        sh.fragmentShader = 'varying float vFade;\n' + sh.fragmentShader.replace(
          '#include <color_fragment>', '#include <color_fragment>\n\tdiffuseColor *= vFade;');
      };
      this.mat.customProgramCacheKey = () => 'premulFade';
    }
    this.mesh = new THREE.InstancedMesh(this.geo, this.mat, count);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 2;
    for (let i = 0; i < count; i++) {
      this.items.push({
        life: 0, ttl: 1, s0: 1, s1: 1, o0: 1, o1: 0, vx: 0, vy: 0, vz: 0,
        spin: 0, rot: 0, x: 0, y: 0, z: 0, a: 0, drawn: false,
        r: 1, g: 1, b: 1, v: 1, br: 1
      });
      this.mesh.setColorAt(i, _pc.setRGB(1, 1, 1));
      this.mesh.setMatrixAt(i, _pm.makeScale(0, 0, 0));

      if (it.life > 0) continue;
      it.life = it.ttl = ttl; it.s0 = s0; it.s1 = s1; it.o0 = o0; it.o1 = o1;
      it.vx = vx || 0; it.vy = vy || 0; it.vz = vz || 0;
      it.spin = (this.rng() - 0.5) * 0.5;
      it.rot = this.rng() * TAU;
      it.v = 0.72 + this.rng() * 0.62;
      const tv = this.tintVar;
      it.r = this.tint[0] * (1 + (this.rng() - 0.5) * tv);
      it.g = this.tint[1] * (1 + (this.rng() - 0.5) * tv);
      it.b = this.tint[2] * (1 + (this.rng() - 0.5) * tv);
      it.br = lerp(this.bright[0], this.bright[1], this.rng());
      it.x = x; it.y = y; it.z = z; it.a = o0;
      return true;
    }
    return false;
  }
  alive() { let n = 0; for (const it of this.items) if (it.life > 0) n++; return n; }
  update(dt) {
    const wx = WIND.x * this.wind, wz = WIND.z * this.wind;
    const k = 1 - this.drag * dt;
    for (const it of this.items) {
      if (it.life <= 0) continue;
      it.life -= dt;
      if (it.life <= 0) continue;
      it.vx = it.vx * k + wx * dt;
      it.vz = it.vz * k + wz * dt;
      it.vy = it.vy * k + this.buoy * dt;
      it.x += it.vx * dt; it.y += it.vy * dt; it.z += it.vz * dt;
      it.rot += it.spin * dt;
    }
  }
  sync() {
    const q = camera.quaternion, n = this.items.length;
    const color = this.mesh.instanceColor;
    let touched = false;
    for (let i = 0; i < n; i++) {
      const it = this.items[i];
      if (it.life > 0) {
        const t = 1 - it.life / it.ttl;
        const s = Math.min(lerp(it.s0, it.s1, t), this.maxSize) * it.v;
        it.a = lerp(it.o0, it.o1, t);
        _pq.copy(q).multiply(_pz.setFromAxisAngle(PZ, it.rot));
        this.mesh.setMatrixAt(i, _pm.compose(_pp.set(it.x, it.y, it.z), _pq, _ps.set(s, s, 1)));
        if (color) {
          let k = it.a;
          if (this.groundFade) k *= clamp((it.y - terrainH(it.x, it.z)) / this.groundFade, 0, 1);
          k *= it.br;
          if (this.premul) {
            /* 预乘池：通道只表示不透明度，颜色由贴图 × material.color 决定 */
            const f = clamp(k, 0, 1);
            _pc.setRGB(f, f, f);
          } else {
            k *= this.hdr * it.br;
            _pc.setRGB(k * it.r, k * it.g, k * it.b);
          }
          this.mesh.setColorAt(i, _pc);
        }
        it.drawn = true;
        touched = true;
      } else if (it.drawn) {
        this.mesh.setMatrixAt(i, _pm.makeScale(0, 0, 0));
        it.drawn = false;
        touched = true;
      }
    }
    if (touched) {
      this.mesh.instanceMatrix.needsUpdate = true;
      if (color) color.needsUpdate = true;
    }
  }
}

function projectilesUpdate(dt) {

/* ---- 战壕关键尺寸（先声明：布阵时要把步兵放进壕沟，不能靠手调 z ----） ---- */
const TRENCH_Z = { union: -46, confederate: 46 };
const HALF_TRENCH = 92;
const TRENCH_DITCH_DZ = -0.175;   // 壕沟底中心相对工程中心线的朝敌偏移
const trenchWob = x => Math.sin(x * 0.19) * 0.5 + Math.sin(x * 0.066 + 2.1) * 0.95;
const trenchFace = key => key === 'union' ? 1 : -1;
/* 壕沟底中心的世界 z：步兵应站在这里（工程中心线 + 蛇形 + 沟底偏移） */
const trenchDitchZ = (key, x) => TRENCH_Z[key] + (trenchWob(x) + TRENCH_DITCH_DZ) * trenchFace(key);
/* 出击口（散兵口）：开在各单位之间的空档上，胸墙/踏台/头木在这段压低成可跨越的缓坡。
   刻意不开在单位正面——那是掩护最不该被削弱的位置，而且口子里没有胸墙就没有掩护。 */
const BREACH_X = [-41, -1, 38, 80];
const BREACH_HALF = 12;
function breachFactor(x) {
  let o = 0;
  for (const c of BREACH_X) o = Math.max(o, clamp(1 - Math.abs(x - c) / BREACH_HALF, 0, 1));
  return o * o * (3 - 2 * o);
}
/* 断面：dz 朝敌为正，h 为高出天然地面的高度，k 为受光系数（壕内压暗） */
const TRENCH_ROWS = [
  { dz: -2.70, h: 0.04, k: 0.50 },   // 背墙后坡脚
  { dz: -2.05, h: 0.74, k: 0.94 },   // 背墙顶 (parados)
  { dz: -1.55, h: 0.12, k: 0.56 },   // 背墙内坡
  { dz: -1.15, h: 0.04, k: 0.38 },   // 壕底后缘
  { dz: 0.80, h: 0.04, k: 0.38 },    // 壕底前缘
  { dz: 1.30, h: 0.52, k: 0.72 },    // 踏台 (fire step)
  { dz: 1.95, h: 1.30, k: 1.00 },    // 胸墙顶 (parapet)：1.30 m 才挡到站立者肩部
  { dz: 3.05, h: 0.04, k: 0.84 }     // 胸墙前坡脚
];
const TR_LAST = TRENCH_ROWS.length - 1;
const trenchRowH = (h, j, open) => j === 5 ? h * (1 - 0.62 * open)
  : j === 6 ? h * (1 - 0.80 * open) : h;
const ABATIS_DZ = 3.55;        // 鹿砦带（胸墙前的拒马桩）

/* 工事表面相对天然地面的高度场 —— 与建壕共用同一组断面数据，
   所以士兵的 y 真正踩在网格上：过胸墙是"翻过去"，不是"穿过去"。 */
function workH(x, z) {
  let best = 0;
  for (const key of ['union', 'confederate']) {
    const f = trenchFace(key), wob = trenchWob(x);
    const s = (z - (TRENCH_Z[key] + wob * f)) * f;
    if (s < TRENCH_ROWS[0].dz || s > TRENCH_ROWS[TR_LAST].dz) continue;
    const open = breachFactor(x);
    for (let j = 0; j < TR_LAST; j++) {
      const A = TRENCH_ROWS[j], B = TRENCH_ROWS[j + 1];
      if (s > B.dz) continue;
      const t = (s - A.dz) / (B.dz - A.dz);
      const ya = terrainH(x, TRENCH_Z[key] + (A.dz + wob) * f) + trenchRowH(A.h, j, open);
      const yb = terrainH(x, TRENCH_Z[key] + (B.dz + wob) * f) + trenchRowH(B.h, j + 1, open);
      best = Math.max(best, lerp(ya, yb, t) - terrainH(x, z));
      break;
    }
  }
  return Math.max(0, best);
}
const groundY = (x, z) => terrainH(x, z) + Math.max(workH(x, z), obstacleH(x, z));
/* 鹿砦（拒马桩）带：对骑兵是致命的 */
function abatisFactor(x, z) {
  let m = 0;
  for (const key of ['union', 'confederate']) {
    const f = trenchFace(key), wob = trenchWob(x);
    const s = (z - (TRENCH_Z[key] + wob * f)) * f;
    m = Math.max(m, clamp(1 - Math.abs(s - ABATIS_DZ) / 0.9, 0, 1));
  }
  return m;
}
/* 通行代价（1 = 如履平地）：断面高差 —— 骑兵翻 1.3 m 胸墙几乎被挡停；
   再叠加胸墙前鹿砦的阻滞。这个属性必须进移动积分，否则工事只是贴图。 */
function workTraverse(kind, x, z) {
  const h = Math.max(workH(x, z), obstacleH(x, z));
  let fac = kind === 'cav'
    ? 1 - 0.92 * clamp((h - 0.10) / 0.90, 0, 1)
    : 1 - 0.72 * clamp((h - 0.15) / 1.00, 0, 1);
  const ab = abatisFactor(x, z);
  fac *= kind === 'cav' ? 1 - 0.78 * ab : 1 - 0.35 * ab;
  return clamp(fac, kind === 'cav' ? 0.05 : 0.25, 1);
}

/* ---- 随机战场障碍物：石墙 / 倒木 / 干草堆 / 木栅栏 / 碎石堆 ----
   布局用独立种子 ornd（既不吃玩法 rnd 也不吃视觉 vrnd），
   与战壕同一套属性：高度进 groundY/workTraverse（拖慢通行、抬人），
   掩体值进 coverAt（挡弹）。空间哈希网格保证逐士兵查询 O(1)。 */
const ornd = mulberry32(0x0B57AC1E);
const OBSTACLE_TYPES = [
  { id: 'wall', h: 0.78, cover: 0.62, minR: 1.6, maxR: 2.6, count: 34 },
  { id: 'log', h: 0.46, cover: 0.44, minR: 1.3, maxR: 2.1, count: 26 },
  { id: 'hay', h: 0.72, cover: 0.28, minR: 1.1, maxR: 1.6, count: 22 },
  { id: 'fence', h: 0.86, cover: 0.38, minR: 1.7, maxR: 2.8, count: 30 },
  { id: 'rock', h: 0.62, cover: 0.50, minR: 1.0, maxR: 1.6, count: 26 }
];
const obstacles = [];
{
  const freeAt = (x, z) => {
    if (Math.abs(Math.abs(z) - 46) < 13 && Math.abs(x) < 106) return false;  // 不压战壕与出发线
    if (Math.abs(Math.abs(z) - 98) < 10 && Math.abs(x) < 62) return false;   // 不占用炮兵阵地
    if (Math.abs(x) < 26 && Math.abs(z) < 22) return false;                  // 中央接触区留空
    return !onAirfield(x, z);
  };
  for (const T of OBSTACLE_TYPES) {
    let made = 0, guard = 0;
    while (made < T.count && guard++ < T.count * 50) {
      const x = (ornd() - 0.5) * 310, z = (ornd() - 0.5) * 250;
      if (!freeAt(x, z)) continue;
      obstacles.push({
        kind: T.id, x, z, r: lerp(T.minR, T.maxR, ornd()), h: T.h, cover: T.cover,
        rot: ornd() * TAU, sc: 0.82 + ornd() * 0.42
      });
      made++;
    }
  }
}
const OB_CELL = 8;
const obGrid = new Map();
const obKey = (ix, iz) => (ix + 64) * 512 + (iz + 64);
for (let i = 0; i < obstacles.length; i++) {
  const o = obstacles[i];
  const k = obKey(Math.floor(o.x / OB_CELL), Math.floor(o.z / OB_CELL));
  if (!obGrid.has(k)) obGrid.set(k, []);
  obGrid.get(k).push(i);
}
function obNear(x, z, fn) {
  const ix = Math.floor(x / OB_CELL), iz = Math.floor(z / OB_CELL);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    const cell = obGrid.get(obKey(ix + a, iz + b));
    if (cell) for (const i of cell) fn(obstacles[i]);
  }
}
function obstacleH(x, z) {
  let h = 0;
  obNear(x, z, o => {
    const d = Math.hypot(x - o.x, z - o.z);
    if (d < o.r) h = Math.max(h, o.h * clamp(1 - d / o.r, 0, 1));
  });
  return h;
}
function obstacleCover(x, z) {
  let c = 0;
  obNear(x, z, o => {
    if (!o.cover) return;
    const d = Math.hypot(x - o.x, z - o.z), rr = o.r * 1.3;
    if (d < rr) c = Math.max(c, o.cover * clamp(1 - d / rr, 0, 1) * 1.55);
  });
  return clamp(c, 0, 0.72);
}

function buildArmy(key) {
  const roster = ROSTER[key];

    + roster.artillery.reduce((a, u) => a + u.guns * 7, 0);
  const mountCount = roster.cavalry.reduce((a, u) => a + u.files * u.ranks, 0);
  const army = {
    key, side: SIDE[key],
    footPool: new TroopPool(FOOT_PARTS, footCount, MATE[key]),
    mountPool: new TroopPool(HORSE_PARTS, mountCount, MATE[key]),
    riderPool: new TroopPool(RIDER_PARTS, mountCount, MATE[key]),
    foot: [], mount: [], units: [], guns: [], footCursor: 0, mountCursor: 0
  };
  for (let i = 0; i < footCount; i++) army.foot.push(newSoldier(false));
  for (let i = 0; i < mountCount; i++) army.mount.push(newSoldier(true));

}

function makeArmyUnits(army) {
  const roster = ROSTER[army.key];
  const mk = (kind, cfg) => {
    const total = cfg.files * cfg.ranks;
    const soldiers = [];

      for (let i = 0; i < total; i++) {
        const s = army.foot[army.footCursor];
        s.idx = army.footCursor++;
        soldiers.push(s);
      }
    } else {
      for (let i = 0; i < total; i++) {
        const s = army.mount[army.mountCursor];
        s.idx = army.mountCursor++;
        soldiers.push(s);
      }
    }
    const u = new Unit(army, Object.assign({ kind, soldiers }, cfg));
    army.units.push(u);

  };
  for (const c of roster.infantry) mk('inf', c);
  for (const c of roster.cavalry) mk('cav', c);

        s.y = groundY(s.x, s.z);

    u.men = 1; u.maxMen = 1;

      s.y = groundY(s.x, s.z);
      s.yaw = u.yaw;

  }

   全部走物理步进（simulate），随机数严格分流：
   影响战局的（选目标/命中/伤亡）用 rnd，纯视觉的（粒子抖动）用 vrnd。 */

/* ---------- 战壕（野战胸墙 / field breastwork） ----------
   断面自内而外：背墙(parados) → 壕沟底 → 踏台(fire step) → 胸墙(parapet) → 前坡，
   胸墙顶再压头木(headlog)。四条实测出来的逻辑，早期版本每一条都反了：
   1) 胸墙高 ~1.18 m 只到人胸口，必须靠 0.48 m 的踏台才能越墙射击——
      没有踏台的"胸墙"是一堵用不上的墙；
   2) 壕沟底与天然地面齐平、由背墙与胸墙夹成，士兵站在两者之间；
      早期版本把深色"壕沟"画在胸墙外侧 3 m 的地面上，人站在开阔地里吃掩护；
   3) 背墙(parados)挡住落在阵线后方的炮弹破片；早期版本完全没有后墙；
   4) 掩体只在壕沟/踏台范围内、且火力来自胸墙一侧时成立；
      早期版本用对称距离 ±7 m 判定，胸墙外的开阔地和侧射都照吃掩护。
   另外每 ~40 m 一道横墙(traverse)限制侧射，每个单位正面留一处出击口(散兵口)，
   否则步兵推进时会直接穿过 1.18 m 的土墙。
   本工程因地面网格 128 段(≈6.1 m/格)无法真正下挖 2.5 m，故按南北战争常见的
   垒土胸墙建造（史料亦记"壕沟宽可坐立、朝敌一侧架木护头肩"）。 */
/* TRENCH_Z / trenchWob / breachFactor 见 ROSTER 之前的声明 */
const trenchTex = dirtTex.clone();
trenchTex.needsUpdate = true;
trenchTex.wrapS = trenchTex.wrapT = THREE.RepeatWrapping;
trenchTex.repeat.set(1, 1);
const trenchMat = new THREE.MeshStandardMaterial({
  map: trenchTex, vertexColors: true, roughness: 1, metalness: 0,
  polygonOffset: true, polygonOffsetFactor: -1.5, polygonOffsetUnits: -1.5
});


/* TRENCH_ROWS / trenchRowH / workH / workTraverse 见 ROSTER 之前的声明 */
function buildTrenchLine(key) {
  const f = key === 'union' ? 1 : -1;
  const tz = TRENCH_Z[key];
  const N = 144, xa = -HALF_TRENCH, xb = HALF_TRENCH;
  const R = TRENCH_ROWS.length;
  const pos = [], col = [], idx = [];
  const jit = mulberry32(key === 'union' ? 0x77A1 : 0x33C9);
  for (let i = 0; i <= N; i++) {
    const x = lerp(xa, xb, i / N), wob = trenchWob(x), open = breachFactor(x);
    for (let j = 0; j < R; j++) {
      const r = TRENCH_ROWS[j];
      const z = tz + (r.dz + wob) * f;
      pos.push(x, terrainH(x, z) + trenchRowH(r.h, j, open), z);
      const k = (0.85 + jit() * 0.3) * r.k;
      col.push(0.62 * k, 0.52 * k, 0.36 * k);
    }
  }
  const flip = f < 0;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < R - 1; j++) {
      const a = i * R + j, b = a + R, c = a + 1, d = b + 1;
      if (flip) idx.push(a, b, c, c, b, d);
      else idx.push(a, c, b, b, c, d);
    }
  }
  const uv = [];
  for (let i = 0; i <= N; i++) for (let j = 0; j < R; j++) uv.push(i / N * 40, j * 0.75);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const berm = new THREE.Mesh(g, trenchMat);
  berm.castShadow = true; berm.receiveShadow = true;
  berm.matrixAutoUpdate = false; berm.updateMatrix();   // 静态：省掉每帧矩阵重建
  scene.add(berm);

  const o = new THREE.Object3D();
  const R2 = mulberry32(key === 'union' ? 0x1144 : 0x7755);
  const mk = (geo, col, x, dz, h, rot, sc) => {
    const z = tz + (dz + trenchWob(x)) * f;
    o.position.set(x, terrainH(x, z) + h, z);
    o.rotation.set(rot[0], rot[1], rot[2]);
    o.scale.set(sc[0], sc[1], sc[2]);
    o.updateMatrix();
    return { geo, col, m4: o.matrix.clone() };
  };

  /* 附属构件全部静态 → 按材质烘焙成 3 个合并网格（原来 5 个 InstancedMesh）：
     沙袋+横墙、护壁桩+鹿砦、头木。 */
  const bagsL = [], stakesL = [], logsL = [];
  const bagGeo = new THREE.SphereGeometry(0.34, 8, 6);
  bagGeo.scale(1.15, 0.62, 0.78);
  const BAGS = 132;
  for (let i = 0; i < BAGS; i++) {
    const onPara = i < 84;
    const x = onPara
      ? lerp(xa, xb, (i + 0.5) / 84) + (R2() - 0.5) * 0.5
      : lerp(xa, xb, (i - 84 + 0.5) / (BAGS - 84)) + (R2() - 0.5) * 0.5;
    if (onPara && breachFactor(x) > 0.45) continue;      // 出击口不码沙袋
    const dz = onPara ? 1.72 : -2.05, h = onPara ? 1.20 : 0.78;
    bagsL.push(mk(bagGeo, 0x7a6a4a, x, dz + (R2() - 0.5) * 0.18, h + R2() * 0.08,
      [0, (R2() - 0.5) * 0.6, (R2() - 0.5) * 0.22], [1, 1, 1]));
  }
  /* 横墙 traverse：与胸墙垂直，横跨壕沟，限制纵射（同沙袋材质） */
  const trvGeo = box(2.3, 1.15, 4.9);
  for (const x of [-80, -60, -20, 20, 60]) {
    bagsL.push(mk(trvGeo, 0x7a6a4a, x, -0.10, 0.62, [0, (R2() - 0.5) * 0.06, 0], [1, 1, 1]));
  }
  /* 头木 headlog：压在胸墙顶、下方留出射孔（史料：朝敌一侧架木护头肩） */
  const logGeo = cyl(0.13, 0.15, 2.6, 7);
  logGeo.rotateZ(Math.PI / 2);
  for (let i = 0; i < 72; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 72);
    if (breachFactor(x) > 0.45) continue;
    logsL.push(mk(logGeo, 0x6b543a, x, 1.95, 1.36, [(R2() - 0.5) * 0.05, 0, 0], [1, 1, 1]));
  }
  /* 护壁木桩（贴壕沟内壁）+ 鹿砦（胸墙前的拒马桩） */
  const stakeGeo = cyl(0.055, 0.075, 1.0, 6);
  for (let i = 0; i < 96; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 96) + (R2() - 0.5) * 0.5;
    stakesL.push(i % 2 === 0
      ? mk(stakeGeo, 0x574429, x, 0.95, 0.36, [(R2() - 0.5) * 0.1, 0, -f * 0.20], [1, 1, 1])
      : mk(stakeGeo, 0x574429, x, -1.35, 0.34, [(R2() - 0.5) * 0.1, 0, f * 0.20], [1, 1, 1]));
  }
  for (let i = 0; i < 54; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 54) + (R2() - 0.5) * 0.8;
    stakesL.push(mk(stakeGeo, 0x574429, x, 3.55 + R2() * 0.5, 0.30,
      [(R2() - 0.5) * 0.2, R2() * TAU, f * (0.55 + R2() * 0.25)], [1, 1, 1]));
  }
  const fitMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
  bakedMesh(fitMat, bagsL).receiveShadow = true;               // 沙袋/横墙：不投影(阴影 0.166 m/texel 解析不出)
  bakedMesh(fitMat, stakesL).receiveShadow = true;             // 护壁桩/鹿砦
  bakedMesh(fitMat, logsL).castShadow = true;                  // 头木保留投影（2.6 m 长，影子里读得出）
}

        at(box(3.2, 0.11, 0.09), 0, 0.74, 0), at(box(3.2, 0.11, 0.09), 0, 0.44, 0)
      ])
    },

  };
  /* 障碍物永不动 → 全部烘焙成一个顶点着色网格（原来 5 个 InstancedMesh = 5 个 draw call） */
  const o = new THREE.Object3D(), baked = [];
  for (const ob of obstacles) {
    const D = defs[ob.kind];
    o.position.set(ob.x, terrainH(ob.x, ob.z) + 0.02, ob.z);
    o.rotation.set(ob.kind === 'log' ? (vr() - 0.5) * 0.1 : 0, ob.rot, ob.kind === 'rock' ? (vr() - 0.5) * 0.3 : 0);
    o.scale.set(ob.sc, ob.sc, ob.sc);

  }
  const mesh = bakedMesh(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), baked);
  mesh.castShadow = true; mesh.receiveShadow = true;
}

/* 掩体只在胸墙内侧的壕沟/踏台上成立（对称距离会把胸墙外的开阔地也算进去） */
function trenchCover(u) {
  const key = u.army.key, f = trenchFace(key);
  const s = (u.cz - (TRENCH_Z[key] + trenchWob(u.cx) * f)) * f;
  if (s < -3.0 || s > 1.5) return 0;
  if (Math.abs(u.cx) > HALF_TRENCH) return 0;
  /* 站在出击口里没有胸墙可依，掩护随之消失（与几何一致） */
  const base = u.state === 'melee' || u.state === 'charge' ? 0.25 : 1;
  return base * (1 - 0.85 * breachFactor(u.cx));
}
/* 综合掩体：战壕工事与随机障碍物取较优者（位置判定；方向性统一由 coverAgainst 施加） */
function coverAt(u) {
  return Math.max(trenchCover(u), obstacleCover(u.cx, u.cz));
}
/* 方向性：只有来自胸墙一侧的火力才被掩体削弱（侧射/背射不吃掩护） */
function coverAgainst(tgt, shooterZ) {
  const f = tgt.army.key === 'union' ? 1 : -1;
  return (shooterZ - tgt.cz) * f > 0 ? (tgt.cover || 0) : 0;
}

/* ---------- 通用刚体池：一个部件一个 InstancedMesh ---------- */
const _rigO = new THREE.Object3D();
_rigO.rotation.order = 'YXZ';
const _rigRoot = new THREE.Matrix4();
const _rigPart = new THREE.Matrix4();
class RigPool {
  constructor(parts, count, mats) {
    this.count = count;
    this.hidden = new THREE.Matrix4().makeScale(0, 0, 0);
    this.parts = [];
    for (const def of parts) {
      const mesh = new THREE.InstancedMesh(def.geo, mats[def.mat], count);
      mesh.castShadow = true;
      mesh.frustumCulled = false;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let i = 0; i < count; i++) {
        mesh.setMatrixAt(i, this.hidden);
        mesh.setColorAt(i, _pc.setRGB(1, 1, 1));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);
      const local = new THREE.Object3D();
      local.rotation.order = 'YXZ';
      local.position.set(def.pos[0], def.pos[1], def.pos[2]);
      local.updateMatrix();
      this.parts.push({ def, mesh, local });
    }
  }
  paint(idx, cols) {
    for (const P of this.parts) {
      const c = P.def.paint && cols[P.def.paint] ? cols[P.def.paint] : [1, 1, 1];
      P.mesh.setColorAt(idx, _pc.setRGB(c[0], c[1], c[2]));
      P.mesh.instanceColor.needsUpdate = true;
    }
  }
  write(idx, x, y, z, yaw, pitch, roll, dyn) {
    _rigO.position.set(x, y, z);
    _rigO.rotation.set(-pitch, yaw, roll);
    _rigO.updateMatrix();
    _rigRoot.copy(_rigO.matrix);
    for (const P of this.parts) {
      const d = P.def;
      if (d.dyn === 'yaw') P.local.rotation.set(0, dyn.yaw, 0);
      else if (d.dyn === 'barrel') P.local.rotation.set(-dyn.pitch, dyn.yaw, 0);
      else if (d.dyn === 'prop') P.local.rotation.set(0, 0, dyn.prop);
      if (d.dyn) P.local.updateMatrix();
      _rigPart.multiplyMatrices(_rigRoot, P.local.matrix);
      P.mesh.setMatrixAt(idx, _rigPart);
    }
  }
  hide(idx) { for (const P of this.parts) P.mesh.setMatrixAt(idx, this.hidden); }
  flush() { for (const P of this.parts) P.mesh.instanceMatrix.needsUpdate = true; }
}

const enemyOf = a => a === U ? C : U;
const STEP = 1 / 60;
const _v = { x: 0, z: 0 };

/* ==================== 集团 AI（双方各一套，指挥层） ====================
   每 AI_TICK 秒"思考"一次，给每个单位下 order；unitUpdate 只负责执行。
   决策全部是确定性评分（不用 PRNG），因此不会挪动 rnd 流。 */
const AI_TICK = 2.4;
function aiUpdate(army, dt) {
  const ai = army.ai || (army.ai = { t: 0, mode: 'engage', focus: null, focusUnits: [], flanker: null, reserve: null, committed: false, flankX: 0 });
  ai.t -= dt;
  if (ai.t > 0) return;
  ai.t = AI_TICK;
  const foe = enemyOf(army);
  const mine = army.units.filter(u => u.kind !== 'art' && !u.gone && u.men > 0);
  const theirs = foe.units.filter(u => u.kind !== 'art' && !u.gone && u.men > 0);
  if (!mine.length || !theirs.length) return;

  /* 1) 目标价值：残血 + 动摇 + 距离近 → 优先打垮（收割逻辑） */
  let focus = null, bs = -1e9;
  for (const e of theirs) {
    const loss = 1 - e.men / e.maxMen, shake = 1 - clamp(e.morale, 0, 1);
    const prox = 1 - clamp(Math.hypot(e.cx - army.units[0].cx, e.cz - army.units[0].cz) / 220, 0, 1);
    const s = loss * 2.4 + shake * 1.5 + prox * 0.7;
    if (s > bs) { bs = s; focus = e; }
  }
  if (focus !== ai.focus) {
    if (ai.focus) blog(army.side.label + ' 调整目标 — 集中火力于 ' + focus.name, army.side.css);
    ai.focus = focus;
  }
  /* 2) 分派：离焦点最近的两队集中火力；士气最高者侧翼迂回；兵力最整者留作预备队 */
  const byDist = mine.slice().sort((a, b) =>
    Math.hypot(a.cx - focus.cx, a.cz - focus.cz) - Math.hypot(b.cx - focus.cx, b.cz - focus.cz));
  ai.focusUnits = byDist.slice(0, Math.min(2, byDist.length));
  let flanker = null;
  if (mine.length > 2) {
    flanker = mine.slice().sort((a, b) => (b.morale - a.morale) || (a.maxMen - b.maxMen))[0];
    if (ai.focusUnits.includes(flanker)) flanker = null;
  }
  if (flanker !== ai.flanker) {
    ai.flanker = flanker;
    if (flanker) blog(army.side.label + ' ' + flanker.name + ' 向侧翼迂回', army.side.css);
  }
  ai.flankX = flanker ? clamp(flanker.cx + (flanker.army.key === 'union' ? 1 : -1) * 46, -86, 86) : 0;
  const rest = mine.filter(u => u !== ai.flanker && !ai.focusUnits.includes(u));
  const reserve = rest.length > 1 ? rest.slice().sort((a, b) => (b.men / b.maxMen) - (a.men / a.maxMen))[0] : null;
  /* 3) 预备队投入条件：敌方整体动摇 / 己方有人被打残 / 时间压力 */
  const foeMorale = theirs.reduce((s, e) => s + e.morale, 0) / theirs.length;
  if (!ai.committed && (foeMorale < 0.62 || mine.some(u => u.men < u.maxMen * 0.45) || B.t > 26)) {
    ai.committed = true;
    if (reserve) blog(army.side.label + ' 投入预备队 — ' + reserve.name + ' 加入战线', army.side.css);
  }
  ai.reserve = ai.committed ? null : reserve;
  /* 4) 攻守模式：己方整体士气过低 → 固守（不再前压，原地射击） */
  const myMorale = mine.reduce((s, u) => s + u.morale, 0) / mine.length;
  ai.mode = myMorale < 0.34 ? 'hold' : 'engage';
  /* 5) 逐队下令：交替"压制/跃进"形成火力与机动（用名册序号取奇偶，避免来回抖动） */
  for (const u of mine) {
    const odd = (army.units.indexOf(u) % 2) === 1;
    u.order = ai.mode === 'hold' ? 'hold'
      : ai.reserve === u ? 'reserve'
        : ai.flanker === u ? 'flank'
          : ai.focusUnits.includes(u) ? (odd ? 'focusFire' : 'focusClose')
            : (odd ? 'fire' : 'advance');
  }
}

function orderAdvance(u) {
  const foe = enemyOf(u.army);
  /* 集团 AI 指定了焦点目标且本单位不是侧翼时，全力打焦点（集中火力） */
  const focus = u.army.ai && u.army.ai.focus;
  if (focus && u.order !== 'flank' && !focus.gone && focus.men > 0 && focus.state !== 'rout') {
    u.target = focus;
    return;
  }
  let best = null, bd = 1e9;
  for (const e of foe.units) {
    if (e.kind === 'art' || e.gone || e.men <= 0 || e.state === 'rout') continue;
    const d = Math.abs(e.cx - u.cx) + Math.abs(e.cz - u.cz) * 0.3;
    if (d < bd) { bd = d; best = e; }
  }
  u.target = best;
}

function unitUpdate(u, dt) {
  if (u.kind === 'art') {
    for (const gun of u.guns) {
      const foe = enemyOf(u.army);
      /* 炮兵 AI：按价值选靶——队伍越大、越动摇越值得打，骑兵目标价值最低 */
      let best = null, bs = -1e9;
      for (const e of foe.units) {
        if (e.kind === 'art' || e.men <= 0 || e.gone || e.state === 'rout') continue;
        const d = Math.hypot(e.cx - gun.x, e.cz - gun.z);
        if (d > 340) continue;
        const score = e.men * 0.55 + (1 - clamp(e.morale, 0, 1)) * 42 - d * 0.10 + (e.kind === 'cav' ? -14 : 0);
        if (score > bs) { bs = score; best = e; }
      }
      gun.targetUnit = best;
      gun.recoil = Math.max(0, gun.recoil - dt * 1.9);
      gun.barrel.position.z = 0.1 - 0.42 * gun.recoil;
      for (const s of gun.crew) s.recoil = Math.max(0, s.recoil - dt * 3.4);
      if (gun.targetUnit && B.t > 3 && !B.over) {
        gun.reload -= dt;
        if (gun.reload <= 0) { gun.reload = 8.5 + rnd() * 2.5; fireShell(gun); }
        const ty = Math.atan2(gun.targetUnit.cx - gun.x, gun.targetUnit.cz - gun.z);
        gun.group.rotation.y = lerp(gun.group.rotation.y, ty, 1 - Math.exp(-dt * 0.8));
        for (const s of gun.crew) {
          s.yaw = gun.group.rotation.y + Math.PI;
          if (s.state === 'fire' && s.recoil <= 0) s.state = 'work';
        }
      } else {
        for (const s of gun.crew) if (s.state === 'fire' && s.recoil <= 0) s.state = 'work';
      }
    }
    return;
  }
  if (u.gone) return;
  if (u.men <= 0) { u.gone = true; u.banner.visible = false; return; }
  u.stateT += dt;
  /* 工事的通行属性：断面高差 + 鹿砦。进移动积分，否则骑兵/步兵过壕"如履平地" */
  const trav = workTraverse(u.kind, u.cx, u.cz);
  u.traverse = trav;

  if (u.state === 'rout') {
    u.spd = 5.7 * trav;
    const dir = u.army.key === 'union' ? -1 : 1;
    u.yaw = dir < 0 ? Math.PI : 0;
    u.cz += dir * u.spd * dt;
    if (Math.abs(u.cz) > 168) {
      u.gone = true;
      u.banner.visible = false;
      for (const s of u.soldiers) if (s.alive) s.state = 'gone';
    }
    return;
  }

  if (!u.target || u.target.men <= 0 || u.target.gone) orderAdvance(u);
  const tgt = u.target;
  const dist = tgt ? Math.hypot(tgt.cx - u.cx, tgt.cz - u.cz) : 9999;
  const toward = u.army.key === 'union' ? 1 : -1;

  switch (u.state) {
    case 'idle':
      u.spd = 0;
      if (B.t > 2.5) { u.state = 'advance'; orderAdvance(u); }
      break;
    case 'advance':
      /* 集团 AI：预备队未投入前只守在自己的壕沟里；固守模式不推进到中线 */
      if (u.order === 'reserve' && Math.abs(u.cz) > 54) { u.state = 'hold'; break; }
      if (u.order === 'hold' && Math.abs(u.cz) > 40) { u.state = 'hold'; break; }
      u.spd = 2.8 * trav;
      if (tgt) u.yaw = Math.atan2(tgt.cx - u.cx, tgt.cz - u.cz);
      if (u.order === 'flank' && u.army.ai) {   // 侧翼迂回：先横向靠拢，再压上
        u.cx += clamp(u.army.ai.flankX - u.cx, -1, 1) * 1.6 * trav * dt;
      }
      u.cz += toward * u.spd * dt;
      if (u.kind === 'cav') {
        if (dist < 96) u.state = 'hold';
      } else if (dist < (u.order === 'fire' ? 98 : 62) || u.cz * toward > 6) {
        u.state = 'fire'; u.volleys = 0; u.volleyT = 0.5;
        blog(u.name + ' 停止前进，列队齐射', u.army.side.css);
      }
      break;
    case 'hold':
      u.spd = 0;
      if (tgt) u.yaw = Math.atan2(tgt.cx - u.cx, tgt.cz - u.cz);
      break;
    case 'fire':
      u.spd = 0;
      if (tgt) u.yaw = Math.atan2(tgt.cx - u.cx, tgt.cz - u.cz);
      u.volleyT -= dt;
      if (u.volleyT <= 0) {
        u.volleys++;
        volley(u);
        /* 固守命令下持续射击，不自动转入冲锋 */
        if (u.volleys >= 3) { if (u.order === 'hold') u.volleyT = 1.9; else startCharge(u); }
        else u.volleyT = 1.7;
      }
      break;
    case 'charge': {
      u.spd = (u.kind === 'cav' ? 7.6 : 5.5) * trav;
      if (tgt) u.yaw = Math.atan2(tgt.cx - u.cx, tgt.cz - u.cz);
      const tx = tgt ? tgt.cx : u.cx;
      const tz = tgt ? tgt.cz : u.cz + 12 * toward;
      const dx = tx - u.cx, dz = tz - u.cz, d = Math.hypot(dx, dz);
      if (d > 0.4) { u.cx += dx / d * u.spd * dt; u.cz += dz / d * u.spd * dt; }
      if (tgt && Math.hypot(tgt.cx - u.cx, tgt.cz - u.cz) < (u.kind === 'cav' ? 17 : 12)) {
        if (u.kind === 'cav' && !u.impact) cavalryImpact(u, tgt);
        u.state = 'melee';
        u.meleeT = 0;
        if (B.meleeStarted < 0) {
          B.meleeStarted = B.t;
