<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南北战争 · 全面战争风格会战</title>
<style>
  :root{
    --union:#3f5f9c; --union2:#6f8fc9; --conf:#8d7f63; --conf2:#b8a684;
    --gold:#d9b96a; --panel:rgba(20,18,15,.72); --line:rgba(217,185,106,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f12;
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;color:#efe8da}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;user-select:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    backdrop-filter:blur(3px);box-shadow:0 4px 18px rgba(0,0,0,.45)}
  #topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:flex-start;width:min(1340px,97vw)}
  .army{flex:1;padding:8px 12px;min-width:0}
  .army .name{font-size:15px;letter-spacing:2px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .army.union .name{color:var(--union2)}
  .army.conf .name{color:var(--conf2)}
  .army .sub{font-size:11px;opacity:.72;letter-spacing:1px}
  /* 各阵营自己的兵牌情报：航空/装甲/兵种/协同，统一放进对应阵营面板 */
  .army .info{font-size:10.5px;line-height:1.5;opacity:.82;letter-spacing:.3px;margin-top:2px}
  .army .info:first-of-type{margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.09)}
  .bar{height:9px;margin:6px 0 4px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%}
  .union .bar i{background:linear-gradient(90deg,#2f4a7d,#7ea2e0)}
  .conf .bar i{background:linear-gradient(90deg,#6d6047,#c9b58c)}
  .morale{height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:4px}
  .morale i{display:block;height:100%;background:#e0c070;width:100%}
  #center{width:210px;text-align:center;padding:8px 10px}
  #phase{font-size:16px;letter-spacing:3px;color:var(--gold);font-weight:700}
  #clock{font-size:12px;opacity:.8;margin-top:3px;letter-spacing:1px}
  #log{position:absolute;left:14px;bottom:96px;width:340px;max-height:238px;overflow:hidden;
    display:flex;flex-direction:column;gap:5px}
  #log div{font-size:12px;padding:5px 9px;line-height:1.45;border-left:3px solid transparent}
  #help{position:absolute;right:14px;bottom:96px;padding:9px 12px;font-size:12px;line-height:1.75;text-align:right}
  #help b{color:var(--gold)}
  #views{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
  #views button{font-family:inherit;font-size:12px;letter-spacing:1px;color:#efe8da;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 11px;
    transform-origin:50% 100%;will-change:transform}
  #views button:hover{border-color:var(--gold);color:var(--gold)}
  #views button.on{background:rgba(217,185,106,.22);color:var(--gold);border-color:var(--gold)}
  #paused{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);padding:12px 30px;
    font-size:15px;letter-spacing:7px;color:var(--gold);opacity:0;display:none}
  #impact{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 56%,rgba(255,206,140,.34),rgba(255,124,44,.12) 44%,rgba(0,0,0,0) 74%)}
  #result{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;
    padding:26px 46px;display:none}
  #result h1{margin:0;font-size:34px;letter-spacing:10px;color:var(--gold);font-weight:700}
  #result p{margin:12px 0 0;font-size:13px;letter-spacing:2px;opacity:.85;line-height:1.8}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0d0f12;z-index:9;
    font-size:14px;letter-spacing:4px;color:#b9a06a}
  #debug{position:absolute;left:10px;top:10px;font-size:11px;font-family:Consolas,monospace;
    max-width:46vw;white-space:pre-wrap;display:none;padding:8px;z-index:20;color:#ffb0a0}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div id="impact"></div>
  <div id="topbar">
    <div class="panel army union">
      <div class="name"><span>联邦军 · UNION</span><span id="u-units">—</span></div>
      <div class="bar"><i id="u-bar"></i></div>
      <div class="sub">兵力 <span id="u-men">—</span> · 士气 <span id="u-mor">—</span></div>
      <div class="morale"><i id="u-mbar"></i></div>
      <div class="info" id="u-air">航空兵 —</div>
      <div class="info" id="u-force">装甲 —</div>
      <div class="info" id="u-types">兵种 —</div>
      <div class="info" id="u-syn">协同 —</div>
    </div>
    <div class="panel" id="center">
      <div id="phase">部署中</div>
      <div id="clock">0.0 s</div>
      <div class="sub" id="speed">速度 ×1</div>
    </div>
    <div class="panel army conf">
      <div class="name"><span id="c-units">—</span><span>邦联军 · CONFEDERACY</span></div>
      <div class="bar"><i id="c-bar"></i></div>
      <div class="sub">兵力 <span id="c-men">—</span> · 士气 <span id="c-mor">—</span></div>
      <div class="morale"><i id="c-mbar"></i></div>
      <div class="info" id="c-air">航空兵 —</div>
      <div class="info" id="c-force">装甲 —</div>
      <div class="info" id="c-types">兵种 —</div>
      <div class="info" id="c-syn">协同 —</div>
    </div>
  </div>
  <div id="log"></div>
  <div class="panel" id="help">
    <div><b>1-9</b> 切换机位 &nbsp; <b>空格</b> 暂停</div>
    <div><b>[ ]</b> 战斗速度 &nbsp; <b>R</b> 重开</div>
    <div><b>鼠标</b> 拖拽旋转 / 滚轮缩放</div>
  </div>
  <div id="views"></div>
  <div class="panel" id="paused">已暂停 · 空格继续</div>
  <div class="panel" id="result"><h1></h1><p></p></div>
  <div class="panel" id="debug"></div>
</div>
<div id="loading">正在展开战场…</div>

<script>
(function(){
  var base = 'https://cdn.jsdelivr.net/npm/three@0.185.0/';
  /* Anime.js v4.5 起提供官方 three.js adapter（材质/灯光/雾/Color 可直接当动画目标） */
  var animeBase = 'https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/modules/';
  var forceWebGL = /[?&]webgl=1/.test(location.search);
  window.__BOOT_ERR = null;
  function start(mode){
    window.__RENDERER_MODE = mode;
    var imports = {};
    imports['three'] = base + (mode === 'webgpu' ? 'build/three.webgpu.min.js' : 'build/three.module.js');
    imports['three/addons/'] = base + 'examples/jsm/';
    imports['animejs'] = animeBase + 'index.js';
    imports['animejs/adapters/three'] = animeBase + 'adapters/three/index.js';
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(im);
    var app = document.createElement('script');
    app.type = 'module';
    app.textContent = document.getElementById('app-src').textContent;
    document.body.appendChild(app);
  }
  function boot(){
    if (navigator.gpu && !forceWebGL) {
      /* 优先独显：powerPreference 只是"偏好"提示，最终由浏览器/系统显卡设置决定；
         可用 window.__GPU_ADAPTER 查看实际选中的适配器（vendor/architecture/description）。 */
      navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }).then(function(a){
        if (a) {
          try {
            window.__GPU_ADAPTER = a.info
              ? { vendor: a.info.vendor, architecture: a.info.architecture, device: a.info.device, description: a.info.description }
              : null;
          } catch (e) { window.__GPU_ADAPTER = null; }
        }
        start(a ? 'webgpu' : 'webgl');
      }).catch(function(){ start('webgl'); });
    } else {
      start('webgl');
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script type="text/plain" id="app-src">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const LOADING = document.getElementById('loading');
function fatal(e) {
  window.__BOOT_ERR = String(e && e.stack || e);
  const d = document.getElementById('debug');
  if (d) { d.style.display = 'block'; d.textContent = window.__BOOT_ERR; }
  if (LOADING) LOADING.remove();
}
window.addEventListener('error', ev => fatal(ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => fatal(ev.reason));

const TAU = Math.PI * 2;
/* 战场尺度：布局距离（战线纵深、正面展开、机场/炮兵/障碍散布）统一乘 S。
   注意：只放大"空间"，不放大人与物件的尺寸与战术距离（射程、杀伤半径、弹坑）——
   否则等于把整个世界等比例放大，看起来毫无变化。 */
const S = 4;
/* ---------- 纵深布阵（绝对米；X 正面不变，只拉开两军距离） ----------
   两军间距 = 2 × FRONT × S。初始 FRONT=46（间距 368），上一轮 60（480），
   本轮"拉大距离到现在的二倍"→ 120（间距 960 m）。各梯队只随战线一起后移 ΔZ，
   "相对战线的纵深"保持不变（散兵前 44 m、炮兵后 208 m、机场后 500 m……），
   所以河道/树林/机场这些世界尺度不用重做，只有主战场的纵深翻倍。
   地形压平半径、障碍散布、机位、雾的起点等等都要跟着这个位移走，否则战场会
   骑到坡上、机位落在内容之内、远处被雾洗掉（见 AGENTS.md §Rescale）。 */
const DZ = 2;                      // 纵深放大倍率（相对上一版 FRONT=60）
const FRONT = 60 * DZ;             // 战线距中线的 S 倍（60 → 120）
const ZSH = 60 * (DZ - 1) * S;     // 各梯队随战线共同后移量 = 240 m
const Z_SKIRM = 196 + ZSH, Z_MG = 271 + ZSH, Z_ENG = 312 + ZSH;
const Z_CAV = 288 + ZSH, Z_TANK_H = 288 + ZSH, Z_TANK_L = 324 + ZSH;
const Z_ART = 448 + ZSH, Z_AA = 508 + ZSH, Z_TRUCK = 631 + ZSH;
const Z_AIR = 740 + ZSH, Z_FORT = 330 + ZSH, Z_FLAT = 94 * S + ZSH;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
/* 统一重力加速度：炮弹/航弹/曳光弹/坦克炮弹全部按它下坠，发射诸元也按它做抬高修正 */
const GRAV = 9.8;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(0x51A7B3);
const vrnd = mulberry32(0x9D3C71);
const QUERY = location.search || '';
const NOHUD = /[?&]nohud=1/.test(QUERY);
const SPEEDS = [0.5, 1, 2, 4];

const HUD = {
  phase: document.getElementById('phase'), clock: document.getElementById('clock'),
  speed: document.getElementById('speed'), log: document.getElementById('log'),
  result: document.getElementById('result'), views: document.getElementById('views'),
  u: {
    units: document.getElementById('u-units'), bar: document.getElementById('u-bar'),
    men: document.getElementById('u-men'), mor: document.getElementById('u-mor'), mbar: document.getElementById('u-mbar'),
    air: document.getElementById('u-air'), force: document.getElementById('u-force'),
    types: document.getElementById('u-types'), syn: document.getElementById('u-syn')
  },
  c: {
    units: document.getElementById('c-units'), bar: document.getElementById('c-bar'),
    men: document.getElementById('c-men'), mor: document.getElementById('c-mor'), mbar: document.getElementById('c-mbar'),
    air: document.getElementById('c-air'), force: document.getElementById('c-force'),
    types: document.getElementById('c-types'), syn: document.getElementById('c-syn')
  }
};
if (NOHUD) document.getElementById('hud').style.display = 'none';

const MODE = window.__RENDERER_MODE || 'webgl';
  const renderer = MODE === 'webgpu'
    ? new THREE.WebGPURenderer({ antialias: true, powerPreference: 'high-performance' })
    : new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
if (MODE === 'webgpu' && renderer.init) await renderer.init();
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
if (renderer.shadowMap) {
  renderer.shadowMap.enabled = true;
  try { renderer.shadowMap.type = THREE.PCFShadowMap; } catch (e) { }
}
renderer.domElement.style.touchAction = 'none';
document.getElementById('stage').appendChild(renderer.domElement);
if (LOADING) LOADING.remove();
/* 各向异性：地面/道路/跑道全是掠射角平面，anisotropy=1 时远处纹理被 mip 抹平成
   "一片草色"，特征直接消失。取硬件上限（WebGPU 后端没有 capabilities.getMaxAnisotropy，兜底 4）。 */
const MAXANISO = (() => {
  try {
    const c = renderer.capabilities;
    return c && typeof c.getMaxAnisotropy === 'function' ? Math.min(16, c.getMaxAnisotropy()) : 4;
  } catch (e) { return 4; }
})();

const scene = new THREE.Scene();
const FOG_COLOR = 0xcdbfa2;
/* 雾的近端要落在战场与机场之外：近端 140 m 会把机场(150~260 m)与远处障碍洗成天空色 */
/* fogNear 必须在战区之外：机场现在在 |z|=Z_AIR=980、林带到 ±1260，旧值 260*S=1040
   会把机场/远处障碍整体洗成天色（"看不见机场"的第二个原因）。本轮纵深翻倍后
   play area 已到 ~1030，故近端推到 340*S=1360，远端 1500*S=6000，远景才不会被雾吃掉。 */
scene.fog = new THREE.Fog(FOG_COLOR, 340 * S, 1500 * S);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 2400 * S);
camera.position.set(0, 86 * S, 205 * S);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 12;
controls.maxDistance = 900 * S;
controls.maxPolarAngle = Math.PI / 2.06;
controls.target.set(0, 5, 0);

const SUN_DIR = new THREE.Vector3(0.52, 0.72, 0.34).normalize();
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.copy(SUN_DIR).multiplyScalar(240 * S);
sun.castShadow = true;
/* 阴影范围随战场放大：2048 贴图在 ±680 m 上是 0.66 m/texel（糊成一片），故提到 4096 */
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -170 * S; sun.shadow.camera.right = 170 * S;
sun.shadow.camera.top = 170 * S; sun.shadow.camera.bottom = -170 * S;
sun.shadow.camera.near = 60 * S; sun.shadow.camera.far = 560 * S;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.07;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x7d7448, 1.15));
scene.add(new THREE.AmbientLight(0xfff2dd, 0.34));

/* ---------- 后处理：EffectComposer + Bloom + 调色/暗角 ---------- */
const FXQ = new URLSearchParams(location.search);
/* 验收用"视觉旋钮"：只改表现、不得改战局（用于证明 rnd/vrnd 已分流）。
   ?mgt=5 机枪每连发曳光数（改动只应挪动 vrnd）；?cap=0.3 缩放烟池容量（制造 emit 饥饿）。 */
const VIS = {
  mgTracers: clamp(parseInt(FXQ.get('mgt') || '3', 10) || 3, 1, 10),
  poolScale: clamp(parseFloat(FXQ.get('cap') || '1') || 1, 0.05, 1)
};
/* 霰弹（空爆弹）：引信在「距瞄准点 fuse 米处」起爆，凌空洒出弹丸。
   空爆距离可设定：?shrap=26（米），或运行时 __battle.shrapnel(40)。 */
let SHRAPNEL_FUSE = clamp(parseFloat(FXQ.get('shrap') || '26') || 26, 5, 120);
/* 霰弹 = 反人员弹：一次空爆杀伤人数/命中率都高，但**不伤装甲**（见 §弹药平衡）。
   榴弹（HE）反过来：对步兵弱、对坦克/工事强。 */
const SHRAPNEL_R = 18;        // 空爆杀伤半径（凌空覆盖，掩体可减伤）
const SHRAPNEL_CAP = 10;      // 一次空爆最多杀伤人数（AP，比 HE 的 cap 高）
const SHRAPNEL_CHANCE = 0.72; // 空爆命中概率（掩体可减伤）
const SHELL_FIRED = { he: 0, shrap: 0, wmd: 0 };
/* 大规模杀伤兵器（WMD，"攻城重炮"）：只有堡垒要塞炮与英雄重战车能发射。
   刻意做成"伤害小、杀伤范围大、地形改变大"：单兵命中率与总伤亡上限都很低，
   但半径极大，且落地能挖出一整片"弹坑场"（中心坑 + 环形卫星坑）。
   验收面见 __battle.ballistics().wmd。 */
const WMD_POWER = 4.6;          // 地形改变：中心坑口径/坑深（clamp 到 [-3.0, +1.2]）
const WMD_R = 86;               // 杀伤半径（大）
const WMD_CAP = 16;             // 单发总伤亡上限（低 = 伤害小）
const WMD_CHANCE = 0.12;        // 单兵命中率（低）
const WMD_SUPPRESS_R = 60;      // 大范围压制半径
const WMD_SATELLITES = 8;       // 环形卫星弹坑数（弹坑场的确定性偏移）
const WMD_FORT_EVERY = 5;       // 堡垒要塞炮每 5 发里 1 发 WMD
const WMD_TANK_EVERY = 4;       // 英雄重战车每 4 发里 1 发 WMD
const FX = {
  enabled: false,
  wanted: MODE === 'webgl' && FXQ.get('fx') !== '0',
  bloomStrength: +(FXQ.get('bloom') || 0.28),
  grain: FXQ.get('grain') === '0' ? 0 : 0.01
};
let composer = null, bloomPass = null, gradePass = null, fxTime = 0;

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: 0.42 },
    uGrain: { value: 0.01 },
    uWarm: { value: 0.5 }
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform float uTime;',
    'uniform float uVignette;',
    'uniform float uGrain;',
    'uniform float uWarm;',
    'varying vec2 vUv;',
    'float fxHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'void main(){',
    '  vec4 c = texture2D(tDiffuse, vUv);',
    '  c.rgb = mix(c.rgb, c.rgb * vec3(1.045, 1.005, 0.945), uWarm);',
    '  float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));',
    '  c.rgb = mix(vec3(l), c.rgb, 1.02);',
    '  c.rgb = max((c.rgb - 0.5) * 1.03 + 0.5, vec3(0.0));',
    '  vec2 d = vUv - 0.5;',
    '  c.rgb *= clamp(1.0 - uVignette * dot(d, d) * 2.6, 0.0, 1.0);',
    '  float g = fxHash(vUv * vec2(1024.0, 768.0) + fract(uTime) * 91.7) - 0.5;',
    '  c.rgb += g * uGrain;',
    '  gl_FragColor = c;',
    '}'
  ].join('\n')
};

if (FX.wanted) {
  try {
    const mods = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),
      import('three/addons/postprocessing/OutputPass.js')
    ]);

/* 堡垒基座压平：交战区加入起伏后，44×38 的基座必须坐落在水平台面上（与机场同一套做法） */
const FORT_PAD_Y = {};
for (const k in FORT_SITE) FORT_PAD_Y[k] = terrainBase(FORT_SITE[k].x, FORT_SITE[k].z);
function onAirfield(x, z) {
  for (const k in AIRFIELD) {
    const A = AIRFIELD[k], l = afLocal(A, x, z);
    if (Math.abs(l[0]) < PAD_X + 12 && Math.abs(l[1]) < PAD_Z + 12) return true;
  }
  return false;
}
function terrainH(x, z) {
  let y = terrainBase(x, z);
  for (const k in AIRFIELD) {
    const A = AIRFIELD[k], l = afLocal(A, x, z);
    const fx = clamp(1 - (Math.abs(l[0]) - PAD_X) / PAD_FADE, 0, 1);
    const fz = clamp(1 - (Math.abs(l[1]) - PAD_Z) / PAD_FADE, 0, 1);
    const w = fx * fz;
    if (w > 0) y = lerp(y, PAD_Y[k], w);
  }
  /* 堡垒台面：只在基座附近查询，绝大多数调用两次 abs 就早退（逐士兵每步都走这里） */
  for (const k in FORT_SITE) {
    const F = FORT_SITE[k];
    const dx = Math.abs(x - F.x), dz = Math.abs(z - F.z);
    if (dx > 34 || dz > 30) continue;
    const w = clamp(1 - Math.max(dx - 22, dz - 18) / 10, 0, 1);
    if (w > 0) y = lerp(y, FORT_PAD_Y[k], w);
  }
  return y;
}

/* 顶点属性局部上传区间（元素单位，itemSize=3）：只重传被改动的顶点，不整块上传 */
function markRange(attr, v0, v1) {
  if (attr.addUpdateRange) attr.addUpdateRange(v0 * 3, (v1 - v0 + 1) * 3);
}
/* 只把受弹坑影响的一小片顶点抬/降，并局部重算法线（147k 顶点全量 computeVertexNormals 太贵）。
   法线用四邻的"基础高度 + 弹坑高差"做中心差分，避免全网格重算。 */
function deformGround(cx, cz, R) {
  const ext = R * 1.5 + GSTEP;
  const ix0 = Math.max(0, Math.floor((cx - ext + GHALF) / GSTEP));
  const ix1 = Math.min(GSEG, Math.ceil((cx + ext + GHALF) / GSTEP));
  const iy0 = Math.max(0, Math.floor((cz - ext + GHALF) / GSTEP));
  const iy1 = Math.min(GSEG, Math.ceil((cz + ext + GHALF) / GSTEP));
  if (ix1 < ix0 || iy1 < iy0) return;
  const pos = groundGeo.attributes.position, nor = groundGeo.attributes.normal;
  for (let iy = iy0; iy <= iy1; iy++) {
    const z = -GHALF + iy * GSTEP, row = iy * GN;
    for (let ix = ix0; ix <= ix1; ix++) {
      const i = row + ix;
      pos.setY(i, gBaseY[i] + craterAt(-GHALF + ix * GSTEP, z));
    }
  }
  /* 只上传被改动的顶点区间：three r185 会把同一帧内多个 updateRange 合并后上传、
     上传完自动 clearUpdateRanges，所以多次爆炸累积区间也不会漏传（见 WebGLAttributes.js）。
     不这么做的话每次爆炸都会整块重传 ~147k 顶点（position+normal ≈3.5 MB）。
     区间取"首行首列 → 末行末列"的连续超集即可（多传几行未动顶点无妨）。 */
  markRange(pos, iy0 * GN + ix0, iy1 * GN + ix1);
  pos.needsUpdate = true;
  const ny0 = Math.max(0, iy0 - 1), ny1 = Math.min(GSEG, iy1 + 1);
  const nx0 = Math.max(0, ix0 - 1), nx1 = Math.min(GSEG, ix1 + 1);
  for (let iy = ny0; iy <= ny1; iy++) {
    const iyD = Math.max(0, iy - 1), iyU = Math.min(GSEG, iy + 1);
    const z = -GHALF + iy * GSTEP, zd = -GHALF + iyD * GSTEP, zu = -GHALF + iyU * GSTEP;
    for (let ix = nx0; ix <= nx1; ix++) {
      const ixL = Math.max(0, ix - 1), ixR = Math.min(GSEG, ix + 1);
      const x = -GHALF + ix * GSTEP;
      const hl = gBaseY[iy * GN + ixL] + craterAt(-GHALF + ixL * GSTEP, z);
      const hr = gBaseY[iy * GN + ixR] + craterAt(-GHALF + ixR * GSTEP, z);
      const hd = gBaseY[iyD * GN + ix] + craterAt(x, zd);
      const hu = gBaseY[iyU * GN + ix] + craterAt(x, zu);
      const dz = zu - zd, dx = -GHALF + ixR * GSTEP - (-GHALF + ixL * GSTEP);
      let nx = -dz * (hr - hl), ny = dz * dx, nz = -(hu - hd) * dx;
      const l = Math.hypot(nx, ny, nz) || 1;
      nor.setXYZ(iy * GN + ix, nx / l, ny / l, nz / l);
    }
  }
  markRange(nor, ny0 * GN + nx0, ny1 * GN + nx1);
  nor.needsUpdate = true;
}
/* 一次爆炸→一个弹坑：机场跑道保持压平（飞机滑跑用常量 PAD_Y，挖了会与起落架对不上） */
function addTerrainCrater(x, z, power) {
  if (onAirfield(x, z)) return;

/* 林带用独立的场景随机流（trnd）：树的位置/旋转/配色都不该动到玩法 rnd——
   否则"挪一棵树"就会改掉整场会战的走向（AGENTS.md §效果层：分离 PRNG）。 */
const trnd = mulberry32(0x7A11C0DE);

  const a = trnd() * TAU, rad = (158 + trnd() * 185) * S;
  const x = Math.cos(a) * rad, z = Math.sin(a) * rad * 0.92;
  /* 林带从炮兵线之后起：要盖过炮兵线(Z_ART=688)、高炮(Z_AA=748)，否则机位一看炮兵
     全是树、炮口被树冠糊住（纵深翻倍后旧清空半径 94*S=376 已不够）。 */

  if (onAirfield(x, z)) continue;                 // 机场净空：跑道与停机坪上不长树
  if (riverCore(x, z) > 0.02) continue;           // 河道与岸坡上不长树（否则树会插进水里）
  treeSpots.push([x, z, 0.75 + trnd() * 0.75]);

/* 同样用函数声明：河道桥在文件前部就调用它们（声明提升） */
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }
function cyl(rt, rb, h, s) { return new THREE.CylinderGeometry(rt, rb, h, s); }
function at(g, x, y, z) { g.translate(x, y, z); return g; }
/* 静态批处理：把一批"永不动、同材质"的实例烘焙成一个合并网格（1 个 draw call）。
   相对 InstancedMesh 的好处：没有逐实例矩阵更新，包围球按真实顶点算（视锥剔除依然有效），
   也不会踩到"动态 InstancedMesh 包围球不刷新"的坑；代价是不能再逐实例改属性，
   所以只适合道具/工事构件这类静态物。 */
function bakedMesh(mat, list) {
  const parts = [];
  for (const it of list) {
    /* mergeGeometries 要求所有几何的 index 状态一致：IcosahedronGeometry 是非索引的，
       与 Box/Cylinder 混在一起会直接失败 → 统一转成非索引再合并 */
    const g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    g.applyMatrix4(it.m4);
    const c = new THREE.Color(it.col), n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    parts.push(g);
  }
  const mesh = new THREE.Mesh(mergeGeometries(parts), mat);
  mesh.matrixAutoUpdate = false;      // 静态对象：跳过每帧矩阵重建
  mesh.updateMatrix();
  scene.add(mesh);
  return mesh;
}

const _pose = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 };
function poseOf(anim, s) {
  if (anim === 'none') return null;
  const st = s.state, ph = s.phase, ride = s.mounted;
  const k = clamp(s.spd / 6.5, 0, 1);
  let w;
  if (st === 'walk') w = s.animT * (5.2 + s.spd * 1.2) + ph;
  else if (st === 'charge') w = s.animT * 13.0 + ph;
  else if (st === 'melee') w = s.animT * 9.5 + ph;
  else if (st === 'work') w = s.animT * 6.0 + ph;
  else w = s.animT * 2.4 + ph;
  const p = _pose, rec = s.recoil, swing = Math.sin(w);
  p.px = p.py = p.pz = p.rx = p.ry = p.rz = 0;
  const walk = st === 'walk', charge = st === 'charge', melee = st === 'melee';
  const fire = st === 'fire', work = st === 'work', down = st === 'down' || st === 'dead' || st === 'gone';
  switch (anim) {
    case 'torso':
      if (down) p.rx = 0;
      else if (charge) { p.rx = 0.3; p.py = Math.abs(swing) * 0.045; }
      else if (melee) { const th = Math.max(0, Math.sin(w)); p.rx = 0.13 + 0.14 * th; p.py = 0.02 * th; }
      else if (fire) p.rx = 0.03 - 0.07 * rec;
      else if (work) p.rx = 0.24 + 0.1 * Math.sin(w * 1.3);
      else if (walk) { p.rx = 0.08; p.py = Math.abs(swing) * 0.028; }
      else { p.rx = 0.02; p.ry = Math.sin(s.animT * 0.8 + ph) * 0.045; }
      break;
    case 'head':
      if (down) p.rx = 0.25;
      else if (charge) p.rx = -0.14;
      else if (melee) p.rx = 0.04;
      else if (fire) p.rx = -0.05;
      else if (work) p.rx = 0.1;
      else { p.rx = -0.03; p.ry = Math.sin(w * 0.5 + ph) * 0.08; }
      break;
    case 'armL':
      if (down) { p.rx = 0.3; p.rz = 0.2; }
      else if (charge) p.rx = -0.72 - 0.3 * swing;
      else if (melee) p.rx = -0.45 - 0.3 * Math.abs(swing);
      else if (fire) p.rx = -1.34;
      else if (work) p.rx = -0.55 + 0.55 * Math.sin(w * 1.6);
      else if (walk) p.rx = -swing * 0.45;
      else p.rx = 0.04;
      break;
    case 'armR':
      if (down) { p.rx = -0.2; p.rz = -0.2; }
      else if (charge) p.rx = -0.6 - 0.28 * swing;
      else if (melee) p.rx = -0.7 - 1.05 * Math.max(0, Math.sin(w));
      else if (fire) p.rx = -1.24 + 0.22 * rec;
      else if (work) p.rx = -0.5 + 0.5 * Math.sin(w * 1.6 + 0.6);
      else if (walk) p.rx = swing * 0.3;
      else p.rx = 0.04;
      break;
    case 'legL':
    case 'legR': {
      const sgn = anim === 'legL' ? 1 : -1;
      if (ride) { p.rx = anim === 'legL' ? -1.28 : -1.1; p.rz = 0.16; }
      else if (down) { p.rx = sgn > 0 ? 0.4 : -0.25; p.rz = sgn * 0.12; }
      else if (charge) p.rx = sgn * swing * 0.92;
      else if (melee) { p.rx = sgn * 0.26 + 0.14 * swing; p.rz = sgn * 0.16; }
      else if (fire) { p.rx = sgn * 0.16; p.rz = sgn * 0.2; }
      else if (walk) p.rx = sgn * swing * 0.52;
      else p.rx = sgn * 0.04;
      break;
    }
    case 'musket':
      if (ride) { p.rx = -1.3; p.rz = 0.5; p.pz = -0.18; p.py = -0.06; }
      else if (down) { p.rx = -0.5; p.pz = -0.2; p.py = -0.3; p.rz = 0.5; }
      else if (charge) { p.rx = -0.24 + 0.06 * swing; p.pz = 0.3; p.py = 0.08; p.rz = -0.08; }
      else if (melee) { const th = Math.max(0, Math.sin(w)); p.rx = -0.28; p.pz = 0.16 + 0.44 * th; p.py = 0.02; p.px = 0.02; p.rz = -0.1; }
      else if (fire) { p.rx = 0.06 * rec; p.pz = 0.34 - 0.16 * rec; p.py = 0.24; p.px = -0.02; }
      else if (walk) { p.rx = -1.14; p.rz = 0.24; p.py = 0.05; }
      else { p.rx = -1.1; p.rz = 0.24; p.py = 0.04; }
      break;
    case 'saber':
      if (down) { p.rx = -0.3; p.rz = 0.6; }
      else if (charge) { p.rx = -1.6 + 0.22 * swing; p.rz = 0.34; }
      else if (melee) { p.rx = -0.35 - 0.95 * Math.max(0, Math.sin(w)); p.rz = 0.18; }
      else { p.rx = -1.4; p.rz = 0.3; }
      break;
    case 'hBody':
      if (s.spd > 0.2) { p.py = Math.abs(Math.sin(w)) * 0.05 * k; p.rx = -0.03 * k; }
      break;
    case 'hNeck':
      if (s.spd > 0.2) p.rx = -0.08 + 0.13 * Math.sin(w + 1) * k;
      break;
    case 'hLegA':
      p.rx = s.spd > 0.2 ? Math.sin(w) * 0.6 * k : 0.02;
      break;
    case 'hLegB':
      p.rx = s.spd > 0.2 ? -Math.sin(w) * 0.6 * k : -0.02;
      break;
  }
  return p;
}
class TroopPool {
  constructor(parts, count, mats) {
    this.parts = [];
    this.count = count;
    this.hidden = new THREE.Matrix4().makeScale(0, 0, 0);
    for (const def of parts) {
      const mesh = new THREE.InstancedMesh(def.geo, mats[def.mat], count);
      mesh.castShadow = true;
      mesh.frustumCulled = false;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(mesh);
      const local = new THREE.Object3D();
      local.position.set(def.pos[0], def.pos[1], def.pos[2]);
      local.rotation.set(0, 0, 0);
      local.scale.set(1, 1, 1);
      local.updateMatrix();
      for (let i = 0; i < count; i++) mesh.setMatrixAt(i, this.hidden);
      mesh.instanceMatrix.needsUpdate = true;
      this.parts.push({ def, mesh, base: local.matrix.clone(), local });
    }
  }
  flush() { for (const P of this.parts) P.mesh.instanceMatrix.needsUpdate = true; }
}

const _dummy = new THREE.Object3D();
const _root = new THREE.Matrix4();
const _part = new THREE.Matrix4();
function writeSoldier(pool, idx, s) {
  _dummy.position.set(s.x, s.y, s.z);
  _dummy.rotation.order = 'YXZ';
  _dummy.rotation.set(s.tilt, s.yaw, s.roll);
  _dummy.scale.set(1, 1, 1);
  _dummy.updateMatrix();
  _root.copy(_dummy.matrix);
  for (const P of pool.parts) {
    const pose = poseOf(P.def.anim, s);
    if (pose) {
      P.local.position.set(P.def.pos[0] + pose.px, P.def.pos[1] + pose.py, P.def.pos[2] + pose.pz);
      P.local.rotation.set(pose.rx, pose.ry, pose.rz);
      P.local.updateMatrix();
      _part.multiplyMatrices(_root, P.local.matrix);
    } else {
      _part.multiplyMatrices(_root, P.base);
    }
    P.mesh.setMatrixAt(idx, _part);
  }
}
function hideSoldier(pool, idx) {
  for (const P of pool.parts) P.mesh.setMatrixAt(idx, pool.hidden);
}

class Unit {
  constructor(army, cfg) {
    this.army = army;
    this.kind = cfg.kind;
    this.name = cfg.name;
    this.title = cfg.title || cfg.name;
    this.cx = cfg.x; this.cz = cfg.z;
    this.yaw = cfg.yaw;
    this.resolve = cfg.resolve !== undefined ? cfg.resolve : (rnd() - 0.5) * 0.08;
    this.files = cfg.files; this.ranks = cfg.ranks;
    this.sx = cfg.sx || 1.55; this.sz = cfg.sz || 1.75;
    this.soldiers = cfg.soldiers;
    this.slots = [];
    this.slotSoldier = [];
    this.soldierSlot = new Array(this.soldiers.length);
    this.state = 'idle';
    this.stateT = 0;
    this.spd = 0;
    this.target = null;
    this.men = this.soldiers.length;
    this.maxMen = this.men;
    /* 累计阵亡（只增不减）：溃退判定看"打掉了多少人"，而不是"现在还剩多少人"——
       否则缓慢增援把 men 补回去，永远撞不到 22% 的溃退线，会战被拖成僵局。 */
    this.casualties = 0;
    this.morale = 1;
    this.shock = 0;
    this.volleys = 0;
    this.volleyT = 0;
    /* 弹药经济：单兵弹药按"轮/发"计（步兵 20 轮）。打光就必须上刺刀或等补给车——
       这就是"以弹药量决定是否冲锋"的接口，也是"阻止步兵无脑推进"的闸门。 */
    this.ammoMax = cfg.kind === 'mg' ? 200 : cfg.kind === 'art' ? 999 : 20;
    this.ammo = this.ammoMax;
    this.ammoOut = false;
    this.impact = false;
    this.meleeT = 0;
    this.gone = false;
    this.guns = null;
    /* —— 兵种/配合/技能状态（全部由 simulate 步进，不用墙钟）—— */
    this.suppress = 0;        // 被压制度 0..1：减速、减射、掉士气
    this.spottedBy = null;    // 被哪一方的散兵标定 → 己方炮兵打它更准
    this.assault = false;     // 正在突击一个被压制的目标 → 近战/冲击加成
    this.tankSup = false;     // 友军坦克在侧 → 推进加速、士气微升
    this.engBreach = false;   // 随行工兵已开路 → 工事通行代价降低
    this.wedge = 0;           // 骑兵楔形冲锋的额外冲击
    this.falling = false;     // 散兵"且战且退"标记（不影响状态机，只改步幅/动画）
    this.abilityCd = 0;       // 技能冷却
    this.mgT = 0;             // 机枪点射间隔
    this.mgYaw = 0;           // 机枪相对单位的回旋角
    this.rig = null; this.rigIdx = -1;
    let k = 0;
    for (let r = 0; r < cfg.ranks; r++) {
      for (let f = 0; f < cfg.files; f++) {
        this.slots.push([(f - (cfg.files - 1) / 2) * this.sx, (r - (cfg.ranks - 1) / 2) * this.sz]);
        this.slotSoldier.push(k);
        this.soldierSlot[k] = this.slots.length - 1;
        const s = this.soldiers[k];
        if (s) { s.unit = this; s.si = k; }
        k++;
      }
    }

/* 程序化烟气贴图：域扭曲 fBm 湍流 + 柔和边缘(不触及 quad 边) + 顶亮底暗的自遮蔽亮度 */
function puffTex(size, seed, rgb, maxAlpha, lit) {
  const r = mulberry32(seed);
  const G = 24, g = new Float32Array(G * G);
  for (let i = 0; i < g.length; i++) g[i] = r();
  const fade = t => t * t * (3 - 2 * t);
  const at = (x, y) => g[(y % G) * G + (x % G)];
  function noise(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = fade(x - x0), fy = fade(y - y0);
    return lerp(lerp(at(x0, y0), at(x0 + 1, y0), fx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), fx), fy);
  }
  const fbm = (x, y) => noise(x, y) * 0.5 + noise(x * 2.3 + 11.3, y * 2.3 + 5.1) * 0.3 + noise(x * 5.1 + 3.7, y * 5.1 + 9.4) * 0.2;
  return canvasTexture(size, size, (ctx, w, h) => {
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const u = x / w, v = y / h;
        const wx = fbm(u * G * 0.6 + 21.7, v * G * 0.6 + 4.3) - 0.5;
        const wy = fbm(u * G * 0.6 + 7.1, v * G * 0.6 + 31.9) - 0.5;
        const n = clamp(fbm(u * G + wx * 7.0, v * G + wy * 7.0) * 1.18, 0, 1);
        const dist = Math.hypot(u - 0.5, v - 0.5) * 2;
        const core = clamp((1.06 - dist * (0.6 + 0.7 * n)) / 0.55, 0, 1);
        const guard = clamp((1.0 - dist) / 0.16, 0, 1);
        const a = clamp(Math.pow(core, 1.05) * (0.5 + 0.8 * n) - 0.2, 0, 1) * guard * maxAlpha;
        const shade = (0.64 + 0.55 * lit) + (0.36 + 0.35 * lit) * (1 - v) + (n - 0.5) * 0.26;
        const i = (y * w + x) * 4;
        d[i] = clamp(rgb[0] * shade, 0, 255);
        d[i + 1] = clamp(rgb[1] * shade, 0, 255);
        d[i + 2] = clamp(rgb[2] * shade, 0, 255);
        d[i + 3] = clamp(a + (r() - 0.5) / 255, 0, 1) * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  });
}

     但口径更大、飞行更慢、落地后走 wmdImpact（低伤害 + 大范围 + 大范围地形改变）。 */
  const wmd = !!gun.wmd && !shrap;
  if (wmd) SHELL_FIRED.wmd++;
  else if (shrap) SHELL_FIRED.shrap++;
  else SHELL_FIRED.he++;
  sh.active = true; sh.dist = wmd ? 2.4 : 0.62; sh.trailStep = wmd ? 3.2 : 1.3;
  sh.mode = wmd ? 'wmd' : (shrap ? 'shrapnel' : 'art');
  sh.power = wmd ? WMD_POWER : 1;
  sh.label = wmd ? (gun.wmdLabel || '大规模杀伤弹') : null;
  sh.tx = tx; sh.tz = tz;                       // 空爆引信以"瞄准点"为基准
  if (shrap) sh.fuse = SHRAPNEL_FUSE;
  sh.mesh.visible = true; sh.side = gun.army.key;
  sh.mesh.scale.setScalar(wmd ? 2.6 : 1);
  sh.acc = acc; sh.ox = sx; sh.oz = sz; sh.blind = blind;
  sh.mesh.position.set(sh.x, sh.y, sh.z);
  gun.recoil = 1;
  for (const s of gun.crew) { s.state = 'fire'; s.recoil = 1; }
  flashPool.emit(sh.x + ux * 1.3, sh.y + 0.22, sh.z + uz * 1.3, wmd ? 6.0 : 3.0, wmd ? 1.0 : 0.5, 0.08, 1, 0, 0, ux * 2.4, uz * 2.4);
  for (let i = 0; i < (wmd ? 12 : 7); i++) {
    smokePool.emit(
      sh.x + ux * (1.2 + i * 1.7) + (vrnd() - 0.5) * 3.2, 1.5 + vrnd() * 2.6,
      sh.z + uz * (1.2 + i * 1.7) + (vrnd() - 0.5) * 3.2,
      1.8 + i * 0.5, 5.4 + vrnd() * 0.6, 1.8 + vrnd() * 0.7, 0.8, 0,
      0.35 + vrnd() * 0.5, ux * 1.5 + (vrnd() - 0.5) * 1.2, uz * 1.5 + (vrnd() - 0.5) * 1.2
    );
  }
  for (let i = 0; i < 3; i++) {
    dustPool.emit(
      sh.x + (vrnd() - 0.5) * 3, 0.45 + vrnd() * 1.2, sh.z + (vrnd() - 0.5) * 3,
      1.2, 3.6 + vrnd(), 1.2 + vrnd() * 0.5, 0.55, 0, 0.5 + vrnd() * 0.6, ux * 1.8, uz * 1.8
    );
  }
}
/* 榴弹（HE）：反步兵被削弱（半径/命中率下调）、反装甲与反工事加强。
   霰弹是反人员弹、不伤装甲；两者分工要能从 damage 上读出来。 */
const SHELL_KILL_RADIUS = 5.4;
const SHELL_FRAG_RADIUS = 12.5;   // 破片环：半径更大、命中率更低
/* HE 的落点伤害参数集中在这里：结算（projectilesUpdate）与验收面（ballistics().heShell）
   都读同一组常量，避免改一处、验收面报另一个数（AGENTS.md 要求验收面能反映真实伤害表）。 */
const HE_INF = { killCap: 5, killChance: 0.62, fragCap: 3, fragChance: 0.13, blindCap: 4, blindChance: 0.26 };
const HE_TANK = { directDmg: 170, directRnd: 130, directChance: 0.72, fragDmg: 70, fragRnd: 70, fragChance: 0.30 };
/* 反炮兵命中：耐久归零就炸毁火炮、炮手阵亡（炮兵此前是"打不死"的布景） */
function damageGun(g, dmg, by) {
  if (g.dead) return;
  g.hp -= dmg;
  if (g.hp > 0) return;
  g.dead = true;
  g.group.visible = false;
  /* 炮手是从 foot 池直接征用的，没进任何 Unit.soldiers，所以不能走 Unit.kill，
     只能就地走同一个血的收口血函数 */
  for (const s of g.crew) {
    if (!s.alive) continue;
    s.alive = false; s.state = 'down'; s.fallT = 0; s.spd = 0; s.target = null;
    bloodBurst(s, g.x - s.x, g.z - s.z, 1.2);
  }
  explodeGround(g.x, g.z, 0.85);
  blog((g.army.key === 'union' ? '联邦' : '邦联') + '炮兵被' + by + '摧毁', '#e8865a');
}
/* 凌空弹丸对地覆盖：有掩体的部队吃到的概率更低（战壕对空爆有效） */
function blastCasualtiesCovered(foe, x, z, radius, cap, chance) {
  let hits = 0;
  for (const u of foe.units) {
    if (u.kind === 'art' || u.men <= 0 || u.gone) continue;
    const c = 1 - 0.6 * clamp(u.cover || 0, 0, 1);
    for (const s of u.aliveSoldiers()) {
      if (hits >= cap) break;
      if (Math.hypot(s.x - x, s.z - z) < radius && rnd() < chance * c) { u.kill(s, s.x - x, s.z - z, 1.2); hits++; }
    }
  }
  return hits;
}
/* 霰弹空爆：在弹道设定点凌空炸开。特效走专属 shrapPool（白色弹丸云 + 环状云），
   与榴弹的橙色火球/黑烟/弹坑区分；只有向下弹丸(shardPool)和地面尘环(dustPool)复用。 */
function shrapnelBurst(sh) {
  const foe = sh.side === 'union' ? C : U;
  const gy = terrainH(sh.x, sh.z);
  /* ① 凌空球形云：白球沿球面向外炸开 */
  for (let k = 0; k < 18; k++) {
    const a = vrnd() * TAU, e = (vrnd() - 0.5) * Math.PI * 0.7, sp = 7 + vrnd() * 8;
    const cx2 = Math.cos(a) * Math.cos(e), cy2 = Math.sin(e), cz2 = Math.sin(a) * Math.cos(e);
    shrapPool.emit(sh.x, sh.y, sh.z, 2.2 + vrnd() * 0.9, 4.8 + vrnd() * 2.2, 1.0 + vrnd() * 0.4, 0.9, 0,
      cy2 * sp * 0.5 + 0.4, cx2 * sp, cz2 * sp);
  }
  /* ② 水平环状云：空爆特有的环 */
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * TAU + vrnd() * 0.2, sp = 9 + vrnd() * 4;
    shrapPool.emit(sh.x, sh.y, sh.z, 1.8, 5.6, 1.15, 0.85, 0, 0, Math.cos(a) * sp, Math.sin(a) * sp);
  }
  /* ③ 短促冷白闪光（比榴弹的橙火更小更冷） */
  flashPool.emit(sh.x, sh.y, sh.z, 1.1, 0.16, 0.04, 0.85, 0, 0, 0, 0);
  /* ④ 向下飞散的弹丸 */
  for (let k = 0; k < 14; k++) {
    shardPool.emit(sh.x, sh.y, sh.z, 0.13, 0.04, 0.45, 1, 0, -8 - vrnd() * 6, (vrnd() - 0.5) * 4.5, (vrnd() - 0.5) * 4.5);
  }
  /* ⑤ 浅地面尘环（无弹坑、无火焰） */
  for (let k = 0; k < 7; k++) {
    const a = vrnd() * TAU, rr = 2 + vrnd() * SHRAPNEL_R;
    dustPool.emit(sh.x + Math.cos(a) * rr, gy + 0.2, sh.z + Math.sin(a) * rr,
      0.3, 1.1 + vrnd() * 0.7, 0.45, 0.35, 0, 1.0, Math.cos(a), Math.sin(a));
  }
  counterBatteryFix(sh.side, sh.x, sh.z, sh.ox, sh.oz);
  const hits = blastCasualtiesCovered(foe, sh.x, sh.z, SHRAPNEL_R, SHRAPNEL_CAP, SHRAPNEL_CHANCE * sh.acc);
  if (hits > 0) blog('霰弹凌空 — ' + foe.side.label + ' ' + hits + ' 人倒下（掩体可减伤）', '#e0b060');
  for (const a of [U, C]) for (const u of a.units) {
    if (u.kind === 'art' || u.gone || u.men <= 0) continue;
    const d = Math.hypot(u.cx - sh.x, u.cz - sh.z);
    if (d < SHRAPNEL_R + 6) u.suppress = clamp(u.suppress + 0.35 * (1 - d / (SHRAPNEL_R + 6)), 0, 1);
  }
}
/* 霰弹没等到引信距离就落地（目标移动/越顶）：仍是反人员弹，只在小范围内砸步兵，
   **不伤装甲**——这是它和榴弹最重要的分工，不能让"没空爆的霰弹"退回榴弹的杀伤表。 */
function shrapnelGround(sh) {
  const foe = sh.side === 'union' ? C : U;
  explodeGround(sh.x, sh.z, 0.7);
  counterBatteryFix(sh.side, sh.x, sh.z, sh.ox, sh.oz);
  const hits = blastCasualtiesCovered(foe, sh.x, sh.z, SHRAPNEL_R * 0.75,
    Math.ceil(SHRAPNEL_CAP * 0.6), SHRAPNEL_CHANCE * 0.7 * sh.acc);
  if (hits > 0) blog('霰弹落地 — ' + foe.side.label + ' ' + hits + ' 人倒下', '#e0b060');
}
/* 大规模杀伤弹（WMD）落地：伤害小但范围大、地形改变大。
   ① 中心爆炸复用统一爆炸（巨型火球 + 土浪 + 破片 + 中心大口径弹坑）；
   ② 环形卫星弹坑把中心坑扩成一片"弹坑场"（固定偏移 = 纯确定性，不用任何 PRNG）；
   ③ 蘑菇云烟柱 + 顶部外扩云盖（视觉，走 vrnd）；
   ④ 大半径、低单兵命中率、低伤亡上限的杀伤 + 大范围压制。 */
function wmdImpact(sh) {
  const foe = sh.side === 'union' ? C : U;
  const x = sh.x, z = sh.z, gY = terrainH(x, z);
  explodeGround(x, z, WMD_POWER);
  for (let k = 0; k < WMD_SATELLITES; k++) {
    const a = k * (TAU / WMD_SATELLITES) + 0.4, rr = 20 + (k % 3) * 14;
    addTerrainCrater(x + Math.cos(a) * rr, z + Math.sin(a) * rr, 1.4 + (k % 2) * 0.7);
  }
  /* 蘑菇云：上升烟柱 + 顶部外扩的云盖 */
  for (let i = 0; i < 26; i++) {
    const h = 2 + i * 2.6;
    smokePool.emit(x + (vrnd() - 0.5) * 5, gY + h, z + (vrnd() - 0.5) * 5,
      2.4 + h * 0.12, 7 + vrnd() * 3, 1.5, 0.7, 0, 0.25,
      (vrnd() - 0.5) * 0.6, (vrnd() - 0.5) * 0.6);
  }
  for (let i = 0; i < 16; i++) {
    const a = vrnd() * TAU, rr = vrnd() * 26;
    smokePool.emit(x + Math.cos(a) * rr, gY + 66 + vrnd() * 12, z + Math.sin(a) * rr,
      4.5, 8.5, 2.0, 0.62, 0, 0.1 + vrnd() * 0.25, Math.cos(a) * 2.2, Math.sin(a) * 2.2);
  }
  /* 低伤害 + 大范围：半径 WMD_R、单兵命中率 WMD_CHANCE、总上限 WMD_CAP */
  const hits = blastCasualties(foe, x, z, WMD_R, WMD_CAP, WMD_CHANCE * sh.acc);
  if (hits > 0) blog((sh.label || '大规模杀伤弹') + ' 命中 ' + foe.side.label + ' — ' + hits + ' 人倒下（范围极大）', '#e8b060');
  /* 大范围压制：两军都吃（范围比普通爆炸更大） */
  for (const a of [U, C]) for (const u of a.units) {
    if (u.kind === 'art' || u.gone || u.men <= 0) continue;
    const d = Math.hypot(u.cx - x, u.cz - z);
    if (d < WMD_SUPPRESS_R) u.suppress = clamp(u.suppress + 0.5 * (1 - d / WMD_SUPPRESS_R), 0, 1);
  }
  /* 伤害刻意小：装甲/工事只是被"震一下"，数值远低于普通炮弹 */
  for (const t of ARMOR.tanks) {
    if (t.dead || t.side === sh.side) continue;
    if (Math.hypot(t.x - x, t.z - z) < WMD_R * 0.5 && rnd() < 0.22) damageTank(t, 30 + rnd() * 40, sh.label || '大规模杀伤弹');
  }
  for (const F of FORT) {
    if (F.dead || F.side === sh.side) continue;
    if (Math.hypot(F.x - x, F.z - z) < WMD_R && rnd() < 0.25) damageFort(F, 40 + rnd() * 50, sh.label || '大规模杀伤弹');
  }
}
function projectilesUpdate(dt) {
  for (const sh of shells) {
    if (!sh.active) continue;
    sh.vy -= 9.8 * dt;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.z += sh.vz * dt;
    sh.mesh.position.set(sh.x, sh.y, sh.z);
    sh.mesh.rotation.x += dt * 7; sh.mesh.rotation.z += dt * 5;
    sh.dist -= Math.hypot(sh.vx, sh.vy, sh.vz) * dt;
    if (sh.dist <= 0) {
      sh.dist += sh.trailStep || 1.3;
      smokePool.emit(
        sh.x + (vrnd() - 0.5) * 0.3, sh.y + (vrnd() - 0.5) * 0.3, sh.z + (vrnd() - 0.5) * 0.3,
        0.75, 2.7, 1.25, 0.34, 0, 0.16, sh.vx * 0.02, sh.vz * 0.02);
    }
    const gY = terrainH(sh.x, sh.z);
    /* 霰弹：到达设定的空爆距离（距瞄准点的水平距离）就在空中炸开 */
    if (sh.mode === 'shrapnel' && Math.hypot(sh.x - sh.tx, sh.z - sh.tz) <= (sh.fuse || SHRAPNEL_FUSE)) {
      sh.active = false; sh.mesh.visible = false;
      shrapnelBurst(sh);
      continue;
    }
    if (sh.y <= gY + 0.15) {
      sh.active = false; sh.mesh.visible = false;
      const foe = sh.side === 'union' ? C : U;
      if (sh.mode === 'wmd') {
        /* 大规模杀伤弹：低伤害 / 大范围 / 大范围地形改变 */
        wmdImpact(sh);
      } else if (sh.mode === 'tank') {
        /* 坦克炮弹：低伸弹道落地，单一杀伤半径（数值与原"瞬间结算"一致） */
        explodeGround(sh.x, sh.z, sh.power);
        const hits = blastCasualties(foe, sh.x, sh.z, sh.killR, sh.cap, sh.chance);
        if (hits > 0) blog(sh.label + ' 炮击 ' + foe.side.label + ' — ' + hits + ' 人倒下', '#c8a05a');
        for (const t of ARMOR.tanks) {
          if (t.dead || t.side === sh.side) continue;
          if (Math.hypot(t.x - sh.x, t.z - sh.z) < sh.killR && rnd() < 0.5) damageTank(t, sh.tankDmg + rnd() * 60, sh.label);
        }
        for (const F of FORT) {
          if (F.dead || F.side === sh.side) continue;
          if (Math.hypot(F.x - sh.x, F.z - sh.z) < 24 && rnd() < 0.4) damageFort(F, 60 + rnd() * 70, sh.label);
        }
      } else if (sh.mode === 'shrapnel') {
        /* 霰弹落地：反人员、不伤装甲。绝不能落回 HE 分支的杀坦克表——
           否则"空爆失败"的霰弹会变成打坦克最狠的弹种。 */
        shrapnelGround(sh);
      } else {
        explodeGround(sh.x, sh.z, 1);
        /* 弹道反推：被炮击一方若有部队在弹着点附近，就能反推出敌炮阵地坐标 */
        counterBatteryFix(sh.side, sh.x, sh.z, sh.ox, sh.oz);
        /* 两段结算：HE 对步兵弱（半径/人数/概率都下调）、对装甲与工事强。 */
        const hits = blastCasualties(foe, sh.x, sh.z, SHELL_KILL_RADIUS, HE_INF.killCap, HE_INF.killChance * sh.acc)
          + blastCasualties(foe, sh.x, sh.z, SHELL_FRAG_RADIUS, HE_INF.fragCap, HE_INF.fragChance * sh.acc);
        if (hits > 0) blog('炮弹落入 ' + foe.side.label + ' 队列 — ' + hits + ' 人倒下（含破片）', '#d9a05a');
        /* 盲射没有观察校射，散布大 → 会砸到自己人 */
        if (sh.blind) {
          const own = sh.side === 'union' ? U : C;
          const mis = blastCasualties(own, sh.x, sh.z, SHELL_KILL_RADIUS * 1.2, HE_INF.blindCap, HE_INF.blindChance * sh.acc);
          if (mis > 0) blog('盲射误差 — 炮弹落入本方 ' + own.side.label + ' 队列，' + mis + ' 人伤亡', '#e8b060');
        }
        /* 反炮兵：落到敌炮位附近就能摧毁火炮（这是反推坐标的价值所在） */
        for (const eu of foe.units) {
          if (eu.kind !== 'art') continue;
          for (const G of eu.guns) {
            if (G.dead) continue;
            const gd = Math.hypot(G.x - sh.x, G.z - sh.z);
            if (gd < SHELL_KILL_RADIUS && rnd() < 0.5) damageGun(G, 90 + rnd() * 80, '炮兵反制');
            else if (gd < SHELL_FRAG_RADIUS && rnd() < 0.16) damageGun(G, 40 + rnd() * 40, '炮弹破片');
          }
        }
        /* 破片也能伤坦克：HE 是反装甲弹，直接命中重、破片环也加强 */
        for (const t of ARMOR.tanks) {
          if (t.dead || t.side === sh.side) continue;
          const td = Math.hypot(t.x - sh.x, t.z - sh.z);
          if (td < SHELL_KILL_RADIUS && rnd() < HE_TANK.directChance) damageTank(t, HE_TANK.directDmg + rnd() * HE_TANK.directRnd, '炮兵直击');
          else if (td < SHELL_FRAG_RADIUS && rnd() < HE_TANK.fragChance) damageTank(t, HE_TANK.fragDmg + rnd() * HE_TANK.fragRnd, '炮弹破片');
        }
        /* 英雄建筑也进同一套伤害结算：堡垒不是布景，会被炮击打掉 */
        for (const F of FORT) {
          if (F.dead || F.side === sh.side) continue;
          if (Math.hypot(F.x - sh.x, F.z - sh.z) < 24 && rnd() < 0.5) damageFort(F, 90 + rnd() * 90, '炮兵直击');
        }
      }
    }
  }
  /* 「弹幕徐进」：定时在预定落点依次引爆，弹幕沿纵深推进 */
  for (let i = BARRAGE.length - 1; i >= 0; i--) {
    const b = BARRAGE[i];
    b.t -= dt;
    if (b.t > 0) continue;
    BARRAGE.splice(i, 1);
    explodeGround(b.x, b.z, 1.15);
    counterBatteryFix(b.side, b.x, b.z, b.ox, b.oz);
    const foe = b.side === 'union' ? C : U;
    const hits = blastCasualties(foe, b.x, b.z, 9, 3, 0.40);
    if (hits > 0) blog('徐进弹幕落入 ' + foe.side.label + ' 队列 — ' + hits + ' 人倒下', '#d9a05a');
  }
}

/* ---- 战壕关键尺寸（先声明：布阵时要把步兵放进壕沟，不能靠手调 z ----） ---- */
/* FRONT / Z_* 等纵深常量已在文件顶部按 DZ 声明（本轮 60 → 120，会战间距 960 m）。
   TRENCH_Z / 壕沟几何 / 步兵落位都从这里取。 */
const TRENCH_Z = { union: -FRONT * S, confederate: FRONT * S };
const HALF_TRENCH = 92 * S;
const TRENCH_DITCH_DZ = -0.175;   // 壕沟底中心相对工程中心线的朝敌偏移
const trenchWob = x => Math.sin(x * 0.19) * 0.5 + Math.sin(x * 0.066 + 2.1) * 0.95;
const trenchFace = key => key === 'union' ? 1 : -1;
/* 壕沟底中心的世界 z：步兵应站在这里（工程中心线 + 蛇形 + 沟底偏移） */
const trenchDitchZ = (key, x) => TRENCH_Z[key] + (trenchWob(x) + TRENCH_DITCH_DZ) * trenchFace(key);
/* 出击口（散兵口）：开在各单位之间的空档上，胸墙/踏台/头木在这段压低成可跨越的缓坡。
   刻意不开在单位正面——那是掩护最不该被削弱的位置，而且口子里没有胸墙就没有掩护。 */
const BREACH_X = [-368, -291, -194, -97, 0, 97, 194, 291];   // 开在各单位之间（间距 97 m）
const BREACH_HALF = 16;
function breachFactor(x) {
  let o = 0;
  for (const c of BREACH_X) o = Math.max(o, clamp(1 - Math.abs(x - c) / BREACH_HALF, 0, 1));
  return o * o * (3 - 2 * o);
}
/* 断面：dz 朝敌为正，h 为高出天然地面的高度，k 为受光系数（壕内压暗） */
const TRENCH_ROWS = [
  { dz: -2.70, h: 0.04, k: 0.50 },   // 背墙后坡脚
  { dz: -2.05, h: 0.74, k: 0.94 },   // 背墙顶 (parados)
  { dz: -1.55, h: 0.12, k: 0.56 },   // 背墙内坡
  { dz: -1.15, h: 0.04, k: 0.38 },   // 壕底后缘
  { dz: 0.80, h: 0.04, k: 0.38 },    // 壕底前缘
  { dz: 1.30, h: 0.52, k: 0.72 },    // 踏台 (fire step)
  { dz: 1.95, h: 1.30, k: 1.00 },    // 胸墙顶 (parapet)：1.30 m 才挡到站立者肩部
  { dz: 3.05, h: 0.04, k: 0.84 }     // 胸墙前坡脚
];
const TR_LAST = TRENCH_ROWS.length - 1;
const trenchRowH = (h, j, open) => j === 5 ? h * (1 - 0.62 * open)
  : j === 6 ? h * (1 - 0.80 * open) : h;
const ABATIS_DZ = 3.55;        // 鹿砦带（胸墙前的拒马桩）

/* 工事表面相对天然地面的高度场 —— 与建壕共用同一组断面数据，
   所以士兵的 y 真正踩在网格上：过胸墙是"翻过去"，不是"穿过去"。 */
function workH(x, z) {
  let best = 0;
  for (const key of ['union', 'confederate']) {
    const f = trenchFace(key), wob = trenchWob(x);
    const s = (z - (TRENCH_Z[key] + wob * f)) * f;
    if (s < TRENCH_ROWS[0].dz || s > TRENCH_ROWS[TR_LAST].dz) continue;
    const open = breachFactor(x);
    for (let j = 0; j < TR_LAST; j++) {
      const A = TRENCH_ROWS[j], B = TRENCH_ROWS[j + 1];
      if (s > B.dz) continue;
      const t = (s - A.dz) / (B.dz - A.dz);
      const ya = terrainH(x, TRENCH_Z[key] + (A.dz + wob) * f) + trenchRowH(A.h, j, open);
      const yb = terrainH(x, TRENCH_Z[key] + (B.dz + wob) * f) + trenchRowH(B.h, j + 1, open);
      best = Math.max(best, lerp(ya, yb, t) - terrainH(x, z));

    }
  }
  return Math.max(0, best);
}
const groundY = (x, z) => terrainH(x, z) + Math.max(workH(x, z), obstacleH(x, z));
/* 鹿砦（拒马桩）带：对骑兵是致命的 */
function abatisFactor(x, z) {
  let m = 0;
  for (const key of ['union', 'confederate']) {
    const f = trenchFace(key), wob = trenchWob(x);
    const s = (z - (TRENCH_Z[key] + wob * f)) * f;
    m = Math.max(m, clamp(1 - Math.abs(s - ABATIS_DZ) / 0.9, 0, 1));
  }
  return m;
}
/* 通行代价（1 = 如履平地）：断面高差 —— 骑兵翻 1.3 m 胸墙几乎被挡停；
   再叠加胸墙前鹿砦的阻滞。这个属性必须进移动积分，否则工事只是贴图。 */
/* 涉水代价：河心最慢，骑兵更怕水。浅滩仍可通过，不设硬阻挡——否则战线会卡在河边 */
function waterTraverse(kind, x, z) {
  const d = clamp((riverCore(x, z) - 0.30) / 0.55, 0, 1);
  return kind === 'cav' ? 1 - 0.45 * d : 1 - 0.26 * d;
}
/* 弹坑通行代价：坑底/坑缘的坡度会让队形散乱，骑兵更怕（与胸墙同一套"属性进移动积分"逻辑） */
function craterTraverse(kind, x, z) {
  const a = Math.abs(craterAt(x, z));
  if (a < 0.25) return 1;
  return 1 - (kind === 'cav' ? 0.55 : 0.30) * clamp((a - 0.25) / 1.5, 0, 1);
}
function workTraverse(kind, x, z) {
  const h = Math.max(workH(x, z), obstacleH(x, z));
  let fac = kind === 'cav'
    ? 1 - 0.92 * clamp((h - 0.10) / 0.90, 0, 1)
    : 1 - 0.72 * clamp((h - 0.15) / 1.00, 0, 1);
  const ab = abatisFactor(x, z);
  fac *= kind === 'cav' ? 1 - 0.78 * ab : 1 - 0.35 * ab;
  fac *= waterTraverse(kind, x, z);
  fac *= craterTraverse(kind, x, z);
  return clamp(fac, kind === 'cav' ? 0.05 : 0.25, 1);
}
/* 弹坑是"被炸出来的掩体"：坑底越深掩护越好（这就是"地形被改变"的玩法口径） */
function craterCover(x, z) {
  const d = craterAt(x, z);
  return d < -0.30 ? clamp((-d - 0.30) / 1.6, 0, 1) * 0.45 : 0;
}

/* ---- 随机战场障碍物：石墙 / 倒木 / 干草堆 / 木栅栏 / 碎石堆 ----
   布局用独立种子 ornd（既不吃玩法 rnd 也不吃视觉 vrnd），
   与战壕同一套属性：高度进 groundY/workTraverse（拖慢通行、抬人），
   掩体值进 coverAt（挡弹）。空间哈希网格保证逐士兵查询 O(1)。 */
const ornd = mulberry32(0x0B57AC1E);
/* 障碍数量按"散布面积"缩放，而不是按纵深倍率 DZ：z 散布只从 250*S(1000 m) 增到
   250*S+2*ZSH(1480 m)，面积 ×1.48，所以 ×2 会让逐士兵的 groundY 空间哈希查询密度
   上升 ~35%、把静态障碍几何翻倍却不多出任何玩法。 */
const OB_AREA = (250 * S + 2 * ZSH) / (250 * S);
const OBSTACLE_TYPES = [
  { id: 'wall', h: 0.78, cover: 0.62, minR: 1.6, maxR: 2.6, count: Math.round(34 * 8 * OB_AREA) },
  { id: 'log', h: 0.46, cover: 0.44, minR: 1.3, maxR: 2.1, count: Math.round(26 * 8 * OB_AREA) },
  { id: 'hay', h: 0.72, cover: 0.28, minR: 1.1, maxR: 1.6, count: Math.round(22 * 8 * OB_AREA) },
  { id: 'fence', h: 0.86, cover: 0.38, minR: 1.7, maxR: 2.8, count: Math.round(30 * 8 * OB_AREA) },
  { id: 'rock', h: 0.62, cover: 0.50, minR: 1.0, maxR: 1.6, count: Math.round(26 * 8 * OB_AREA) }
];
const obstacles = [];
{
  const freeAt = (x, z) => {
    if (Math.abs(Math.abs(z) - FRONT * S) < 40 && Math.abs(x) < 420) return false;  // 不压战壕与出发线
    if (Math.abs(Math.abs(z) - Z_ART) < 60 && Math.abs(x) < 520) return false;   // 不占用炮兵阵地（与 Z_ART 同一来源）
    if (Math.abs(x) < 104 && Math.abs(z) < 88) return false;                  // 中央接触区留空
    if (riverCore(x, z) > 0.01) return false;                                 // 河道/岸坡上不放障碍物
    for (const key in FORT_SITE) {                                            // 堡垒基座上不放障碍物
      const F = FORT_SITE[key];
      if (Math.abs(x - F.x) < 34 && Math.abs(z - F.z) < 30) return false;
    }
    return !onAirfield(x, z);
  };
  for (const T of OBSTACLE_TYPES) {
    let made = 0, guard = 0;
    while (made < T.count && guard++ < T.count * 50) {
      const x = (ornd() - 0.5) * 310 * S, z = (ornd() - 0.5) * (250 * S + 2 * ZSH);
      if (!freeAt(x, z)) continue;
      obstacles.push({
        kind: T.id, x, z, r: lerp(T.minR, T.maxR, ornd()), h: T.h, cover: T.cover,
        rot: ornd() * TAU, sc: 0.82 + ornd() * 0.42
      });
      made++;
    }
  }
}

/* ---- 城市废墟：沿河道两岸的断壁残垣（与河道共同形成"河畔废城"）----
   布局用独立流 urnd（不吃玩法 rnd / 视觉 vrnd）。每座残屋拆成四面断墙，
   沿墙每隔 3.4 m 放一个实体碰撞圆（solid），并随机留出破口——士兵/战车
   会被墙挡住、沿切线滑开绕行（碰撞 + 躲避），同时断墙提供 0.6 掩体。
   桥头走廊 |x| < 30 留空，纵队仍能过河；院内瓦砾是非实体障碍（踩得上去、
   只减速），与随机障碍同一套属性。 */
const RUINS = [];        // 可视构件（烘焙成一个 mesh）
const ruinCount = { buildings: 0, walls: 0, rubble: 0 };
{
  const urnd = mulberry32(0xC17BE11);
  const placeBuilding = (bx, bz, w, d, h, rot) => {
    ruinCount.buildings++;
    const c = Math.cos(rot), s = Math.sin(rot);
    const toW = (lx, lz) => [bx + lx * c + lz * s, bz - lx * s + lz * c];
    /* 四面墙：[局部中心x, 局部中心z, 局部方向x, 局部方向z, 长度, 世界朝向] */
    const walls = [
      [0, -d / 2, 1, 0, w, rot + Math.PI / 2],
      [0, d / 2, 1, 0, w, rot + Math.PI / 2],
      [-w / 2, 0, 0, 1, d, rot],
      [w / 2, 0, 0, 1, d, rot]
    ];
    const skip = urnd() < 0.35 ? (urnd() * 4 | 0) : -1;   // 整面墙塌掉 = 破屋
    walls.forEach((wall, wi) => {
      if (wi === skip) return;
      const [lx, lz, ex, ez, len, ang] = wall;
      const n = Math.max(1, Math.round(len / 3.4));
      for (let i = 0; i < n; i++) {
        if (urnd() < 0.16) continue;                       // 破口：留出可穿越的缺口
        const t = (i - (n - 1) / 2) * 3.4;
        const wx = toW(lx + ex * t, lz + ez * t)[0];
        const wz = toW(lx + ex * t, lz + ez * t)[1];
        const hh = h * (0.5 + urnd() * 0.55);
        RUINS.push({ x: wx, z: wz, w: 3.6, d: 0.7, h: hh, rot: ang - Math.PI / 2, tilt: (urnd() - 0.5) * 0.10, col: 0x8b8370 });
        if (hh > 1.1) { obstacles.push({ kind: 'ruin', solid: true, x: wx, z: wz, r: 2.0, h: hh, cover: 0.6, rot: ang }); ruinCount.walls++; }
      }
    });
    /* 院内瓦砾：低矮、可踩踏，只减速+给掩护 */
    const nr = 2 + (urnd() * 3 | 0);
    for (let k = 0; k < nr; k++) {
      const rx = toW((urnd() - 0.5) * w * 0.7, (urnd() - 0.5) * d * 0.7)[0];
      const rz = toW((urnd() - 0.5) * w * 0.7, (urnd() - 0.5) * d * 0.7)[1];
      const rr = 1.3 + urnd() * 1.3;
      const rh = 0.45 + urnd() * 0.6;
      RUINS.push({ x: rx, z: rz, w: 2.0 + urnd() * 2.0, d: 1.6 + urnd() * 1.6, h: rh, rot: urnd() * TAU, tilt: (urnd() - 0.5) * 0.3, col: 0x9a9382, rubble: true });
      obstacles.push({ kind: 'rubble', x: rx, z: rz, r: rr, h: rh, cover: 0.3, rot: 0 });
      ruinCount.rubble++;
    }
  };
  for (const side of [-1, 1]) {
    for (let i = 0; i < 16; i++) {
      const x = (urnd() * 2 - 1) * 250;
      if (Math.abs(x) < 30) continue;                       // 桥头走廊
      const z = RIVER.z(x) + side * (42 + urnd() * 92);
      placeBuilding(x, z, 7 + urnd() * 5, 5.5 + urnd() * 3, 2.8 + urnd() * 4.4, urnd() * TAU);
    }
  }
  /* 两座地标：断塔与残破烟囱，让"废城"在天际线上一眼可辨 */
  placeBuilding(-70, RIVER.z(-70) - 54, 9, 9, 11, 0.4);
  placeBuilding(74, RIVER.z(74) + 58, 8, 8, 9, -0.3);
}

const OB_CELL = 8;
const obGrid = new Map();
const obKey = (ix, iz) => (ix + 64) * 512 + (iz + 64);
for (let i = 0; i < obstacles.length; i++) {
  const o = obstacles[i];
  const k = obKey(Math.floor(o.x / OB_CELL), Math.floor(o.z / OB_CELL));
  if (!obGrid.has(k)) obGrid.set(k, []);
  obGrid.get(k).push(i);
}
function obNear(x, z, fn, cells) {
  const c = cells || 1;
  const ix = Math.floor(x / OB_CELL), iz = Math.floor(z / OB_CELL);
  for (let a = -c; a <= c; a++) for (let b = -c; b <= c; b++) {
    const cell = obGrid.get(obKey(ix + a, iz + b));
    if (cell) for (const i of cell) fn(obstacles[i]);
  }
}
function obstacleH(x, z) {
  let h = 0;
  obNear(x, z, o => {
    if (o.solid) return;            // 实体建筑不"抬人"：由碰撞挡住并绕行，不做可踩踏地形
    const d = Math.hypot(x - o.x, z - o.z);
    if (d < o.r) h = Math.max(h, o.h * clamp(1 - d / o.r, 0, 1));
  });
  return h;
}
/* 实体障碍碰撞：把 (x,z) 推出所有 solid 圆并返回新坐标（推不出去返回 null）。
   maxPush 限制单帧修正量，避免快速冲锋时发生瞬移。士兵与战车共用。 */
let SOLID_ON = true;              // 调试开关：__battle.solid(false) 关碰撞做 A/B
function solidResolve(x, z, rad, maxPush) {
  if (!SOLID_ON) return null;
  let ox = 0, oz = 0, hit = false;
  obNear(x, z, o => {
    if (!o.solid) return;
    const dx = x - o.x, dz = z - o.z;
    let d = Math.hypot(dx, dz);
    const rr = o.r + rad;
    if (d >= rr) return;
    if (d < 1e-3) d = 1e-3;
    ox += dx / d * (rr - d); oz += dz / d * (rr - d); hit = true;
  });
  if (!hit) return null;
  const m = Math.hypot(ox, oz) || 1;
  const k = Math.min(1, maxPush / m);
  return { x: x + ox * k, z: z + oz * k };
}
/* 前方实体障碍 → 打舵方向（±1）。战车/单位在推进时用作"躲避"转向。 */
function avoidSolid(x, z, yaw, look) {
  if (!SOLID_ON) return 0;
  let steer = 0, bd = 1e9, bx = 0, bz = 0, found = false;
  obNear(x, z, o => {
    if (!o.solid) return;
    const dx = o.x - x, dz = o.z - z;
    const d = Math.hypot(dx, dz);
    if (d > o.r + look || d < 0.001) return;
    if (d < bd) { bd = d; bx = dx; bz = dz; found = true; }
  }, 3);
  if (!found) return 0;
  let a = Math.atan2(bx, bz) - yaw;
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  if (Math.abs(a) > 0.95) return 0;   // 障碍不在正前方，不打舵
  return a >= 0 ? -1 : 1;
}
function obstacleCover(x, z) {
  let c = 0;
  obNear(x, z, o => {
    if (!o.cover) return;
    const d = Math.hypot(x - o.x, z - o.z), rr = o.r * 1.3;
    if (d < rr) c = Math.max(c, o.cover * clamp(1 - d / rr, 0, 1) * 1.55);
  });
  return clamp(c, 0, 0.72);
}

/* 阵容：每方 8 个步兵团沿放大后的正面展开（间距 97 m），两翼各 1 个骑兵团，
   后方 2 个炮兵连；双方步兵互相错开 24 m（对着对方的间隙），接触更有咬合感。
   步兵的 z 只需名义值——makeArmyUnits 会用 trenchDitchZ 把整队放进壕沟。 */
const INF_NAMES = {
  union: ['第 20 缅因团', '第 69 纽约团', '第 1 明尼苏达团', '爱尔兰旅', '第 2 威斯康星团', '第 19 印第安纳团', '第 5 新罕布什尔团', '第 8 俄亥俄团'],
  confederate: ['第 1 弗吉尼亚团', '第 4 阿拉巴马团', '第 2 密西西比团', '石墙旅', '第 3 田纳西团', '第 6 北卡罗来纳团', '第 7 佐治亚团', '第 5 德克萨斯团']

const ROSTER = {

for (const key of ['union', 'confederate']) {

  });

  for (let i = 0; i < 2; i++) ROSTER[key].mg.push({

  ROSTER[key].cavalry.push(
    { resolve: res, name: f > 0 ? '第 6 骑兵团' : '第 1 弗吉尼亚骑兵', title: f > 0 ? '第6骑兵团' : '第1弗骑',
      x: -398, z: -Z_CAV * f, files: 6, ranks: 2, yaw, sx: 2.3, sz: 2.6 },
    { resolve: res, name: f > 0 ? '第 1 骑兵团' : '汉普顿军团', title: f > 0 ? '第1骑兵团' : '汉普顿军团',
      x: 398, z: -Z_CAV * f, files: 6, ranks: 2, yaw, sx: 2.3, sz: 2.6 }

    { resolve: res, name: f > 0 ? '第 2 炮兵连' : '华盛顿炮兵', title: f > 0 ? '第2炮兵连' : '华盛顿炮兵',
      x: -168, z: -Z_ART * f, guns: 2, yaw },
    { resolve: res, name: f > 0 ? '第 5 炮兵连' : '石墙炮兵', title: f > 0 ? '第5炮兵连' : '石墙炮兵',
      x: 168, z: -Z_ART * f, guns: 2, yaw }
  );
}

function buildArmy(key) {
  const roster = ROSTER[key];
  const footCount = roster.infantry.reduce((a, u) => a + u.files * u.ranks, 0)
    + roster.artillery.reduce((a, u) => a + u.guns * 7, 0)
    + roster.skirmishers.reduce((a, u) => a + u.files * u.ranks, 0)
    + roster.engineers.reduce((a, u) => a + u.files * u.ranks, 0)
    + roster.mg.reduce((a, u) => a + u.crew, 0);
  const mountCount = roster.cavalry.reduce((a, u) => a + u.files * u.ranks, 0);
  const army = {
    key, side: SIDE[key],
    footPool: new TroopPool(FOOT_PARTS, footCount, MATE[key]),
    mountPool: new TroopPool(HORSE_PARTS, mountCount, MATE[key]),
    riderPool: new TroopPool(RIDER_PARTS, mountCount, MATE[key]),
    foot: [], mount: [], units: [], guns: [], footCursor: 0, mountCursor: 0,
    /* 缓慢增援：有限的后方补充兵池（约步兵总数的 12%），按固定节奏滴入最缺员的
       在战单位；池子抽干就不再补——不会无限回血把会战拖成僵局。 */
    reinfPool: Math.round(footCount * 0.12), reinfT: 2.0, reinfIn: 0
  };
  for (let i = 0; i < footCount; i++) army.foot.push(newSoldier(false));
  for (let i = 0; i < mountCount; i++) army.mount.push(newSoldier(true));
  return army;
}

function makeArmyUnits(army) {
  const roster = ROSTER[army.key];
  const mk = (kind, cfg) => {
    const total = cfg.files * cfg.ranks;
    const soldiers = [];
    if (kind === 'inf' || kind === 'skirm' || kind === 'eng') {
      for (let i = 0; i < total; i++) {
        const s = army.foot[army.footCursor];
        s.idx = army.footCursor++;
        soldiers.push(s);
      }
    } else {
      for (let i = 0; i < total; i++) {
        const s = army.mount[army.mountCursor];
        s.idx = army.mountCursor++;
        soldiers.push(s);
      }
    }
    const u = new Unit(army, Object.assign({ kind, soldiers }, cfg));
    army.units.push(u);
    return u;
  };
  for (const c of roster.infantry) mk('inf', c);
  for (const c of roster.cavalry) mk('cav', c);
  for (const c of roster.artillery) {
    const guns = [];
    for (let i = 0; i < c.guns; i++) {
      const gx = c.x + (i - (c.guns - 1) / 2) * 16;
      const cannon = makeCannon(army);
      cannon.group.position.set(gx, terrainH(gx, c.z), c.z);
      cannon.group.rotation.y = c.yaw;
      scene.add(cannon.group);
      const crew = [];
      for (let k = 0; k < 7; k++) {
        const s = army.foot[army.footCursor];
        s.idx = army.footCursor++;
        const ang = (k / 7) * TAU;
        s.x = gx + Math.cos(ang) * 2.7;
        s.z = c.z + Math.sin(ang) * 2.7;
        s.y = groundY(s.x, s.z);
        s.yaw = c.yaw + Math.PI;
        s.state = 'work';
        s.crew = true;
        crew.push(s);
      }
      guns.push({
        army, group: cannon.group, barrel: cannon.barrel, crew, x: gx, z: c.z,
        recoil: 0, reload: 3 + rnd() * 5, targetUnit: null,
        hp: 170, maxHp: 170, dead: false, cb: null, blind: false, mode: 'direct'
      });
      army.guns.push(guns[guns.length - 1]);
    }
    const u = new Unit(army, Object.assign({ kind: 'art', soldiers: [] }, c, { files: 1, ranks: 1, sx: 1, sz: 1 }));
    u.men = 1; u.maxMen = 1;
    u.slots = []; u.slotSoldier = []; u.soldierSlot = [];
    u.guns = guns;
    u.banner.scale.set(0, 0, 0);
    army.units.push(u);
  }
  /* —— 新兵种：散兵线 / 工兵连 / 机枪队 —— */
  for (const c of roster.skirmishers) mk('skirm', c);
  for (const c of roster.engineers) mk('eng', c);
  for (const c of roster.mg) {
    const soldiers = [];
    for (let i = 0; i < c.crew; i++) {
      const s = army.foot[army.footCursor];
      s.idx = army.footCursor++;
      soldiers.push(s);
    }
    const u = new Unit(army, Object.assign({ kind: 'mg', soldiers }, c, { files: 2, ranks: 2, sx: 2.7, sz: 2.5 }));
    u.mgT = 0.25;
    army.units.push(u);
  }
  for (const u of army.units) {
    if (u.kind === 'art') continue;
    /* 步兵开局站在己方壕沟底（工程中心线带蛇形），否则"战壕"里没人、掩护无从谈起 */
    if (u.kind === 'inf') u.cz = trenchDitchZ(army.key, u.cx);
    for (let k = 0; k < u.soldiers.length; k++) {
      const s = u.soldiers[k];
      u.slotWorld(u.soldierSlot[k], s);
      s.y = groundY(s.x, s.z);
      s.yaw = u.yaw;
    }
  }
}

/* ==================== 战壕 · 高射炮 · 航空兵 ====================
   全部走物理步进（simulate），随机数严格分流：
   影响战局的（选目标/命中/伤亡）用 rnd，纯视觉的（粒子抖动）用 vrnd。 */

/* ---------- 战壕（野战胸墙 / field breastwork） ----------
   断面自内而外：背墙(parados) → 壕沟底 → 踏台(fire step) → 胸墙(parapet) → 前坡，
   胸墙顶再压头木(headlog)。四条实测出来的逻辑，早期版本每一条都反了：
   1) 胸墙高 ~1.18 m 只到人胸口，必须靠 0.48 m 的踏台才能越墙射击——
      没有踏台的"胸墙"是一堵用不上的墙；
   2) 壕沟底与天然地面齐平、由背墙与胸墙夹成，士兵站在两者之间；
      早期版本把深色"壕沟"画在胸墙外侧 3 m 的地面上，人站在开阔地里吃掩护；
   3) 背墙(parados)挡住落在阵线后方的炮弹破片；早期版本完全没有后墙；
   4) 掩体只在壕沟/踏台范围内、且火力来自胸墙一侧时成立；
      早期版本用对称距离 ±7 m 判定，胸墙外的开阔地和侧射都照吃掩护。
   另外每 ~40 m 一道横墙(traverse)限制侧射，每个单位正面留一处出击口(散兵口)，
   否则步兵推进时会直接穿过 1.18 m 的土墙。
   本工程因地面网格 128 段(≈6.1 m/格)无法真正下挖 2.5 m，故按南北战争常见的
   垒土胸墙建造（史料亦记"壕沟宽可坐立、朝敌一侧架木护头肩"）。 */
/* TRENCH_Z / trenchWob / breachFactor 见 ROSTER 之前的声明 */
const trenchTex = dirtTex.clone();
trenchTex.needsUpdate = true;
trenchTex.wrapS = trenchTex.wrapT = THREE.RepeatWrapping;
trenchTex.repeat.set(1, 1);
const trenchMat = new THREE.MeshStandardMaterial({
  map: trenchTex, vertexColors: true, roughness: 1, metalness: 0,
  polygonOffset: true, polygonOffsetFactor: -1.5, polygonOffsetUnits: -1.5
});


/* TRENCH_ROWS / trenchRowH / workH / workTraverse 见 ROSTER 之前的声明 */
function buildTrenchLine(key) {
  const f = key === 'union' ? 1 : -1;
  const tz = TRENCH_Z[key];
  const N = 144, xa = -HALF_TRENCH, xb = HALF_TRENCH;
  const R = TRENCH_ROWS.length;
  const pos = [], col = [], idx = [];
  const jit = mulberry32(key === 'union' ? 0x77A1 : 0x33C9);
  for (let i = 0; i <= N; i++) {
    const x = lerp(xa, xb, i / N), wob = trenchWob(x), open = breachFactor(x);
    for (let j = 0; j < R; j++) {
      const r = TRENCH_ROWS[j];
      const z = tz + (r.dz + wob) * f;
      pos.push(x, terrainH(x, z) + trenchRowH(r.h, j, open), z);
      const k = (0.85 + jit() * 0.3) * r.k;
      col.push(0.62 * k, 0.52 * k, 0.36 * k);
    }
  }
  const flip = f < 0;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < R - 1; j++) {
      const a = i * R + j, b = a + R, c = a + 1, d = b + 1;
      if (flip) idx.push(a, b, c, c, b, d);
      else idx.push(a, c, b, b, c, d);
    }
  }
  const uv = [];
  for (let i = 0; i <= N; i++) for (let j = 0; j < R; j++) uv.push(i / N * 40, j * 0.75);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const berm = new THREE.Mesh(g, trenchMat);
  berm.castShadow = true; berm.receiveShadow = true;
  berm.matrixAutoUpdate = false; berm.updateMatrix();   // 静态：省掉每帧矩阵重建
  scene.add(berm);

  const o = new THREE.Object3D();
  const R2 = mulberry32(key === 'union' ? 0x1144 : 0x7755);
  const mk = (geo, col, x, dz, h, rot, sc) => {
    const z = tz + (dz + trenchWob(x)) * f;
    o.position.set(x, terrainH(x, z) + h, z);
    o.rotation.set(rot[0], rot[1], rot[2]);
    o.scale.set(sc[0], sc[1], sc[2]);
    o.updateMatrix();
    return { geo, col, m4: o.matrix.clone() };
  };

  /* 附属构件全部静态 → 按材质烘焙成 3 个合并网格（原来 5 个 InstancedMesh）：
     沙袋+横墙、护壁桩+鹿砦、头木。 */
  const bagsL = [], stakesL = [], logsL = [];
  const bagGeo = new THREE.SphereGeometry(0.34, 8, 6);
  bagGeo.scale(1.15, 0.62, 0.78);
  const BAGS = 132;
  for (let i = 0; i < BAGS; i++) {
    const onPara = i < 84;
    const x = onPara
      ? lerp(xa, xb, (i + 0.5) / 84) + (R2() - 0.5) * 0.5
      : lerp(xa, xb, (i - 84 + 0.5) / (BAGS - 84)) + (R2() - 0.5) * 0.5;
    if (onPara && breachFactor(x) > 0.45) continue;      // 出击口不码沙袋
    const dz = onPara ? 1.72 : -2.05, h = onPara ? 1.20 : 0.78;
    bagsL.push(mk(bagGeo, 0x7a6a4a, x, dz + (R2() - 0.5) * 0.18, h + R2() * 0.08,
      [0, (R2() - 0.5) * 0.6, (R2() - 0.5) * 0.22], [1, 1, 1]));
  }
  /* 横墙 traverse：与胸墙垂直，横跨壕沟，限制纵射（同沙袋材质） */
  const trvGeo = box(2.3, 1.15, 4.9);
  for (const x of [-80, -60, -20, 20, 60]) {
    bagsL.push(mk(trvGeo, 0x7a6a4a, x, -0.10, 0.62, [0, (R2() - 0.5) * 0.06, 0], [1, 1, 1]));
  }
  /* 头木 headlog：压在胸墙顶、下方留出射孔（史料：朝敌一侧架木护头肩） */
  const logGeo = cyl(0.13, 0.15, 2.6, 7);
  logGeo.rotateZ(Math.PI / 2);
  for (let i = 0; i < 72; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 72);
    if (breachFactor(x) > 0.45) continue;
    logsL.push(mk(logGeo, 0x6b543a, x, 1.95, 1.36, [(R2() - 0.5) * 0.05, 0, 0], [1, 1, 1]));
  }
  /* 护壁木桩（贴壕沟内壁）+ 鹿砦（胸墙前的拒马桩） */
  const stakeGeo = cyl(0.055, 0.075, 1.0, 6);
  for (let i = 0; i < 96; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 96) + (R2() - 0.5) * 0.5;
    stakesL.push(i % 2 === 0
      ? mk(stakeGeo, 0x574429, x, 0.95, 0.36, [(R2() - 0.5) * 0.1, 0, -f * 0.20], [1, 1, 1])
      : mk(stakeGeo, 0x574429, x, -1.35, 0.34, [(R2() - 0.5) * 0.1, 0, f * 0.20], [1, 1, 1]));
  }
  for (let i = 0; i < 54; i++) {
    const x = lerp(xa, xb, (i + 0.5) / 54) + (R2() - 0.5) * 0.8;
    stakesL.push(mk(stakeGeo, 0x574429, x, 3.55 + R2() * 0.5, 0.30,
      [(R2() - 0.5) * 0.2, R2() * TAU, f * (0.55 + R2() * 0.25)], [1, 1, 1]));
  }
  const fitMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
  bakedMesh(fitMat, bagsL).receiveShadow = true;               // 沙袋/横墙：不投影(阴影 0.166 m/texel 解析不出)
  bakedMesh(fitMat, stakesL).receiveShadow = true;             // 护壁桩/鹿砦
  bakedMesh(fitMat, logsL).castShadow = true;                  // 头木保留投影（2.6 m 长，影子里读得出）
}
buildTrenchLine('union');
buildTrenchLine('confederate');

/* 障碍物网格：每类一个 InstancedMesh（共 5 个 draw call），几何贴合地形 */
function buildObstacles() {
  const vr = mulberry32(0x51D0C3);
  const logGeo = cyl(0.28, 0.32, 4.6, 8);
  logGeo.rotateZ(Math.PI / 2);
  const rockGeo = new THREE.IcosahedronGeometry(0.62, 0);
  rockGeo.scale(1, 0.75, 1.25);
  const defs = {
    wall: {
      col: 0x8a8577, geo: mergeGeometries([
        at(box(3.2, 0.5, 0.6), 0, 0.25, 0), at(box(3.5, 0.36, 0.7), 0, 0.66, 0)
      ])
    },
    log: {
      col: 0x6b563a, geo: mergeGeometries([
        at(logGeo, 0, 0.30, 0), at(cyl(0.36, 0.42, 0.6, 8), 1.65, 0.30, 0),
        at(box(0.5, 0.12, 0.28), -0.9, 0.58, 0.1)
      ])
    },
    hay: {
      col: 0xa78f52, geo: mergeGeometries([
        at(cyl(0.25, 1.18, 1.35, 10), 0, 0.68, 0), at(cyl(0.06, 0.34, 0.42, 8), 0, 1.5, 0)
      ])
    },
    fence: {
      col: 0x6b563a, geo: mergeGeometries([
        at(box(0.16, 1.05, 0.16), -1.5, 0.52, 0), at(box(0.16, 1.05, 0.16), 1.5, 0.52, 0),
        at(box(3.2, 0.11, 0.09), 0, 0.74, 0), at(box(3.2, 0.11, 0.09), 0, 0.44, 0)
      ])
    },
    rock: { col: 0x8a8577, geo: rockGeo }
  };
  /* 障碍物永不动 → 全部烘焙成一个顶点着色网格（原来 5 个 InstancedMesh = 5 个 draw call） */
  const o = new THREE.Object3D(), baked = [];
  for (const ob of obstacles) {
    const D = defs[ob.kind];
    if (!D) continue;               // 城市废墟另有专属几何（见 buildRuins）
    o.position.set(ob.x, terrainH(ob.x, ob.z) + 0.02, ob.z);
    o.rotation.set(ob.kind === 'log' ? (vr() - 0.5) * 0.1 : 0, ob.rot, ob.kind === 'rock' ? (vr() - 0.5) * 0.3 : 0);
    o.scale.set(ob.sc, ob.sc, ob.sc);
    o.updateMatrix();
    baked.push({ geo: D.geo, col: D.col, m4: o.matrix.clone() });
  }
  const mesh = bakedMesh(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), baked);
  mesh.castShadow = true; mesh.receiveShadow = true;
}
buildObstacles();

/* 城市废墟可视：全部断墙/瓦砾烘焙成一个顶点色 mesh（1 个 draw call），
   高度按地形贴合；实体墙的碰撞在 RUINS 生成时就已登记进 obstacles。 */
function buildRuins() {
  const parts = [], o = new THREE.Object3D();
  for (const r of RUINS) {
    o.position.set(r.x, terrainH(r.x, r.z) + r.h * 0.5 - (r.rubble ? 0.12 : 0), r.z);
    o.rotation.set(r.tilt || 0, r.rot, (r.tilt || 0) * 0.6);
    o.scale.set(1, 1, 1); o.updateMatrix();
    parts.push({ geo: box(r.w, r.h, r.d), col: r.col, m4: o.matrix.clone() });
  }

}

/* 工兵胸墙的可视网格：16 个实例的土垄，随 ttl 生长/消退（1 个 draw call） */

let wkIdx = 0;
const workMeshGeo = mergeGeometries([

const _wkO = new THREE.Object3D();
function fieldworksSync() {

  for (const f of FIELDWORKS) {
    const g = clamp(f.ttl / 1.6, 0, 1);            // 构工有个 1.6 s 的生长过程
    _wkO.position.set(f.x, f.y, f.z);
    _wkO.rotation.set(0, f.rot, 0);
    _wkO.scale.set(f.r / 7, g, 1);

/* 掩体只在胸墙内侧的壕沟/踏台上成立（对称距离会把胸墙外的开阔地也算进去） */
function trenchCover(u) {
  const key = u.army.key, f = trenchFace(key);
  const s = (u.cz - (TRENCH_Z[key] + trenchWob(u.cx) * f)) * f;
  if (s < -3.0 || s > 1.5) return 0;
  if (Math.abs(u.cx) > HALF_TRENCH) return 0;
  /* 站在出击口里没有胸墙可依，掩护随之消失（与几何一致） */
  const base = u.state === 'melee' || u.state === 'charge' ? 0.25 : 1;
  return base * (1 - 0.85 * breachFactor(u.cx));
}
/* 工兵就地构筑的野战胸墙：只对己方生效、位置判定（方向性仍由 coverAgainst 施加）。
   这是"技能"真的接进模拟的一环——不是只播一段挖土动画。 */
const FIELDWORKS = [];
function fieldCover(u) {
  let c = 0;
  for (const f of FIELDWORKS) {
    if (f.side !== u.army.key || f.ttl <= 0) continue;
    const d = Math.hypot(u.cx - f.x, u.cz - f.z);
    if (d < f.r) c = Math.max(c, f.cover * clamp(1 - d / f.r, 0, 1));
  }
  return c;
}
/* 综合掩体：战壕工事、随机障碍物、堡垒、工兵胸墙、友军坦克车体取较优者
   （位置判定；方向性统一由 coverAgainst 施加，所以坦克只能挡正面火力） */
function coverAt(u) {
  return Math.max(trenchCover(u), obstacleCover(u.cx, u.cz), fortCover(u), fieldCover(u), u.tankCoverAmt || 0, craterCover(u.cx, u.cz));
}
/* 方向性：只有来自胸墙一侧的火力才被掩体削弱（侧射/背射不吃掩护） */
function coverAgainst(tgt, shooterZ) {
  const f = tgt.army.key === 'union' ? 1 : -1;
  return (shooterZ - tgt.cz) * f > 0 ? (tgt.cover || 0) : 0;
}

/* ---------- 通用刚体池：一个部件一个 InstancedMesh ---------- */
const _rigO = new THREE.Object3D();
_rigO.rotation.order = 'YXZ';
const _rigRoot = new THREE.Matrix4();
const _rigPart = new THREE.Matrix4();
class RigPool {
  constructor(parts, count, mats) {
    this.count = count;
    this.hidden = new THREE.Matrix4().makeScale(0, 0, 0);
    this.parts = [];
    /* 小于一个阴影纹素的部件（桨叶/桨盘/座舱盖/机徽/桨毂）不投影：
       太阳贴图 2048 覆盖 ±170 m 已是 0.166 m/texel，这些部件投出来只是一团糊影。 */
    const noShadow = new Set(['blur', 'blades', 'glass', 'canopy', 'mark', 'spinner', 'propL', 'propR', 'blurL', 'blurR']);
    for (const def of parts) {
      const mesh = new THREE.InstancedMesh(def.geo, mats[def.mat], count);
      mesh.castShadow = !noShadow.has(def.id);
      mesh.frustumCulled = false;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let i = 0; i < count; i++) {
        mesh.setMatrixAt(i, this.hidden);
        mesh.setColorAt(i, _pc.setRGB(1, 1, 1));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);
      const local = new THREE.Object3D();
      local.rotation.order = 'YXZ';
      local.position.set(def.pos[0], def.pos[1], def.pos[2]);
      local.updateMatrix();
      this.parts.push({ def, mesh, local });
    }
  }
  paint(idx, cols) {
    for (const P of this.parts) {
      const c = P.def.paint && cols[P.def.paint] ? cols[P.def.paint] : [1, 1, 1];
      P.mesh.setColorAt(idx, _pc.setRGB(c[0], c[1], c[2]));
      P.mesh.instanceColor.needsUpdate = true;
    }
  }
  write(idx, x, y, z, yaw, pitch, roll, dyn) {
    _rigO.position.set(x, y, z);
    _rigO.rotation.set(-pitch, yaw, roll);
    _rigO.updateMatrix();
    _rigRoot.copy(_rigO.matrix);
    for (const P of this.parts) {
      const d = P.def;
      if (d.dyn === 'yaw') P.local.rotation.set(0, dyn.yaw, 0);
      else if (d.dyn === 'barrel') P.local.rotation.set(-dyn.pitch, dyn.yaw, 0);
      else if (d.dyn === 'prop') P.local.rotation.set(0, 0, dyn.prop);
      else if (d.dyn === 'wheel') P.local.rotation.set(dyn.wheel || 0, 0, 0);
      if (d.dyn) P.local.updateMatrix();
      _rigPart.multiplyMatrices(_rigRoot, P.local.matrix);
      P.mesh.setMatrixAt(idx, _rigPart);
    }
  }
  hide(idx) { for (const P of this.parts) P.mesh.setMatrixAt(idx, this.hidden); }
  /* 只藏一个部件（断翼用）：write() 之后调用，会覆盖该部件的矩阵 */
  hidePart(idx, id) { for (const P of this.parts) if (P.def.id === id) P.mesh.setMatrixAt(idx, this.hidden); }
  flush() { for (const P of this.parts) P.mesh.instanceMatrix.needsUpdate = true; }
}

/* 函数声明而非 const 箭头：河道桥（文件前部）就要用到它，声明提升才来得及 */
function tinted(geo, hex) {
  const c = new THREE.Color(hex), n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}

function emitTracer(x, y, z, vx, vy, vz, ttl, hdr) {
  const t = tracers[tracerIdx++ % TRACER_COUNT];
  t.on = true; t.x = x; t.y = y; t.z = z; t.vx = vx; t.vy = vy; t.vz = vz;

/* 弹道诸元（含重力抬高修正）：给定炮口/目标点与初速，解出低伸弹道的发射速度与飞行时间。
   曳光弹会下坠、也会打在地面/胸墙上，所以必须真的按抛物线飞：
   不给这个修正，200 m 外就会明显打短（子弹先落地，弹着点在目标之前）。 */
function ballisticVel(x, y, z, tx, ty, tz, sp) {
  const dx = tx - x, dy = ty - y, dz = tz - z;
  const flat = Math.hypot(dx, dz) || 1;
  const v2 = sp * sp;
  const disc = v2 * v2 - GRAV * (GRAV * flat * flat + 2 * dy * v2);
  /* disc<0 = 该初速打不到：退化为 45°（能打多远算多远） */
  const ang = disc < 0 ? Math.PI / 4 : Math.atan2(v2 - Math.sqrt(disc), GRAV * flat);
  const c = Math.cos(ang);
  return { vx: dx / flat * sp * c, vz: dz / flat * sp * c, vy: sp * Math.sin(ang), t: flat / Math.max(1e-3, sp * c) };
}
/* 朝目标点发射一发带重力诸元的曳光弹（spread 是视觉散布，只走 vrnd） */
function emitTracerAimed(x, y, z, tx, ty, tz, sp, hdr, spread) {
  const b = ballisticVel(x, y, z, tx, ty, tz, sp);
  const k = spread || 0;
  emitTracer(x, y, z,
    b.vx + (vrnd() - 0.5) * k, b.vy + (vrnd() - 0.5) * k, b.vz + (vrnd() - 0.5) * k,
    b.t + 0.08, hdr);
  return b;
}

  const cp = Math.cos(a.pitch), fwd = 4.2;

  const b = ballisticVel(r.x, r.y, r.z, tx, ty, tz, 150);
  r.vx = b.vx + (rnd() - 0.5) * 3.0; r.vy = b.vy + (rnd() - 0.5) * 3.0; r.vz = b.vz + (rnd() - 0.5) * 3.0;

function rocketImpact(r) {
  const foe = armyOf(foeSideOf(r.side));
  explodeGround(r.x, r.z, 0.9);
  const hits = blastCasualties(foe, r.x, r.z, 7.5, 4, 0.65);
  if (hits > 0) blog(r.label + '命中 ' + foe.side.label + ' 队列 — ' + hits + ' 人倒下', '#e8a060');

    if (Math.hypot(t.x - r.x, t.z - r.z) < 9 && rnd() < 0.55) damageTank(t, 110 + rnd() * 70, r.label);
  }
  for (const F of FORT) {
    if (F.dead || F.side === r.side) continue;

}
function rocketsUpdate(dt) {
  for (const r of rockets) {
    if (!r.on) continue;
    r.ttl -= dt;
    if (r.thrust > 0) {                       // 动力段
      r.thrust -= dt;
      const sp = Math.hypot(r.vx, r.vy, r.vz) || 1, k = 140 * dt / sp;
      r.vx += r.vx * k; r.vy += r.vy * k; r.vz += r.vz * k;

    r.vy -= GRAV * dt;
    r.x += r.vx * dt; r.y += r.vy * dt; r.z += r.vz * dt;

/* 三座炮眼只定义一次：几何（炮眼/炮管）与弹道起点（fireShell 的 gun.x/z/muzzleY）

const FORT_GUN_LX = [-9, 0, 9];
const FORT_GUN_PORT_Z = 12.0, FORT_GUN_MUZZLE_Z = 13.7, FORT_GUN_Y = 5.9;
function buildFortressGeo() {

  P.push(tinted(at(cyl(0.1, 7.6, 3.6, 8), 0, 16.6, 0), roof));
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {            // 四角棱堡

    P.push(tinted(at(cyl(6.7, 6.7, 0.9, 6), sx * 13, 7.6, sz * 11), dark));
  }
  P.push(tinted(at(box(26, 5.2, 2.8), 0, 2.6, 11), stone));        // 幕墙
  P.push(tinted(at(box(26, 5.2, 2.8), 0, 2.6, -11), stone));
  P.push(tinted(at(box(2.8, 5.2, 22), 13, 2.6, 0), stone));
  P.push(tinted(at(box(2.8, 5.2, 22), -13, 2.6, 0), stone));
  for (let i = -6; i <= 6; i++) {                                 // 雉堞
    P.push(tinted(at(box(1.5, 1.2, 0.95), i * 1.95, 5.8, 11), dark));
    P.push(tinted(at(box(1.5, 1.2, 0.95), i * 1.95, 5.8, -11), dark));
    P.push(tinted(at(box(0.95, 1.2, 1.5), 13, 5.8, i * 1.95), dark));
    P.push(tinted(at(box(0.95, 1.2, 1.5), -13, 5.8, i * 1.95), dark));
  }
  P.push(tinted(at(box(6.4, 6.2, 2.6), 0, 3.1, 12.7), wood));       // 城门
  P.push(tinted(at(box(7.4, 1.3, 3.2), 0, 6.6, 12.7), dark));
  for (const gx of FORT_GUN_LX) {                                 // 三座炮眼
    P.push(tinted(at(box(2.6, 1.1, 2.6), gx, FORT_GUN_Y - 0.3, FORT_GUN_PORT_Z), dark));
    const b = cyl(0.30, 0.36, 4.4, 10); b.rotateX(Math.PI / 2);
    P.push(tinted(at(b, gx, FORT_GUN_Y, FORT_GUN_MUZZLE_Z), iron));

const FORT = [];
{

/* 堡垒掩护：只对友军、位置判定；方向性由 coverAgainst 统一施加 */
function fortCover(u) {
  let c = 0;
  for (const F of FORT) {
    if (F.dead || F.side !== u.army.key) continue;
    const d = Math.hypot(u.cx - F.x, u.cz - F.z);
    if (d < 48) c = Math.max(c, clamp(1 - d / 48, 0, 1) * 0.5);
  }
  return c;
}
function fortUpdate(dt) {
  for (const F of FORT) {
    if (F.dead) continue;
    const foe = armyOf(F.foe);
    let best = null, bd = 1e9;
    for (const u of foe.units) {
      if (u.kind === 'art' || u.men <= 0 || u.gone || u.state === 'rout') continue;
      const d = Math.hypot(u.cx - F.x, u.cz - F.z);
      if (d < F.range && d < bd) { bd = d; best = u; }
    }
    /* 攻城只在射程内：堡垒射程已缩短，跨图互轰不再成立 */
    let foeFort = FORT.find(o => o.side === F.foe && !o.dead) || null;
    if (foeFort && Math.hypot(foeFort.x - F.x, foeFort.z - F.z) > F.range) foeFort = null;
    for (const g of F.guns) {
      g.army = armyOf(F.side); g.tank = null; g.crew = [];
      /* 每 4 发里有 1 发打对方堡垒（攻城）：又出戏，又能真的把对手的耐久打下去。
         没有步兵目标时必须允许打堡垒，否则 seq 不前进会永久卡死（3/4 的发次都不满足条件）。 */
      g.targetUnit = best;
      g.fort = foeFort ? (!best || (g.seq || 0) % 4 === 3 ? foeFort : null) : null;
      g.reload = Math.max(-1, g.reload - dt);
      if ((best || g.fort) && B.t > 6 && !B.over && g.reload <= 0) {
        g.seq = (g.seq || 0) + 1;
        /* 每 WMD_FORT_EVERY 发里 1 发大规模杀伤弹（伤害小、范围大、地形改变大） */
        g.wmd = g.seq % WMD_FORT_EVERY === 0;
        g.wmdLabel = '要塞重炮';
        g.reload = (g.wmd ? 15 : 7.5) + rnd() * 3;
        fireShell(g);
      }
    }
  }
}
function damageFort(F, dmg, by) {
  if (F.dead) return;
  F.hp -= dmg;
  if (F.hp <= 0) {
    F.dead = true;
    F.mat.color.setHex(0x6a6355);                    // 烧毁：整座压成焦石色（不是纯黑剪影）
    for (let i = 0; i < 4; i++) explodeGround(F.x + (vrnd() - 0.5) * 16, F.z + (vrnd() - 0.5) * 14, 1.7);
    blog((F.side === 'union' ? '联邦' : '邦联') + '重型堡垒被' + by + '摧毁！', '#f0a070');
  }
}
